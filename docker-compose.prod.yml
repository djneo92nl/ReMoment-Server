services:
    app:
        # Host networking: SSDP/mDNS multicast (Sonos, B&O, DLNA discovery) does not
        # cross a Docker bridge. Sibling services are therefore reached on 127.0.0.1.
        network_mode: host
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'remoment/app:latest'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            SUPERVISOR_PHP_USER: 'sail'
            APP_PORT: '${APP_PORT:-80}'
            QUEUE_WORKERS: '${QUEUE_WORKERS:-1}'
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
            - './docker/8.4/supervisord.prod.conf:/etc/supervisor/conf.d/supervisord.conf'
            # Own music files: add both paths as local storage locations (/settings/storage).
            - '${MUSIC_DIR:-/srv/music}:${MUSIC_DIR:-/srv/music}'
            - '${LIBRARY_DIR:-/srv/library}:${LIBRARY_DIR:-/srv/library}'
        depends_on:
            redis:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - 'remoment-redis:/data'
        networks:
            - remoment
        healthcheck:
            test: [CMD, redis-cli, ping]
            retries: 3
            timeout: 5s
        restart: unless-stopped

    meilisearch:
        image: 'getmeili/meilisearch:latest'
        environment:
            MEILI_NO_ANALYTICS: 'true'
        ports:
            - '127.0.0.1:7700:7700'
        volumes:
            - 'remoment-meilisearch:/meili_data'
        networks:
            - remoment
        healthcheck:
            test: [CMD, wget, '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
            retries: 3
            timeout: 5s
        restart: unless-stopped

    mosquitto:
        image: eclipse-mosquitto:2
        ports:
            - '1883:1883'
            - '9001:9001'
        volumes:
            - './docker/mosquitto/config:/mosquitto/config'
            - 'remoment-mosquitto-data:/mosquitto/data'
            - 'remoment-mosquitto-log:/mosquitto/log'
        networks:
            - remoment
        restart: unless-stopped

    # Opt-in audio analysis (BPM, key, mood): docker compose --profile analysis up -d, then set
    # ANALYSIS_ENABLED=true and ANALYSIS_ESSENTIA_URL=http://127.0.0.1:8090 (docs/architecture/audio-analysis.md).
    analysis:
        profiles: [analysis]
        build:
            context: './docker/analysis'
            args:
                ESSENTIA_ML: '${ANALYSIS_ESSENTIA_ML_BUILD:-0}'
        image: 'remoment/analysis:latest'
        ports:
            - '127.0.0.1:8090:8090'
        volumes:
            - 'remoment-analysis-models:/models'
        networks:
            - remoment
        restart: unless-stopped

    # Opt-in Spotify stream: docker compose --profile spotify-stream up -d, then set LIBRESPOT_ENABLED=true
    # (docs/architecture/spotify-stream.md). Icecast is published on ICECAST_PORT for the speakers; librespot
    # runs on the host network so Spotify's zeroconf discovery reaches the LAN, and reaches Icecast and the app on 127.0.0.1.
    icecast:
        profiles: [spotify-stream]
        build:
            context: './docker/icecast'
        image: 'remoment/icecast:latest'
        environment:
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_ADMIN_USER: '${ICECAST_ADMIN_USER:-admin}'
            ICECAST_ADMIN_PASSWORD: '${ICECAST_ADMIN_PASSWORD:-remoment}'
        ports:
            - '${ICECAST_PORT:-8000}:8000'
        networks:
            - remoment
        restart: unless-stopped

    librespot:
        profiles: [spotify-stream]
        network_mode: host
        build:
            context: './docker/librespot'
        image: 'remoment/librespot:latest'
        environment:
            LIBRESPOT_NAME: '${LIBRESPOT_NAME:-ReMoment Stream}'
            LIBRESPOT_EVENT_SECRET: '${LIBRESPOT_EVENT_SECRET:-remoment}'
            # MP3 bitrate of the stream; the encoder runs around the clock, so a Pi may want 192.
            STREAM_BITRATE: '${LIBRESPOT_STREAM_BITRATE:-320}'
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_HOST: '127.0.0.1'
            ICECAST_PORT: '${ICECAST_PORT:-8000}'
            ICECAST_MOUNT: '${ICECAST_MOUNT:-spotify.mp3}'
            REMOMENT_URL: 'http://127.0.0.1:${APP_PORT:-80}'
        volumes:
            - 'remoment-librespot-cache:/cache'
        depends_on:
            - icecast
        restart: unless-stopped

networks:
    remoment:
        driver: bridge

volumes:
    remoment-librespot-cache:
    remoment-analysis-models:
    remoment-redis:
    remoment-meilisearch:
    remoment-mosquitto-data:
    remoment-mosquitto-log:
