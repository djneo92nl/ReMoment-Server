# Profiles (docs/architecture/profiles.md): PROFILE=control|standard|full in .env picks what the app runs; COMPOSE_PROFILES in
# .env (written by ansible/templates/env.j2) picks the containers: `db` (MariaDB, Standard and Full), `search` (Meilisearch,
# Full, optional and unused by the app today), `analysis`, `structure`, `stems` (Full) and the opt-in stream profiles.
# Control needs only app, redis and mosquitto, and keeps SQLite in the `remoment-sqlite` volume (never a bind mount).
# Hand-started installs that used MariaDB before profiles: add `db` to COMPOSE_PROFILES (`docker compose --profile db up -d`).
services:
    app:
        # Host networking: SSDP/mDNS multicast (Sonos, B&O, DLNA discovery) does not
        # cross a Docker bridge. Sibling services are therefore reached on 127.0.0.1.
        network_mode: host
        build:
            context: './docker'
            dockerfile: frankenphp/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'remoment/app:latest'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            SUPERVISOR_PHP_USER: 'sail'
            APP_PORT: '${APP_PORT:-80}'
            QUEUE_WORKERS: '${QUEUE_WORKERS:-1}'
            # control | standard | full: which supervisor programs start (docker/8.4/profile-env.sh) and what the app runs.
            PROFILE: '${PROFILE:-standard}'
            # FrankenPHP PHP threads serving requests concurrently (docker/frankenphp/Caddyfile).
            FRANKENPHP_THREADS: '${FRANKENPHP_THREADS:-4}'
            # classic (default) | worker (Octane, opt-in, Standard and Full only; costs RAM per worker, docs/architecture/frankenphp.md).
            FRANKENPHP_MODE: '${FRANKENPHP_MODE:-classic}'
            FRANKENPHP_WORKERS: '${FRANKENPHP_WORKERS:-2}'
            MAX_REQUESTS: '${MAX_REQUESTS:-500}'
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html'
            - './docker/8.4/supervisord.prod.conf:/etc/supervisor/conf.d/supervisord.conf'
            # Own music files: add both paths as local storage locations (/settings/storage).
            - '${MUSIC_DIR:-/srv/music}:${MUSIC_DIR:-/srv/music}'
            - '${LIBRARY_DIR:-/srv/library}:${LIBRARY_DIR:-/srv/library}'
            # Control's SQLite file (DB_DATABASE=/data/sqlite/database.sqlite): a named volume, because SQLite's locking
            # does not survive a bind mount (docs/architecture/database.md). Unused by Standard and Full.
            - 'remoment-sqlite:/data/sqlite'
        depends_on:
            mariadb:
                condition: service_healthy
                # Not started in Control (compose profile `db`).
                required: false
            redis:
                condition: service_healthy
        # Supervisor waits up to 3660 s for the storage worker to finish its job (stopwaitsecs in supervisord.prod.conf); Docker's 10 s default would SIGKILL it first.
        stop_grace_period: 3700s
        restart: unless-stopped

    # The app runs on the host network, so MariaDB is published on loopback only.
    mariadb:
        profiles: [db]
        image: 'mariadb:11.4'
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
            MARIADB_DATABASE: '${DB_DATABASE:-remoment}'
            MARIADB_USER: '${DB_USERNAME:-remoment}'
            MARIADB_PASSWORD: '${DB_PASSWORD}'
        ports:
            - '127.0.0.1:3306:3306'
        volumes:
            - 'remoment-mariadb:/var/lib/mysql'
        networks:
            - remoment
        healthcheck:
            test: [CMD, healthcheck.sh, '--connect', '--innodb_initialized']
            interval: 5s
            retries: 10
            timeout: 5s
        restart: unless-stopped

    redis:
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - 'remoment-redis:/data'
        networks:
            - remoment
        healthcheck:
            test: [CMD, redis-cli, ping]
            retries: 3
            timeout: 5s
        restart: unless-stopped

    # Optional and unused: nothing in the app talks to Meilisearch (no Scout; search is MariaDB). Full may start it
    # with COMPOSE_PROFILES=...,search; it costs hundreds of MB, so no other profile does.
    meilisearch:
        profiles: [search]
        image: 'getmeili/meilisearch:latest'
        environment:
            MEILI_NO_ANALYTICS: 'true'
        ports:
            - '127.0.0.1:7700:7700'
        volumes:
            - 'remoment-meilisearch:/meili_data'
        networks:
            - remoment
        healthcheck:
            test: [CMD, wget, '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
            retries: 3
            timeout: 5s
        restart: unless-stopped

    mosquitto:
        image: eclipse-mosquitto:2
        ports:
            - '1883:1883'
            - '9001:9001'
        volumes:
            - './docker/mosquitto/config:/mosquitto/config'
            - 'remoment-mosquitto-data:/mosquitto/data'
            - 'remoment-mosquitto-log:/mosquitto/log'
        networks:
            - remoment
        restart: unless-stopped

    # Opt-in audio analysis (BPM, key, mood): docker compose --profile analysis up -d, then set
    # ANALYSIS_ENABLED=true and ANALYSIS_ESSENTIA_URL=http://127.0.0.1:8090 (docs/architecture/audio-analysis.md).
    analysis:
        profiles: [analysis]
        build:
            context: './docker/analysis'
            args:
                ESSENTIA_ML: '${ANALYSIS_ESSENTIA_ML_BUILD:-0}'
        image: 'remoment/analysis:latest'
        # Analysis runs around the clock; without a cap it starves the web workers and MariaDB.
        cpus: '${ANALYSIS_CPUS:-1.5}'
        cpu_shares: 256
        ports:
            - '127.0.0.1:8090:8090'
        volumes:
            - 'remoment-analysis-models:/models'
        networks:
            - remoment
        restart: unless-stopped

    # Opt-in structure service (sections of one track, on demand): docker compose --profile structure up -d, then set
    # STRUCTURE_URL=http://127.0.0.1:8091 (docs/architecture/structure-service.md). amd64 and arm64.
    structure:
        profiles: [structure]
        build:
            context: './docker/structure'
        image: 'remoment/structure:latest'
        # Runs only when someone asks for the sections of a track, but a track takes the CPU for a few seconds.
        cpus: '${STRUCTURE_CPUS:-1.5}'
        cpu_shares: 256
        environment:
            STRUCTURE_MAX_DURATION: '${STRUCTURE_MAX_DURATION:-1200}'
        ports:
            - '127.0.0.1:8091:8091'
        networks:
            - remoment
        restart: unless-stopped

    # Opt-in stems service (per-stem loudness lanes of one track, on demand): docker compose --profile stems up -d, then set
    # STEMS_URL=http://127.0.0.1:8092 (docs/architecture/stems-service.md). About 1.5 GB RAM and all the CPU it may use for
    # minutes per track; the model weights download at first use into the volume. arm64 verified, amd64 unverified.
    stems:
        profiles: [stems]
        build:
            context: './docker/stems'
        image: 'remoment/stems:latest'
        cpus: '${STEMS_CPUS:-2}'
        cpu_shares: 256
        mem_limit: '${STEMS_MEM_LIMIT:-3g}'
        environment:
            STEMS_MAX_DURATION: '${STEMS_MAX_DURATION:-1200}'
            STEMS_THREADS: '${STEMS_THREADS:-2}'
        volumes:
            - 'remoment-stems-models:/models'
        ports:
            - '127.0.0.1:8092:8092'
        networks:
            - remoment
        restart: unless-stopped

    # Opt-in Spotify stream: docker compose --profile spotify-stream up -d, then set LIBRESPOT_ENABLED=true
    # (docs/architecture/spotify-stream.md). Icecast is published on ICECAST_PORT for the speakers; librespot
    # runs on the host network so Spotify's zeroconf discovery reaches the LAN, and reaches Icecast and the app on 127.0.0.1.
    icecast:
        profiles: [spotify-stream, beolink-stream, radio-relay]
        build:
            context: './docker/icecast'
        image: 'remoment/icecast:latest'
        environment:
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_ADMIN_USER: '${ICECAST_ADMIN_USER:-admin}'
            ICECAST_ADMIN_PASSWORD: '${ICECAST_ADMIN_PASSWORD:-remoment}'
        ports:
            - '${ICECAST_PORT:-8000}:8000'
        networks:
            - remoment
        restart: unless-stopped

    librespot:
        profiles: [spotify-stream]
        network_mode: host
        build:
            context: './docker/librespot'
        image: 'remoment/librespot:latest'
        environment:
            LIBRESPOT_NAME: '${LIBRESPOT_NAME:-ReMoment Stream}'
            LIBRESPOT_EVENT_SECRET: '${LIBRESPOT_EVENT_SECRET:-remoment}'
            # MP3 bitrate of the stream; the encoder runs around the clock, so a Pi may want 192.
            STREAM_BITRATE: '${LIBRESPOT_STREAM_BITRATE:-320}'
            # One MP3 per Spotify track, served on TRACK_PORT, for renderers that show per-item art.
            TRACKS_ENABLED: '${LIBRESPOT_TRACKS:-false}'
            TRACK_PORT: '${LIBRESPOT_TRACK_PORT:-8010}'
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_HOST: '127.0.0.1'
            ICECAST_PORT: '${ICECAST_PORT:-8000}'
            ICECAST_MOUNT: '${ICECAST_MOUNT:-spotify.mp3}'
            REMOMENT_URL: 'http://127.0.0.1:${APP_PORT:-80}'
        volumes:
            - 'remoment-librespot-cache:/cache'
        depends_on:
            - icecast
        restart: unless-stopped

    # Opt-in BeoLink stream (docs/architecture/beolink-stream.md): a B&O NetworkLink listener whose audio is served on a
    # second Icecast mount. Host network: B&O products find it by mDNS and open sessions to it (5222) and stream to it
    # (UDP/TCP 1234); its Mozart API listens on BEOLINK_API_PORT (the server joins and leaves a source through it).
    beolink:
        profiles: [beolink-stream]
        network_mode: host
        build:
            context: './docker'
            dockerfile: 'beolink/Dockerfile'
        image: 'remoment/beolink:latest'
        environment:
            BEOLINK_NAME: '${BEOLINK_NAME:-ReMoment Stream}'
            BEOLINK_API_PORT: '${BEOLINK_API_PORT:-8081}'
            BEO_ENROL: '${BEOLINK_ENROL:-false}'
            STREAM_BITRATE: '${BEOLINK_STREAM_BITRATE:-192}'
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_HOST: '127.0.0.1'
            ICECAST_PORT: '${ICECAST_PORT:-8000}'
            ICECAST_BEOLINK_MOUNT: '${ICECAST_BEOLINK_MOUNT:-beolink.mp3}'
        depends_on:
            - icecast
        restart: unless-stopped

networks:
    remoment:
        driver: bridge

volumes:
    remoment-sqlite:
    remoment-mariadb:
    remoment-librespot-cache:
    remoment-analysis-models:
    remoment-stems-models:
    remoment-redis:
    remoment-meilisearch:
    remoment-mosquitto-data:
    remoment-mosquitto-log:
