---
# Create the ReMoment LXC container on an existing Proxmox VE host. Safe to re-run.
# Usage: ansible-playbook -i ansible/inventory.yml ansible/proxmox.yml
#
# Then: setup.yml and deploy.yml against the new container.
# Skip this playbook if you already have a Debian VM/host: point remoment_server at it.

- name: Create ReMoment container on Proxmox
  hosts: proxmox
  become: false
  vars:
      ct_public_key: "{{ lookup('ansible.builtin.file', proxmox_ssh_public_key | expanduser) }}"

  tasks:
      # Re-runs find the container again by hostname; a new one gets the highest
      # existing VM/CT id + 1 (or proxmox_ct_id when set).
      - name: Look for an existing container with this hostname
        ansible.builtin.shell:
            cmd: set -o pipefail; pct list | awk -v n='{{ proxmox_ct_hostname }}' '$NF == n {print $1}' | head -n1
            executable: /bin/bash
        register: ct_existing
        changed_when: false

      - name: Pick the next free id
        ansible.builtin.shell:
            cmd: >-
                set -o pipefail; pvesh get /cluster/resources --type vm --output-format json
                | python3 -c 'import json,sys; print(max([int(r["vmid"]) for r in json.load(sys.stdin)] + [99]) + 1)'
            executable: /bin/bash
        register: ct_next
        changed_when: false
        when: ct_existing.stdout == '' and not proxmox_ct_id

      - name: Settle on the container id
        ansible.builtin.set_fact:
            ct_id: "{{ ct_existing.stdout if ct_existing.stdout != '' else (proxmox_ct_id | default('', true) | string or ct_next.stdout) }}"

      - name: Check whether the container exists
        ansible.builtin.command: pct status {{ ct_id }}
        register: ct_status
        failed_when: false
        changed_when: false

      # NFS exports from the NAS are mounted on the PVE host (an unprivileged container can't
      # mount NFS itself) and bind-mounted into the container below.
      - name: Install the NFS client
        ansible.builtin.apt:
            name: nfs-common
            state: present
        when: (proxmox_music_nfs ~ proxmox_library_nfs) | length > 0

      - name: Mount the music export on the PVE host
        ansible.posix.mount:
            src: "{{ proxmox_music_nfs }}"
            path: "{{ proxmox_nfs_mount_base }}/music"
            fstype: nfs
            opts: "_netdev,nofail{{ ',ro' if proxmox_music_readonly | bool else '' }}"
            state: mounted
        when: proxmox_music_nfs | length > 0 and proxmox_music_host_path | length == 0

      - name: Mount the library export on the PVE host
        ansible.posix.mount:
            src: "{{ proxmox_library_nfs }}"
            path: "{{ proxmox_nfs_mount_base }}/library"
            fstype: nfs
            opts: _netdev,nofail
            state: mounted
        when: proxmox_library_nfs | length > 0 and proxmox_library_host_path | length == 0

      - name: Find the latest Debian template
        ansible.builtin.shell:
            cmd: set -o pipefail; pveam available --section system | awk -v arch="$(dpkg --print-architecture)" '$2 ~ /{{ proxmox_template_pattern }}/ && $2 ~ ("_" arch "[.]") {print $2}' | sort -V | tail -n1
            executable: /bin/bash
        register: ct_template
        changed_when: false
        when: ct_status.rc != 0

      - name: Download the template
        ansible.builtin.command: pveam download {{ proxmox_template_storage }} {{ ct_template.stdout }}
        args:
            creates: "/var/lib/vz/template/cache/{{ ct_template.stdout }}"
        when: ct_status.rc != 0

      - name: Create the container
        ansible.builtin.command: >-
            pct create {{ ct_id }} {{ proxmox_template_storage }}:vztmpl/{{ ct_template.stdout }}
            --hostname {{ proxmox_ct_hostname }}
            --cores {{ proxmox_ct_cores }}
            --memory {{ proxmox_ct_memory }}
            --swap {{ proxmox_ct_swap }}
            --rootfs {{ proxmox_ct_disk_storage }}:{{ proxmox_ct_disk_size }}
            --net0 {{ ('name=eth0,bridge=' ~ proxmox_ct_bridge ~ ',ip=dhcp') if proxmox_ct_ip == 'dhcp'
                      else ('name=eth0,bridge=' ~ proxmox_ct_bridge ~ ',ip=' ~ proxmox_ct_ip ~ '/' ~ proxmox_ct_cidr ~ ',gw=' ~ proxmox_ct_gateway) }}
            {{ ('--nameserver ' ~ proxmox_ct_dns) if proxmox_ct_ip != 'dhcp' else '' }}
            --unprivileged 1
            --features nesting=1,keyctl=1
            --onboot 1
            --ostype debian
            --mp0 {{ (music_host_path ~ ',mp=' ~ music_dir ~ (',ro=1' if proxmox_music_readonly | bool else ''))
                     if music_host_path
                     else (proxmox_ct_disk_storage ~ ':' ~ proxmox_music_size ~ ',mp=' ~ music_dir) }}
            --mp1 {{ (library_host_path ~ ',mp=' ~ library_dir) if library_host_path
                     else (proxmox_ct_disk_storage ~ ':' ~ proxmox_library_size ~ ',mp=' ~ library_dir) }}
        when: ct_status.rc != 0

      - name: Start the container
        ansible.builtin.shell: pct status {{ ct_id }} | grep -q running || pct start {{ ct_id }}
        changed_when: false

      - name: Wait for the container network
        ansible.builtin.command: pct exec {{ ct_id }} -- getent hosts deb.debian.org
        register: ct_net
        retries: 15
        delay: 2
        until: ct_net.rc == 0
        changed_when: false

      # Bootstrap SSH access so the other playbooks can reach the container.
      - name: Install SSH server, sudo and Python in the container
        ansible.builtin.command: >-
            pct exec {{ ct_id }} -- bash -c
            'DEBIAN_FRONTEND=noninteractive apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server sudo python3'
        changed_when: false

      - name: Create the deploy user with the SSH key and passwordless sudo
        ansible.builtin.command:
            argv:
                - pct
                - exec
                - "{{ ct_id }}"
                - --
                - bash
                - -c
                - |
                  id {{ hostvars['remoment_server'].ansible_user }} >/dev/null 2>&1 || useradd -m -s /bin/bash -u {{ app_uid }} {{ hostvars['remoment_server'].ansible_user }} || useradd -m -s /bin/bash {{ hostvars['remoment_server'].ansible_user }}
                  d=/home/{{ hostvars['remoment_server'].ansible_user }}/.ssh
                  install -d -m 700 -o {{ hostvars['remoment_server'].ansible_user }} $d
                  echo '{{ ct_public_key | trim }}' > $d/authorized_keys
                  chown {{ hostvars['remoment_server'].ansible_user }}: $d/authorized_keys; chmod 600 $d/authorized_keys
                  echo '{{ hostvars['remoment_server'].ansible_user }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-deploy
                  chmod 440 /etc/sudoers.d/90-deploy
                  systemctl enable --now ssh
        changed_when: false

      - name: Read the container's IP address
        ansible.builtin.shell:
            cmd: pct exec {{ ct_id }} -- hostname -I | awk '{print $1}'
        register: ct_addr
        retries: 15
        delay: 2
        until: ct_addr.stdout | length > 0
        changed_when: false

      - name: Report
        ansible.builtin.debug:
            msg: >-
                Container {{ ct_id }} is up at {{ ct_addr.stdout }}.
                {{ 'It got this address from DHCP: reserve it in your router and ' if proxmox_ct_ip == 'dhcp' else '' }}
                Set ansible_host of remoment_server in inventory.yml to it. Next: setup.yml, then deploy.yml.
