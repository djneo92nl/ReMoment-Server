---
# Deploy or update the ReMoment application. Safe to re-run.
# Usage: ansible-playbook -i ansible/inventory.yml ansible/deploy.yml --ask-vault-pass
#
# First deploy: also run setup.yml first.
# Secrets: ansible-vault encrypt ansible/group_vars/vault.yml

- name: Deploy ReMoment application
  hosts: remoment_servers
  become: false
  vars_files:
      - group_vars/vault.yml

  tasks:
      - name: Clone or update repository
        ansible.builtin.git:
            repo: "{{ app_repo }}"
            dest: "{{ app_dir }}"
            version: "{{ app_branch }}"
            # The server checkout is deploy-only: `npm run build` rewrites the tracked public/build/manifest.json,
            # which would otherwise block every update. Untracked/ignored files (.env, database, storage) are kept.
            force: true
            accept_hostkey: true   # first clone: github.com isn't in known_hosts yet

      - name: Ensure storage directories exist
        ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0775'
        loop:
            - "{{ app_dir }}/storage/app/public"
            - "{{ app_dir }}/storage/framework/cache/data"
            - "{{ app_dir }}/storage/framework/sessions"
            - "{{ app_dir }}/storage/framework/views"
            - "{{ app_dir }}/storage/logs"

      - name: Deploy .env file
        ansible.builtin.template:
            src: templates/env.j2
            dest: "{{ app_dir }}/.env"
            mode: '0640'

      - name: Build Docker image
        ansible.builtin.command:
            # -e rebuild_image=true rebuilds the app image without the layer cache, which is the only way an apt layer
            # (PHP from the ondrej PPA) picks up a newer package. docker/8.4/Dockerfile refuses to build below PHP_MIN_VERSION.
            cmd: "docker compose -f docker-compose.prod.yml build --pull{{ ' --no-cache app' if (rebuild_image | default(false) | bool) else '' }}"
            chdir: "{{ app_dir }}"
        changed_when: true

      - name: Start services
        ansible.builtin.command:
            cmd: docker compose -f docker-compose.prod.yml up -d
            chdir: "{{ app_dir }}"
        changed_when: true

      - name: Wait for app container to be ready
        ansible.builtin.pause:
            seconds: 5

      - name: Install Composer dependencies
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                composer install --no-dev --optimize-autoloader
            chdir: "{{ app_dir }}"
        changed_when: true

      - name: Install npm dependencies
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                npm ci
            chdir: "{{ app_dir }}"
        changed_when: true

      - name: Build frontend assets
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                npm run build
            chdir: "{{ app_dir }}"
        changed_when: true

      - name: Run database migrations
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                php artisan migrate --force
            chdir: "{{ app_dir }}"
        changed_when: true

      # One-time move from SQLite (the database before MariaDB, docs/architecture/database.md): copies the old file
      # into MariaDB, then leaves a marker so a later deploy never copies (and truncates) again. A fresh install has
      # no old file, so nothing happens. Runs before the seed, which would otherwise be overwritten by the copy.
      - name: Look for a SQLite database to move
        ansible.builtin.stat:
            path: "{{ app_dir }}/database/database.sqlite"
        register: old_sqlite

      - name: Look for the SQLite import marker
        ansible.builtin.stat:
            path: "{{ app_dir }}/storage/app/.sqlite-imported"
        register: sqlite_marker

      - name: Copy the SQLite data into MariaDB
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                php artisan db:import-sqlite database/database.sqlite --force
            chdir: "{{ app_dir }}"
        when: old_sqlite.stat.exists and old_sqlite.stat.size > 0 and not sqlite_marker.stat.exists
        register: sqlite_import
        changed_when: true

      # DLNA and Spotify library data is not carried over: the daily Spotify sync and a `library:scan` bring it back.
      - name: Drop the streaming library data (it is reloaded afterwards)
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                php artisan library:drop-streaming --force
            chdir: "{{ app_dir }}"
        when: sqlite_import is changed
        changed_when: true

      - name: Mark the SQLite data as moved
        ansible.builtin.file:
            path: "{{ app_dir }}/storage/app/.sqlite-imported"
            state: touch
            mode: '0664'
        when: sqlite_import is changed
        # The old file stays on disk as a backup; delete it by hand once the library looks right.

      # Creates the admin login on a fresh install (firstOrCreate: never touches an existing one).
      - name: Seed the admin user
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                php artisan db:seed --force
            chdir: "{{ app_dir }}"
        changed_when: true

      # public/storage -> storage/app/public serves the processed artwork (/storage/artwork/...); without it every cover is a 404.
      - name: Link the public storage directory
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                php artisan storage:link --force
            chdir: "{{ app_dir }}"
        changed_when: false

      - name: Optimize Laravel application
        ansible.builtin.command:
            cmd: >
                docker compose -f docker-compose.prod.yml exec -T -u sail app
                php artisan optimize
            chdir: "{{ app_dir }}"
        changed_when: true

      - name: Restart app container to apply changes
        ansible.builtin.command:
            cmd: docker compose -f docker-compose.prod.yml restart app
            chdir: "{{ app_dir }}"
        changed_when: true
