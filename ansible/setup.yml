---
# One-time server preparation. Safe to re-run.
# Usage: ansible-playbook -i ansible/inventory.yml ansible/setup.yml --ask-become-pass

- name: Setup ReMoment server
  hosts: remoment_servers
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
          update_cache: true
          cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
          name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - git
              - acl
          state: present

    - name: Create Docker GPG keyring directory
      ansible.builtin.file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.shell:
          cmd: >
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg
              | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
          repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
              signed-by=/etc/apt/keyrings/docker.gpg]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
          state: present
          filename: docker

    - name: Install Docker
      ansible.builtin.apt:
          name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
          state: present
          update_cache: true

    - name: Enable and start Docker service
      ansible.builtin.systemd:
          name: docker
          enabled: true
          state: started

    - name: Add deploy user to docker group
      ansible.builtin.user:
          name: "{{ ansible_user }}"
          groups: docker
          append: true

    - name: Create app directory
      ansible.builtin.file:
          path: "{{ app_dir }}"
          state: directory
          owner: "{{ ansible_user }}"
          group: "{{ ansible_user }}"
          mode: '0755'

    # mDNS advertisement for client devices runs on the host, not in Docker:
    # multicast does not cross the compose bridge network reliably.
    # See docs/architecture/discovery-for-clients.md.
    - name: Install Avahi (mDNS responder)
      ansible.builtin.apt:
          name: avahi-daemon
          state: present

    - name: Advertise ReMoment as _remoment._tcp
      ansible.builtin.template:
          src: templates/remoment.service.j2
          dest: /etc/avahi/services/remoment.service
          mode: '0644'
      notify: Restart Avahi

    - name: Enable and start Avahi
      ansible.builtin.systemd:
          name: avahi-daemon
          enabled: true
          state: started

    # DLNA media server (MiniDLNA). ReMoment finds it via SSDP and scans it
    # from /settings/dlna. Runs on the host so SSDP multicast works.
    - name: Install MiniDLNA
      ansible.builtin.apt:
          name: minidlna
          state: present
      when: dlna_enabled | bool

    - name: Create DLNA media directory
      ansible.builtin.file:
          path: "{{ dlna_media_dir }}"
          state: directory
          mode: '0755'
      when: dlna_enabled | bool

    - name: Configure MiniDLNA
      ansible.builtin.template:
          src: templates/minidlna.conf.j2
          dest: /etc/minidlna.conf
          mode: '0644'
      when: dlna_enabled | bool
      notify: Restart MiniDLNA

    - name: Enable and start MiniDLNA
      ansible.builtin.systemd:
          name: minidlna
          enabled: true
          state: started
      when: dlna_enabled | bool

  handlers:
    - name: Restart MiniDLNA
      ansible.builtin.systemd:
          name: minidlna
          state: restarted

    - name: Restart Avahi
      ansible.builtin.systemd:
          name: avahi-daemon
          state: restarted
