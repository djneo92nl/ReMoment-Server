# Application settings
app_dir: /opt/remoment
app_repo: git@github.com:djneo92nl/ReMoment-Server.git   # Change to your repo URL
app_branch: main
app_url: http://remoment.local                          # Change to your server's URL or IP
app_port: 80

# Client-facing API contract version, advertised in the mDNS TXT record.
# Keep in sync with App\Http\Controllers\Api\InfoController::API_VERSION.
remoment_api_version: 1

# UID/GID of the deploy user on the server (run: id -u && id -g)
app_uid: 1000
app_gid: 1000

# MQTT settings
mqtt_host: 127.0.0.1
mqtt_port: 1883
mqtt_client_id: remoment-server
# Broker address client devices should use (see GET /api/info).
# Leave empty to use whatever host the client reached the server on.
mqtt_public_host: ''
mqtt_public_port: 1883

# --- Proxmox (proxmox.yml) -------------------------------------------------
# An unprivileged LXC container with nesting enabled (required for Docker).
proxmox_ct_id: ''                      # empty = highest existing VM/CT id + 1; set a number to force one
proxmox_ct_hostname: remoment
proxmox_ct_ip: dhcp                   # 'dhcp', or a fixed address (then gateway/dns/cidr below apply); the playbook prints the address
proxmox_ct_cidr: 24
proxmox_ct_gateway: 192.168.1.1
proxmox_ct_dns: 192.168.1.1
proxmox_ct_bridge: vmbr0
proxmox_ct_cores: 4
proxmox_ct_memory: 4096               # MB
proxmox_ct_swap: 512                  # MB
proxmox_ct_disk_storage: local-lvm    # storage for the root disk
proxmox_ct_disk_size: 32              # GB
proxmox_template_pattern: debian-13-standard   # pveam template to use (e.g. debian-12-standard)
proxmox_template_storage: local       # storage holding container templates
proxmox_ssh_public_key: ~/.ssh/id_rsa.pub   # key (on the control machine) installed for ansible_user

# --- Music files (proxmox.yml, setup.yml) -----------------------------------------
# ReMoment serves its own files. Two folders are mounted into the container and from
# there into the app container, at the same paths; add both as local storage locations
# at /settings/storage:
#   music_dir    the existing music (e.g. on the NAS), indexed in place
#   library_dir  an empty folder ReMoment stores its own files in (imports, uploads)
music_dir: /srv/music
library_dir: /srv/library
# Each comes from, in this order: an NFS export (proxmox.yml mounts it on the PVE host
# and bind-mounts it into the container), a path that already exists on the PVE host, or,
# when both are empty, a dedicated volume of the given size in GB.
# NFS exports look like 192.168.1.50:/volume1/music. See docs/architecture/proxmox-deployment.md
# for what the NAS has to allow.
proxmox_music_nfs: 192.168.1.211:/mnt/Storage/Media/Music
proxmox_library_nfs: 192.168.1.211:/mnt/Storage/Media/remoment
proxmox_music_host_path: ''
proxmox_library_host_path: ''
proxmox_nfs_mount_base: /mnt/remoment    # on the PVE host: music/ and library/ below it
proxmox_music_readonly: true      # false lets ReMoment move/reorganize the existing files
proxmox_music_size: 200
proxmox_library_size: 200
# The PVE host path each one ends up at ('' = a dedicated volume). Derived, no need to edit.
music_host_path: "{{ proxmox_music_host_path or ((proxmox_nfs_mount_base ~ '/music') if proxmox_music_nfs else '') }}"
library_host_path: "{{ proxmox_library_host_path or ((proxmox_nfs_mount_base ~ '/library') if proxmox_library_nfs else '') }}"

# Default-queue workers in the app container (artwork, enrichment, history, scans). More workers
# drain a big backlog faster (e.g. after the first library scan) but each takes RAM and CPU; the
# analysis worker is always one. Takes effect on the next deploy.
queue_workers: 2

# --- Integrations (env.j2) ---------------------------------------------------------
# User-Agent for MusicBrainz, Wikipedia and the other metadata APIs; they ask for a contact address.
metadata_user_agent: "ReMoment/1.0 (remko@djneo.nl)"
# Address the speakers fetch own files from; empty = app_url. Use the IP if speakers can't resolve .local.
stream_base_url: http://192.168.1.109
# MQTT-over-WebSocket for the browser; leave empty to use the request host and port 9001.
mqtt_public_ws_port: 9001
mqtt_ws_url: ''
# Secrets (Spotify, Last.fm, Discogs, TheAudioDB) live in vault.yml.
# Database: MariaDB in the compose stack, loopback only. The password is vault_db_password in vault.yml
# (default `remoment` when unset); changing it later also needs the same change inside MariaDB (ALTER USER).

# --- Audio analysis sidecar (deploy.yml) ----------------------------------------
# Essentia container (BPM, key, mood), see docs/architecture/audio-analysis.md.
# Adds the `analysis` compose profile and the ANALYSIS_* settings to .env.
analysis_enabled: true
# true = the TensorFlow build (mood, arousal/valence, instrumental, genre): a large image,
# ~1 GB of models and a lot of CPU/RAM. Raise proxmox_ct_memory (6144+) and proxmox_ct_cores for it.
analysis_essentia_ml: true
analysis_mood_min_score: 0.7
# Free AcoustID key (https://acoustid.org/new-application) for fingerprint lookups; empty = skip that stage.
acoustid_api_key: '9qtx6EQ9hh'
acoustid_min_score: 0.9

# --- Structure service (deploy.yml) ----------------------------------------------
# Sections of one track, computed on demand by the admin (docs/architecture/structure-service.md): a small
# Python 3.12 + librosa container, 0.5-1 GB RAM while it works. Adds the `structure` compose profile and STRUCTURE_URL to .env.
structure_enabled: false

# --- Spotify stream (env.j2) -----------------------------------------------------
# Spotify on any speaker: librespot (a Spotify Connect receiver) -> ffmpeg -> Icecast serves an MP3
# stream that speakers without Spotify of their own can play, see docs/architecture/spotify-stream.md.
# true switches the feature on in .env (LIBRESPOT_ENABLED). deploy.yml does not start the containers:
# on the host, once, run
#   docker compose -f docker-compose.prod.yml --profile spotify-stream up -d --build
# then press "Play stream" on a speaker at /settings/spotify-connect and pick the receiver in Spotify.
librespot_enabled: true
# Optional, defaults shown. The receiver's name in Spotify's device list.
# librespot_name: ReMoment Stream
# Port speakers fetch the stream from (the host's firewall must allow it).
# icecast_port: 8000
# Experimental: one MP3 per track (own title and cover per item, UPnP renderers only), see
# docs/architecture/spotify-stream.md. Needs the librespot container rebuilt, and its port open on the host.
librespot_tracks: true
librespot_track_port: 8010
# The event secret and the Icecast passwords default to `remoment`; to change them put
# vault_librespot_event_secret, vault_icecast_source_password and vault_icecast_admin_password in vault.yml.