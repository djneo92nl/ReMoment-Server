services:
    laravel.test:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${APP_PORT_ALT:-8080}:${APP_PORT_ALT:-8080}'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            SUPERVISOR_PHP_ALT_PORT: '${APP_PORT_ALT:-8080}'
        volumes:
            - '.:/var/www/html'
            - './docker/8.4/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_started
            meilisearch:
                condition: service_started
    # The database lives in a named volume, never a macOS bind mount: SQLite's file locking does not survive
    # the host/VM boundary (docs/architecture/database.md).
    mariadb:
        image: 'mariadb:11.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD:-remoment}'
            MARIADB_DATABASE: remoment
            MARIADB_USER: remoment
            MARIADB_PASSWORD: '${DB_PASSWORD:-remoment}'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test: [CMD, healthcheck.sh, '--connect', '--innodb_initialized']
            interval: 5s
            retries: 10
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mosquitto:
        image: eclipse-mosquitto:2
        ports:
            - '1883:1883'
            - '9001:9001' # optional WebSocket support
        volumes:
            - './docker/mosquitto/config:/mosquitto/config'
            - 'sail-mosquitto-data:/mosquitto/data'
            - 'sail-mosquitto-log:/mosquitto/log'
        networks:
            - sail

    # Opt-in audio analysis (BPM, key, mood): docker compose --profile analysis up -d, then set
    # ANALYSIS_ENABLED=true and ANALYSIS_ESSENTIA_URL=http://analysis:8090 (docs/architecture/audio-analysis.md).
    analysis:
        profiles: [analysis]
        # Essentia's PyPI wheels exist for x86_64 only (no aarch64), so on an Apple Silicon Mac the sidecar runs emulated.
        platform: linux/amd64
        build:
            context: './docker/analysis'
            args:
                ESSENTIA_ML: '${ANALYSIS_ESSENTIA_ML_BUILD:-0}'
        ports:
            - '${ANALYSIS_PORT:-8090}:8090'
        volumes:
            - 'sail-analysis-models:/models'
        networks:
            - sail

    # Opt-in Spotify stream: docker compose --profile spotify-stream up -d, then LIBRESPOT_ENABLED=true and
    # ICECAST_INTERNAL_URL=http://icecast:8000 (docs/architecture/spotify-stream.md). Docker Desktop does not pass mDNS,
    # so Spotify finds librespot only when the app runs on a Linux host (use docker-compose.prod.yml there).
    icecast:
        profiles: [spotify-stream, beolink-stream]
        build:
            context: './docker/icecast'
        environment:
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_ADMIN_USER: '${ICECAST_ADMIN_USER:-admin}'
            ICECAST_ADMIN_PASSWORD: '${ICECAST_ADMIN_PASSWORD:-remoment}'
        ports:
            - '${ICECAST_PORT:-8000}:8000'
        networks:
            - sail

    librespot:
        profiles: [spotify-stream]
        build:
            context: './docker/librespot'
        environment:
            LIBRESPOT_NAME: '${LIBRESPOT_NAME:-ReMoment Stream}'
            LIBRESPOT_EVENT_SECRET: '${LIBRESPOT_EVENT_SECRET:-remoment}'
            # MP3 bitrate of the stream; the encoder runs around the clock, so a Pi may want 192.
            STREAM_BITRATE: '${LIBRESPOT_STREAM_BITRATE:-320}'
            # One MP3 per Spotify track, served on TRACK_PORT, for renderers that show per-item art.
            TRACKS_ENABLED: '${LIBRESPOT_TRACKS:-false}'
            TRACK_PORT: '${LIBRESPOT_TRACK_PORT:-8010}'
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_HOST: 'icecast'
            ICECAST_MOUNT: '${ICECAST_MOUNT:-spotify.mp3}'
            REMOMENT_URL: 'http://laravel.test'
        ports:
            - '${LIBRESPOT_TRACK_PORT:-8010}:8010'
        volumes:
            - 'sail-librespot-cache:/cache'
        depends_on:
            - icecast
        networks:
            - sail

    # Opt-in BeoLink stream: docker compose --profile beolink-stream up -d, then BEOLINK_ENABLED=true and BEOLINK_API_URL=http://beolink:8081
    # (docs/architecture/beolink-stream.md). The receiver is a B&O listener found by mDNS, which Docker Desktop does not pass:
    # it joins a B&O source only when the stack runs on a Linux host (use docker-compose.prod.yml there).
    beolink:
        profiles: [beolink-stream]
        build:
            context: './docker'
            dockerfile: 'beolink/Dockerfile'
        environment:
            BEOLINK_NAME: '${BEOLINK_NAME:-ReMoment Stream}'
            BEOLINK_API_PORT: '8081'
            # Add this receiver to the network's shared configuration (a change every B&O product holds); off unless asked.
            BEO_ENROL: '${BEOLINK_ENROL:-false}'
            STREAM_BITRATE: '${BEOLINK_STREAM_BITRATE:-192}'
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-remoment}'
            ICECAST_HOST: 'icecast'
            ICECAST_BEOLINK_MOUNT: '${ICECAST_BEOLINK_MOUNT:-beolink.mp3}'
        depends_on:
            - icecast
        networks:
            - sail

networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local
    sail-librespot-cache:
    sail-analysis-models:
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-mosquitto-data:
        driver: local
    sail-mosquitto-log:
        driver: local
