                  status: { type: string, enum: [ok] }
        "403": { description: Forbidden for client devices }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/catalogue/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
