openapi: 3.0.3
info:
  title: ReMoment Server API
  version: "1"
  description: |
    Client API of ReMoment Server (unauthenticated, local network). Covers what a
    playback/library client needs: server info, devices and playback, radio,
    multiroom, the library, and client registration.

    This file is the contract for native clients (the iOS app is generated from /
    checked against it). The prose docs in `docs/api/*.md` and CLAUDE.md stay the
    detailed reference; when an endpoint's shape changes, change this file too.

    **Stable library ids.** `library:merge-duplicates` merges duplicate artists, albums and
    tracks. The id of a merged-away record is kept as an alias: `GET /library/artists/{id}`,
    `/albums/{id}`, `/playlists/{id}`, the favorite endpoints, the library play bodies
    (`track_id`, `album_id`, `artist_id`, `playlist_id`, `start_track_id`), `POST .../queue`
    and `POST /library/playlists/{id}/tracks` accept the old id and act on the surviving
    record. Detail responses carry `canonical_id` (the surviving id; equal to `id` when
    nothing was merged), the favorite responses too; update the cached id from it. Lists
    never contain a retired id. An id that never existed or was removed stays 404 (422 in
    a body). Merges made before this behaviour existed are not covered.

    Not yet described here: per-device settings (`sound-adjustment`, `bluetooth`,
    `network`, `wireless-speakers`, `info` — see `docs/api/device-settings.md`) and
    source controls (`/devices/{id}/controls` — see `docs/api/source-controls.md`).

    **Operation ids.** Every operation has a unique camelCase `operationId` (verb + resource,
    e.g. `movePlayback`, `pressRemoteKey`); it is the operation's name for scene steps and the
    Home Assistant package, so keep it stable. `tests/Feature/ApiContractTest.php` checks this
    file against the routes; see `docs/architecture/action-layer.md`.

    Errors on device endpoints: `503 unreachable`, `422 unsupported`, `502 driver_error`.
    Always check a device's `capabilities` before calling a feature endpoint.
servers:
  - url: http://remoment.local/api
tags:
  - name: Info
  - name: Devices
  - name: Playback
  - name: Radio
  - name: Multiroom
  - name: Library
  - name: Library playback
  - name: Clients
  - name: Players
  - name: Tags
  - name: Scenes
  - name: Sync
  - name: Admin

paths:
  /info:
    get:
      tags: [Info]
      summary: Bootstrap info (addresses as the client reached the server)
      operationId: getInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /devices:
    get:
      tags: [Devices]
      summary: All devices
      operationId: listDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceList" }
  /devices/{device}:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Devices]
      summary: Device detail with now playing
      operationId: getDevice
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DeviceDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{device}/{action}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [play, pause, stop, next, previous] }
    post:
      tags: [Playback]
      summary: Transport control (capability media_controls)
      operationId: transport
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  action: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/volume:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      operationId: getVolume
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
    put:
      tags: [Playback]
      operationId: setVolume
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Volume" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
        "422": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/volume-limits:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: The device's volume limits (a maximum, and a lower one during quiet hours)
      operationId: getVolumeLimits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeLimits" }
  /devices/{device}/mute:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      operationId: getMute
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mute" }
    put:
      tags: [Playback]
      operationId: setMute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mute" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mute" }
  /devices/{device}/seek:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Seek within the current track (capability seek)
      operationId: seek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0, description: Seconds from the start of the track }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  position: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/move:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Move what plays on this device to another device (capability move_playback)
      description: |
        Library tracks continue on the target at the same position with the same queue (tracks the target
        cannot play are left out, `skipped`); radio restarts the station; Spotify is handed over with
        Spotify's own transfer, only to a speaker mapped to a Spotify Connect name. Inputs of the device
        itself (line-in, TV, CD, Bluetooth, AirPlay/Cast) answer `not_movable`. The playing device is stopped
        afterwards unless `stop_source` is false. See docs/api/playback-move.md.
      operationId: movePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_device_id]
              properties:
                to_device_id: { type: integer }
                stop_source: { type: boolean, default: true }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  to: { type: string, description: Name of the target device }
                  kind: { type: string, enum: [library, radio, spotify] }
                  queued: { type: integer }
                  skipped: { type: integer }
                  position: { type: integer, description: Seconds the target was asked to continue from }
        "422": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }
  /sync-groups:
    get:
      tags: [Multiroom]
      summary: Sync groups ("fake multiroom")
      operationId: listSyncGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SyncGroup" } }
    post:
      tags: [Multiroom]
      summary: Make a sync group (members need capability sync_group)
      description: |
        A leader plays, the members follow it: same queue, state and progress (within about two seconds).
        Library tracks and radio only. See docs/api/sync-groups.md.
      operationId: createSyncGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leader_device_id, member_device_ids]
              properties:
                leader_device_id: { type: integer }
                member_device_ids: { type: array, items: { type: integer }, minItems: 1 }
                name: { type: string, nullable: true }
      responses:
        "201":
          description: Made; `failed` lists members that could not start
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SyncGroup" }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: { type: integer }
                        message: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
  /sync-groups/{group}:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [Multiroom]
      summary: End a sync group
      operationId: deleteSyncGroup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stop_members: { type: boolean, default: true }
      responses:
        "200": { description: OK }
  /sync-groups/{group}/members:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Multiroom]
      summary: Add a member to a sync group
      operationId: addSyncGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: integer }
      responses:
        "201": { description: Added }
        "422": { $ref: "#/components/responses/DeviceError" }
  /sync-groups/{group}/members/{device}:
    parameters:
      - { name: group, in: path, required: true, schema: { type: integer } }
      - { $ref: "#/components/parameters/device" }
    put:
      tags: [Multiroom]
      summary: Trim a member (positive plays ahead of the leader)
      operationId: setSyncGroupOffset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_ms]
              properties:
                offset_ms: { type: integer, minimum: -30000, maximum: 30000 }
      responses:
        "200": { description: OK }
    delete:
      tags: [Multiroom]
      summary: Remove a member (the last one ends the group)
      operationId: removeSyncGroupMember
      responses:
        "200": { description: OK }
  /devices/{device}/queue:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Up Next (capability queue)
      operationId: getQueue
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  up_next:
                    type: array
                    items: { $ref: "#/components/schemas/QueueItem" }
    post:
      tags: [Playback]
      summary: Add a track, album, artist or playlist to the queue, or play it next (capabilities queue_add, queue_next)
      operationId: addToQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [track, album, artist, playlist] }
                id: { type: integer }
                next: { type: boolean, description: "Right after the current track instead of at the end" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  next: { type: boolean }
                  tracks: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
    delete:
      tags: [Playback]
      summary: Empty the queue after the current track (capability queue_clear)
      operationId: clearQueue
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/queue/{position}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - { name: position, in: path, required: true, description: "Up-next position, 1 = the first entry of GET /queue", schema: { type: integer, minimum: 1 } }
    delete:
      tags: [Playback]
      summary: Remove the entry at `position` (capability queue_remove)
      operationId: removeFromQueue
      parameters:
        - { name: expect, in: query, description: "The uri the client saw at that position; a changed queue is refused (422 invalid)", schema: { type: string } }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }
    put:
      tags: [Playback]
      summary: Move the entry at `position` to position `to` (capability queue_move)
      operationId: moveInQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: integer, minimum: 1 }
                expect: { type: string }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/queue/jump:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Play the entry `position` places ahead (capability queue_jump)
      operationId: queueJump
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  position: { type: integer }
  /devices/{device}/shuffle:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Capability shuffle
      operationId: setShuffle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shuffle]
              properties:
                shuffle: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shuffle: { type: boolean }
  /devices/{device}/repeat:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Capability repeat
      operationId: setRepeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repeat]
              properties:
                repeat: { $ref: "#/components/schemas/Repeat" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repeat: { $ref: "#/components/schemas/Repeat" }
  /devices/{device}/like:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Save/remove the playing track in the Spotify library (capability like)
      operationId: setLike
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked: { type: boolean }
  /devices/{device}/power:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Wake or standby (capability power). Mozart can only be put in standby.
      operationId: setPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  on: { type: boolean }
        "422": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/sleep:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: The scene-level sleep timer of the device (null when none runs)
      description: |
        A server-side timer, distinct from the device's own `sleep_timer` capability: after N minutes the volume
        fades down, the device stops (or goes to standby) and the volume is put back. See docs/api/scenes.md.
      operationId: getSleep
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf: [{ $ref: "#/components/schemas/SleepTimer" }]
                    nullable: true
    post:
      tags: [Playback]
      summary: Start a sleep timer (fade, then stop or standby, then restore the volume); replaces a running one
      operationId: startSleep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 480 }
                fade_seconds: { type: integer, minimum: 0, maximum: 600, description: "Length of the fade at the end, at most the timer itself; default 60" }
                action: { type: string, enum: [stop, standby], description: "What happens at the end; default stop" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SleepTimer" }
        "422": { $ref: "#/components/responses/DeviceError" }
    delete:
      tags: [Playback]
      summary: Cancel the sleep timer and put a faded volume back (not an error when none runs)
      operationId: cancelSleep
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  cancelled: { type: boolean }

  /devices/{device}/sleep-timer:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Sleep timer in minutes (capability sleep_timer); writable false on the BeoPlay V1
      operationId: getSleepTimer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: { type: integer, description: "Minutes left, 0 = no timer" }
                  min: { type: integer }
                  max: { type: integer }
                  step: { type: integer }
                  writable: { type: boolean }
        "422": { $ref: "#/components/responses/DeviceError" }
    put:
      tags: [Playback]
      summary: Set the sleep timer; 0 cancels it. Answers the new state like GET.
      operationId: setSleepTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 0, maximum: 60 }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/digits:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Press number keys on the active TV / set-top box source (capability digits; BeoPlay V1)
      operationId: sendDigits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digits]
              properties:
                digits: { type: string, pattern: "^[0-9]{1,8}$", example: "105" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  digits: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/keys:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Remote keys the device accepts (capability remote_control; Philips Android TV)
      operationId: listRemoteKeys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  supported_keys:
                    type: array
                    items: { $ref: "#/components/schemas/RemoteKey" }
        "422": { $ref: "#/components/responses/DeviceError" }
    post:
      tags: [Playback]
      summary: Press one remote key (422 unsupported for a key outside supported_keys, 422 invalid for an unknown name)
      operationId: pressRemoteKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { $ref: "#/components/schemas/RemoteKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  key: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/jellyfin:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Jellyfin on a TV - continue watching and next up (Philips TV with a Jellyfin key; a wrapper over /devices/{device}/media, see docs/api/jellyfin.md)
      operationId: jellyfinLists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean, description: "The TV shows its Jellyfin app with nothing playing" }
                  continue_watching: { type: array, items: { $ref: "#/components/schemas/JellyfinTile" } }
                  next_up: { type: array, items: { $ref: "#/components/schemas/JellyfinTile" } }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/jellyfin/play:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Start a Jellyfin item in the Jellyfin app on the TV
      operationId: jellyfinPlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id: { type: string }
                position_ticks: { type: integer, minimum: 0, description: "10 000 000 per second; the tile's ticks to resume" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  item_id: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }

  /media-servers:
    get:
      tags: [Playback]
      summary: Media servers (Jellyfin; more types later) and what each can do (see docs/api/media-servers.md)
      operationId: listMediaServers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MediaServer" } }

  /devices/{device}/media:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Continue watching and next up from every media server that applies to a TV, as normalised items (see docs/api/media-servers.md)
      operationId: deviceMedia
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean, description: "The device shows a media server's app with nothing playing" }
                  servers:
                    type: array
                    description: The servers read for this device; `ok` false for one that did not answer (the others still show)
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        driver: { type: string }
                        ok: { type: boolean }
                  continue_watching: { type: array, items: { $ref: "#/components/schemas/MediaItem" } }
                  next_up: { type: array, items: { $ref: "#/components/schemas/MediaItem" } }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/media/play:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Start a media server's item in its app on the device (see docs/api/media-servers.md)
      operationId: playDeviceMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: { type: string, description: "A listed item's `id` (server id and item id, 3:abc), or a bare item id while one server applies or with `server`" }
                server: { type: integer, description: "Server id for a bare item id" }
                position: { type: number, minimum: 0, description: "Seconds to start from; the item's `resume_position` to resume" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  item: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/sources:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Devices]
      summary: Live source list (capability source_control)
      description: |
        Ordered by `sort_order`. Includes hidden sources (`hidden: true`); pass `visible=1` for the picker
        (visible only). Visibility is household-wide and changed with `PUT /admin/devices/{device}/sources/{source_id}`.
        `in_use` is NOT "selected" on B&O devices; use `active` (absent when the device cannot tell; then match
        `now_playing.source` against `source_type` or name). See `docs/ux/sources.md`. A host's links are in the
        list too: `sub_device` on the source a sub device is connected through.
      operationId: listSources
      parameters:
        - name: visible
          in: query
          required: false
          schema: { type: boolean }
          description: Only sources that are not hidden.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
  /devices/{device}/sources/activate:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Devices]
      summary: Switch to a source (capability source_activation)
      operationId: activateSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  source_id: { type: string }

  /devices/{device}/radio:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Radio]
      summary: Stations playable on this device (capability radio_control)
      operationId: listRadio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items: { $ref: "#/components/schemas/RadioStation" }
  /devices/{device}/radio/{station}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - name: station
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Radio]
      operationId: playRadio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  station: { type: string }
                  relay:
                    type: boolean
                    description: Present and true when the station was started through the radio relay (converted to MP3 by this server) because the device cannot play it itself. See docs/architecture/radio-relay.md.
  /radio/relays:
    get:
      tags: [Radio]
      summary: The radio relay - whether it is on, whether its manager runs, and the relays running or waiting to restart
      operationId: listRadioRelays
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "RADIO_RELAY_ENABLED" }
                  manager: { type: boolean, description: "The `radio:relay` manager reported in the last 15 seconds" }
                  max: { type: integer, description: "Relays allowed at once" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        station_id: { type: integer }
                        station: { type: string, nullable: true }
                        state: { type: string, enum: [running, restarting] }
                        since: { type: string, format: date-time, nullable: true, description: "When the running relay started" }
                        listeners: { type: integer, nullable: true, description: "Renderers on the mount, null while unknown" }
                        failures: { type: integer, description: "Deaths in a row soon after starting (0 once it ran healthy)" }
                        retry_at: { type: string, format: date-time, nullable: true, description: "When a restarting relay starts again" }
                        mount: { type: string }
                        url: { type: string }
  /spotify-stream:
    get:
      tags: [Radio]
      summary: The Spotify stream (librespot to Icecast) - whether it is on, the receiver's name and the MP3 stream URL
      operationId: getSpotifyStream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  name: { type: string }
                  url: { type: string, nullable: true }
  /devices/{device}/spotify-stream:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Radio]
      summary: Play the Spotify stream on this device (capability stream_url); pick the receiver by name in Spotify
      operationId: playSpotifyStream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  url: { type: string }
                  receiver: { type: string }
        "422":
          description: Stream not enabled, or the device cannot play a stream
  /line-ins:
    get:
      tags: [Radio]
      summary: Line-ins - one per ReMoment Node with the line-in role on - with the MP3 stream URL, whether the mount is live and which devices were told to play it
      operationId: listLineIns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: The node's client id }
                        name: { type: string, description: 'Line-in on <node name>' }
                        node_name: { type: string, nullable: true }
                        title: { type: string, description: The fixed now-playing title }
                        mount: { type: string }
                        url: { type: string }
                        node_online: { type: boolean }
                        node_state: { type: string, description: "idle, busy, error, absent or unknown (the node's last heartbeat)" }
                        detail: { type: string, nullable: true }
                        inputs: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string } } } }
                        live: { type: boolean, description: Icecast has a source on the mount }
                        listeners: { type: integer }
                        device_ids: { type: array, items: { type: integer } }
  /devices/{device}/line-in:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Radio]
      summary: Play a line-in on this device (capability stream_url); latency 2 to 5 s, not for TV
      operationId: playLineIn
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                node_id: { type: integer, description: Needed when more than one node has a line-in }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  url: { type: string }
                  node_id: { type: integer }
                  title: { type: string }
        "422":
          description: No line-in, node_id missing or unknown, or the device cannot play a stream
        "502":
          description: The line-in did not come up in time
        "503":
          description: The node or the device is offline
  /beolink-stream:
    get:
      tags: [Radio]
      summary: The BeoLink stream (a B&O source's audio through the server) - whether it is on, the MP3 stream URL, the B&O device it listens to and the devices playing it
      operationId: getBeolinkStream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  name: { type: string }
                  url: { type: string, nullable: true }
                  host_device_id: { type: integer, nullable: true }
                  target_device_ids: { type: array, items: { type: integer } }
  /devices/{device}/beolink-stream:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Radio]
      summary: Play the BeoLink stream on this device (capability stream_url); with host_device_id the receiver first joins that B&O device's experience
      operationId: playBeolinkStream
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host_device_id: { type: integer, description: "A B&O device that is playing (its multiroom id must be known)" }
      responses:
        "200":
          description: OK (the body is GET /beolink-stream plus status and url)
        "422":
          description: Stream not enabled, or the device cannot play a stream
        "502":
          description: The receiver did not accept the join, or the host's multiroom id is unknown (beolink_unavailable), or the device failed
    delete:
      tags: [Radio]
      summary: Stop the BeoLink stream on this device; the receiver leaves the B&O source when no device plays it any more
      operationId: stopBeolinkStream
      responses:
        "200":
          description: OK
        "422":
          description: The device has no media controls
  /radio/{station}/favorite:
    parameters:
      - name: station
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Radio]
      operationId: favoriteRadio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
  /radio/{station}/now:
    parameters:
      - { name: station, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Radio]
      summary: What a station plays now (refreshes the cached title)
      description: "The `now` of the station item, read fresh: the song from the stream's ICY title or NTS. `null` while unknown. Open."
      operationId: getRadioNow
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  now:
                    type: object
                    nullable: true
                    properties:
                      artist: { type: string, nullable: true }
                      title: { type: string }
                      source: { type: string, description: "icy | nts" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{device}/multiroom:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Multiroom]
      summary: Devices this one can join and devices listening to it (capability multi_room)
      operationId: getMultiroom
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  joinable:
                    type: array
                    items: { $ref: "#/components/schemas/MultiroomPeer" }
                  listeners:
                    type: array
                    items: { $ref: "#/components/schemas/MultiroomPeer" }
  /devices/{device}/multiroom/join:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Multiroom]
      operationId: multiroomJoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_device_id]
              properties:
                host_device_id: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  joined: { type: string, description: Name of the host device }
  /devices/{device}/multiroom/leave:
    parameters: [{ $ref: "#/components/parameters/device" }]
    delete:
      tags: [Multiroom]
      operationId: multiroomLeave
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /library/libraries:
    get:
      tags: [Library]
      summary: The music libraries that currently have content (not hidden for the client)
      description: >-
        A library is a music collection (DLNA/local, Spotify, later Deezer and Tidal); not to be
        confused with a device source (an input). Libraries cannot be played combined, so there is no
        "all" entry. Libraries without albums and playlists, and those the client hides, are left out.
      operationId: listLibraries
      parameters:
        - { $ref: "#/components/parameters/client" }
        - name: device_id
          in: query
          description: Add `playable` to every library, for this device. Unknown id is 422.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Unknown device_id }
  /library/recent-items:
    get:
      tags: [Library]
      summary: Recently played albums, playlists and radio stations mixed, newest first
      operationId: listRecentItems
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/client" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RecentItem" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/artists:
    get:
      tags: [Library]
      summary: Artists with albums, alphabetical ("The " ignored) or most played, 50 per page
      operationId: listArtists
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: sort
          in: query
          description: "`name` (default) or `plays` (most played first: plays of the artist's visible tracks in the scope; no plays last; ties by name then id). `letter` is ignored with `plays`."
          schema: { type: string, enum: [name, plays], default: name }
        - name: letter
          in: query
          description: Start at the first artist at or after this letter (`#` = the start)
          schema: { type: string, pattern: "^[A-Za-z#]$" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  next_cursor: { type: string, nullable: true }
  /library/artists/{artist}:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
      - name: source
        in: query
        description: The library to show (an artist is never shown merged across libraries). Default the artist's default source, else the one the scope browses.
        schema: { type: string, enum: [files, dlna] }
      - { name: include, in: query, schema: { type: string, enum: [discography] }, description: "Adds `discography` (CatalogueItem list). Ignored for client devices." }
      - { name: device_id, in: query, schema: { type: integer } }
    get:
      tags: [Library]
      operationId: getArtist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/artists/{artist}/discography:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
      - name: availability
        in: query
        description: "`missing` means not in the library (album_id null)."
        schema: { type: string, enum: [owned, streamable, missing] }
      - { name: wanted, in: query, schema: { type: boolean }, description: Only wished entries. }
      - { name: ignored, in: query, schema: { type: boolean }, description: Include entries marked "I don't want this". }
      - { name: device_id, in: query, schema: { type: integer }, description: Adds `playable` to each availability entry. }
    get:
      tags: [Library]
      operationId: getArtistDiscography
      description: The MusicBrainz discography (albums and EPs), newest first. Not available to client devices (`?client=` answers 403). See docs/api/availability.md.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogueItem" }
        "403": { description: Forbidden for client devices }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/wishlist:
    get:
      tags: [Library]
      operationId: getWishlist
      description: Wished albums the library does not own yet, most recently wished first. Not available to client devices.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: device_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogueItem" }
                  songs:
                    type: array
                    description: Wished songs (first page only).
                    items: { $ref: "#/components/schemas/WantedSong" }
                  next_cursor: { type: string, nullable: true }
        "403": { description: Forbidden for client devices }
  /library/new-releases:
    get:
      tags: [Library]
      operationId: getNewReleases
      description: New and upcoming albums and EPs of the library's artists that the library lacks, newest first (up to 50). Not available to client devices.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 90 }, description: How far back; releases still to come are always included. }
        - { name: device_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/CatalogueItem" }
                        - type: object
                          properties:
                            release_date: { type: string, description: YYYY-MM-DD }
        "403": { description: Forbidden for client devices }
        "422": { description: Validation error }
  /library/physical:
    get:
      tags: [Library]
      operationId: listPhysical
      description: The physical collection (CDs, records, tapes). Not available to client devices. See docs/api/physical.md.
      parameters:
        - { name: medium, in: query, schema: { type: string, enum: [cd, tape, vinyl, minidisc, other] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: ripped, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PhysicalItem" }
                  next_cursor: { type: string, nullable: true }
        "403": { description: Forbidden for client devices }
    post:
      tags: [Library]
      operationId: addPhysical
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhysicalItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhysicalItem" }
        "403": { description: Forbidden for client devices }
        "422": { description: Validation error }
  /library/physical/lookup:
    get:
      tags: [Library]
      operationId: lookupPhysicalBarcode
      description: The releases MusicBrainz knows for a barcode, to choose from before adding.
      parameters:
        - { name: barcode, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        release_mbid: { type: string }
                        release_group_mbid: { type: string, nullable: true }
                        artist: { type: string }
                        title: { type: string }
                        year: { type: integer, nullable: true }
                        label: { type: string, nullable: true }
                        catalogue_number: { type: string, nullable: true }
                        country: { type: string, nullable: true }
                        medium: { type: string }
        "403": { description: Forbidden for client devices }
        "422": { description: Validation error }
        "502": { description: MusicBrainz did not answer (driver_error) }
  /library/physical/import:
    post:
      tags: [Library]
      operationId: previewPhysicalImport
      description: "CSV import of a physical collection, step one: reads a Discogs collection export or any CSV whose headers name the columns (artist, title, medium or format, year, barcode, location ...), writes nothing, and answers what each row would become (`new`, `lookup`: its barcode is looked up on MusicBrainz after the import, `duplicate` by barcode or artist+title+medium, `invalid` with the reason) and a `token` for the confirm step. Not available to client devices. See docs/api/physical.md."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: "The CSV (UTF-8 or Windows-1252; comma, semicolon or tab; at most 2 MB and 5000 rows). Send this or `csv`." }
                csv: { type: string, description: "The CSV as text, with a header line" }
                default_medium: { type: string, enum: [cd, tape, vinyl, minidisc, other], description: "The medium of rows that have none; without it such rows are invalid" }
                mapping: { type: object, additionalProperties: { type: string }, description: "field => the file's column header, to override what the headers say; fields are artist, title, medium, year, barcode, location, catalogue_number, condition, notes, acquired_on" }
                rows: { type: integer, description: "List only this many rows in `data` (the summary counts all)" }
          application/json:
            schema:
              type: object
              properties:
                csv: { type: string }
                default_medium: { type: string, enum: [cd, tape, vinyl, minidisc, other] }
                mapping: { type: object, additionalProperties: { type: string } }
                rows: { type: integer }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [preview] }
                  token: { type: string, description: "Confirm with this within `expires_in` seconds" }
                  expires_in: { type: integer }
                  format: { type: string, enum: [discogs, generic] }
                  mapping: { type: object, additionalProperties: { type: string }, description: "field => column header that was used" }
                  unmapped: { type: array, items: { type: string }, description: "Columns of the file that were not used" }
                  summary:
                    type: object
                    properties:
                      rows: { type: integer }
                      new: { type: integer }
                      lookup: { type: integer }
                      duplicate: { type: integer }
                      invalid: { type: integer }
                  truncated: { type: boolean, description: "`data` lists fewer rows than the file has" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer, description: "Line of the file (the header is 1)" }
                        status: { type: string, enum: [new, lookup, duplicate, invalid] }
                        reason: { type: string, nullable: true, description: "Why a row is a duplicate or invalid" }
                        duplicate_of: { type: integer, nullable: true, description: "The collection item it duplicates" }
                        artist: { type: string, nullable: true, description: "Null for a barcode-only row: MusicBrainz names it" }
                        title: { type: string, nullable: true }
                        medium: { type: string, nullable: true }
                        year: { type: integer, nullable: true }
                        barcode: { type: string, nullable: true }
                        location: { type: string, nullable: true }
                        catalogue_number: { type: string, nullable: true }
                        condition: { type: string, nullable: true }
                        notes: { type: string, nullable: true }
                        acquired_on: { type: string, nullable: true }
        "403": { description: Forbidden for client devices }
        "422": { description: "Not a usable CSV (no columns for artist and title or a barcode, too large, unknown column in `mapping`)" }
  /library/physical/import/{token}/confirm:
    post:
      tags: [Library]
      operationId: confirmPhysicalImport
      description: "CSV import, step two: adds the rows of a preview (classified again, so a row added meanwhile is skipped). `new` rows and `lookup` rows with a name are added at once; every `lookup` row is looked up on MusicBrainz by a queued, rate-limited job (about one every two seconds), which ties the item to its release or, for a row with only a barcode, adds it from the release (a barcode MusicBrainz does not know is kept as 'Unknown artist' / 'Barcode …'). The preview is used up. Not available to client devices."
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  added: { type: integer, description: "Items added now" }
                  queued_lookups: { type: integer, description: "Barcode lookups queued" }
                  skipped_duplicates: { type: integer }
                  skipped_invalid: { type: integer }
        "403": { description: Forbidden for client devices }
        "404": { description: "The preview is unknown, used or expired" }
  /library/physical/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Library]
      operationId: getPhysical
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhysicalItem" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Library]
      operationId: updatePhysical
      description: Any field of the item; `ripped` marks it ripped to files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PhysicalItemInput" }
                - type: object
                  properties:
                    ripped: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhysicalItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Validation error }
    delete:
      tags: [Library]
      operationId: removePhysical
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/wanted-tracks:
    post:
      tags: [Library]
      operationId: wantTrack
      description: 'Wish for a song (from the play history, a radio station or by hand): something to buy or rip. One wish per artist and title. Not available to client devices.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
