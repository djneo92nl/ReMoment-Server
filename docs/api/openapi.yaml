openapi: 3.0.3
info:
  title: ReMoment Server API
  version: "1"
  description: |
    Client API of ReMoment Server (unauthenticated, local network). Covers what a
    playback/library client needs: server info, devices and playback, radio,
    multiroom, the library, and client registration.

    This file is the contract for native clients (the iOS app is generated from /
    checked against it). The prose docs in `docs/api/*.md` and CLAUDE.md stay the
    detailed reference; when an endpoint's shape changes, change this file too.

    Not yet described here: per-device settings (`sound-adjustment`, `bluetooth`,
    `network`, `wireless-speakers`, `info` — see `docs/api/device-settings.md`) and
    source controls (`/devices/{id}/controls` — see `docs/api/source-controls.md`).

    Errors on device endpoints: `503 unreachable`, `422 unsupported`, `502 driver_error`.
    Always check a device's `capabilities` before calling a feature endpoint.
servers:
  - url: http://remoment.local/api
tags:
  - name: Info
  - name: Devices
  - name: Playback
  - name: Radio
  - name: Multiroom
  - name: Library
  - name: Library playback
  - name: Clients
  - name: Players
  - name: Admin

paths:
  /info:
    get:
      tags: [Info]
      summary: Bootstrap info (addresses as the client reached the server)
      operationId: getInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /devices:
    get:
      tags: [Devices]
      summary: All devices
      operationId: listDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceList" }
  /devices/{device}:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Devices]
      summary: Device detail with now playing
      operationId: getDevice
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DeviceDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{device}/{action}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [play, pause, stop, next, previous] }
    post:
      tags: [Playback]
      summary: Transport control (capability media_controls)
      operationId: transport
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  action: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/volume:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      operationId: getVolume
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
    put:
      tags: [Playback]
      operationId: setVolume
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Volume" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
        "422": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/mute:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      operationId: getMute
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mute" }
    put:
      tags: [Playback]
      operationId: setMute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mute" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mute" }
  /devices/{device}/seek:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Seek within the current track (capability seek)
      operationId: seek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0, description: Seconds from the start of the track }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  position: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/move:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Move what plays on this device to another device (capability move_playback)
      description: |
        Library tracks continue on the target at the same position with the same queue (tracks the target
        cannot play are left out, `skipped`); radio restarts the station; Spotify is handed over with
        Spotify's own transfer, only to a speaker mapped to a Spotify Connect name. Inputs of the device
        itself (line-in, TV, CD, Bluetooth, AirPlay/Cast) answer `not_movable`. The playing device is stopped
        afterwards unless `stop_source` is false. See docs/api/playback-move.md.
      operationId: movePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_device_id]
              properties:
                to_device_id: { type: integer }
                stop_source: { type: boolean, default: true }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  to: { type: string, description: Name of the target device }
                  kind: { type: string, enum: [library, radio, spotify] }
                  queued: { type: integer }
                  skipped: { type: integer }
                  position: { type: integer, description: Seconds the target was asked to continue from }
        "422": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }
  /sync-groups:
    get:
      tags: [Multiroom]
      summary: Sync groups ("fake multiroom")
      operationId: listSyncGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SyncGroup" } }
    post:
      tags: [Multiroom]
      summary: Make a sync group (members need capability sync_group)
      description: |
        A leader plays, the members follow it: same queue, state and progress (within about two seconds).
        Library tracks and radio only. See docs/api/sync-groups.md.
      operationId: createSyncGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leader_device_id, member_device_ids]
              properties:
                leader_device_id: { type: integer }
                member_device_ids: { type: array, items: { type: integer }, minItems: 1 }
                name: { type: string, nullable: true }
      responses:
        "201":
          description: Made; `failed` lists members that could not start
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SyncGroup" }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: { type: integer }
                        message: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
  /sync-groups/{group}:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [Multiroom]
      summary: End a sync group
      operationId: deleteSyncGroup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stop_members: { type: boolean, default: true }
      responses:
        "200": { description: OK }
  /sync-groups/{group}/members:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Multiroom]
      summary: Add a member to a sync group
      operationId: addSyncGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: integer }
      responses:
        "201": { description: Added }
        "422": { $ref: "#/components/responses/DeviceError" }
  /sync-groups/{group}/members/{device}:
    parameters:
      - { name: group, in: path, required: true, schema: { type: integer } }
      - { $ref: "#/components/parameters/device" }
    put:
      tags: [Multiroom]
      summary: Trim a member (positive plays ahead of the leader)
      operationId: setSyncGroupOffset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_ms]
              properties:
                offset_ms: { type: integer, minimum: -30000, maximum: 30000 }
      responses:
        "200": { description: OK }
    delete:
      tags: [Multiroom]
      summary: Remove a member (the last one ends the group)
      operationId: removeSyncGroupMember
      responses:
        "200": { description: OK }
  /devices/{device}/queue:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Up Next (capability queue)
      operationId: getQueue
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  up_next:
                    type: array
                    items: { $ref: "#/components/schemas/QueueItem" }
    post:
      tags: [Playback]
      summary: Add a track, album, artist or playlist to the queue, or play it next (capabilities queue_add, queue_next)
      operationId: addToQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [track, album, artist, playlist] }
                id: { type: integer }
                next: { type: boolean, description: "Right after the current track instead of at the end" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  next: { type: boolean }
                  tracks: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
    delete:
      tags: [Playback]
      summary: Empty the queue after the current track (capability queue_clear)
      operationId: clearQueue
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/queue/{position}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - { name: position, in: path, required: true, description: "Up-next position, 1 = the first entry of GET /queue", schema: { type: integer, minimum: 1 } }
    delete:
      tags: [Playback]
      summary: Remove the entry at `position` (capability queue_remove)
      operationId: removeFromQueue
      parameters:
        - { name: expect, in: query, description: "The uri the client saw at that position; a changed queue is refused (422 invalid)", schema: { type: string } }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }
    put:
      tags: [Playback]
      summary: Move the entry at `position` to position `to` (capability queue_move)
      operationId: moveInQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: integer, minimum: 1 }
                expect: { type: string }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/queue/jump:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Play the entry `position` places ahead (capability queue_jump)
      operationId: queueJump
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  position: { type: integer }
  /devices/{device}/shuffle:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Capability shuffle
      operationId: setShuffle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shuffle]
              properties:
                shuffle: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shuffle: { type: boolean }
  /devices/{device}/repeat:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Capability repeat
      operationId: setRepeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repeat]
              properties:
                repeat: { $ref: "#/components/schemas/Repeat" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repeat: { $ref: "#/components/schemas/Repeat" }
  /devices/{device}/like:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Save/remove the playing track in the Spotify library (capability like)
      operationId: setLike
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked: { type: boolean }
  /devices/{device}/power:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Playback]
      summary: Wake or standby (capability power). Mozart can only be put in standby.
      operationId: setPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  on: { type: boolean }
        "422": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/sleep-timer:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Playback]
      summary: Sleep timer in minutes (capability sleep_timer); writable false on the BeoPlay V1
      operationId: getSleepTimer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: { type: integer, description: "Minutes left, 0 = no timer" }
                  min: { type: integer }
                  max: { type: integer }
                  step: { type: integer }
                  writable: { type: boolean }
        "422": { $ref: "#/components/responses/DeviceError" }
    put:
      tags: [Playback]
      summary: Set the sleep timer; 0 cancels it. Answers the new state like GET.
      operationId: setSleepTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 0, maximum: 60 }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/digits:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Playback]
      summary: Press number keys on the active TV / set-top box source (capability digits; BeoPlay V1)
      operationId: sendDigits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digits]
              properties:
                digits: { type: string, pattern: "^[0-9]{1,8}$", example: "105" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  digits: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }

  /devices/{device}/sources:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Devices]
      summary: Live source list (capability source_control)
      description: |
        Ordered by `sort_order`. Includes hidden sources (`hidden: true`); pass `visible=1` for the picker
        (visible only). Visibility is household-wide and changed with `PUT /admin/devices/{device}/sources/{source_id}`.
        `in_use` is NOT "selected" on B&O devices; use `active` (absent when the device cannot tell; then match
        `now_playing.source` against `source_type` or name). See `docs/ux/sources.md`.
      operationId: listSources
      parameters:
        - name: visible
          in: query
          required: false
          schema: { type: boolean }
          description: Only sources that are not hidden.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
  /devices/{device}/sources/activate:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Devices]
      summary: Switch to a source (capability source_activation)
      operationId: activateSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  source_id: { type: string }

  /devices/{device}/radio:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Radio]
      summary: Stations playable on this device (capability radio_control)
      operationId: listRadio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items: { $ref: "#/components/schemas/RadioStation" }
  /devices/{device}/radio/{station}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - name: station
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Radio]
      operationId: playRadio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  station: { type: string }
  /spotify-stream:
    get:
      tags: [Radio]
      summary: The Spotify stream (librespot to Icecast) - whether it is on, the receiver's name and the MP3 stream URL
      operationId: getSpotifyStream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  name: { type: string }
                  url: { type: string, nullable: true }
  /devices/{device}/spotify-stream:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Radio]
      summary: Play the Spotify stream on this device (capability stream_url); pick the receiver by name in Spotify
      operationId: playSpotifyStream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  url: { type: string }
                  receiver: { type: string }
        "422":
          description: Stream not enabled, or the device cannot play a stream
  /radio/{station}/favorite:
    parameters:
      - name: station
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Radio]
      operationId: favoriteRadio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }

  /devices/{device}/multiroom:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Multiroom]
      summary: Devices this one can join and devices listening to it (capability multi_room)
      operationId: getMultiroom
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  joinable:
                    type: array
                    items: { $ref: "#/components/schemas/MultiroomPeer" }
                  listeners:
                    type: array
                    items: { $ref: "#/components/schemas/MultiroomPeer" }
  /devices/{device}/multiroom/join:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Multiroom]
      operationId: multiroomJoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_device_id]
              properties:
                host_device_id: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  joined: { type: string, description: Name of the host device }
  /devices/{device}/multiroom/leave:
    parameters: [{ $ref: "#/components/parameters/device" }]
    delete:
      tags: [Multiroom]
      operationId: multiroomLeave
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /library/libraries:
    get:
      tags: [Library]
      summary: The music libraries that currently have content (not hidden for the client)
      description: >-
        A library is a music collection (DLNA/local, Spotify, later Deezer and Tidal); not to be
        confused with a device source (an input). Libraries cannot be played combined, so there is no
        "all" entry. Libraries without albums and playlists, and those the client hides, are left out.
      operationId: listLibraries
      parameters:
        - { $ref: "#/components/parameters/client" }
        - name: device_id
          in: query
          description: Add `playable` to every library, for this device. Unknown id is 422.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Unknown device_id }
  /library/recent-items:
    get:
      tags: [Library]
      summary: Recently played albums, playlists and radio stations mixed, newest first
      operationId: listRecentItems
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/client" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RecentItem" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/artists:
    get:
      tags: [Library]
      summary: Artists with albums, alphabetical ("The " ignored) or most played, 50 per page
      operationId: listArtists
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: sort
          in: query
          description: "`name` (default) or `plays` (most played first: plays of the artist's visible tracks in the scope; no plays last; ties by name then id). `letter` is ignored with `plays`."
          schema: { type: string, enum: [name, plays], default: name }
        - name: letter
          in: query
          description: Start at the first artist at or after this letter (`#` = the start)
          schema: { type: string, pattern: "^[A-Za-z#]$" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  next_cursor: { type: string, nullable: true }
  /library/artists/{artist}:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
      - name: source
        in: query
        description: The library to show (an artist is never shown merged across libraries). Default the artist's default source, else the one the scope browses.
        schema: { type: string, enum: [files, dlna, spotify] }
    get:
      tags: [Library]
      operationId: getArtist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/artists/{artist}/favorite:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Library]
      operationId: favoriteArtist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
  /library/albums:
    get:
      tags: [Library]
      summary: All albums with tracks, 60 per page
      operationId: listAlbums
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: sort
          in: query
          schema: { type: string, enum: [name, artist, year, added, plays], default: name }
        - name: letter
          in: query
          description: "Start at the first album whose sort key (album name with `name`, artist name with `artist`, \"The \" ignored for artists only) is at or after this letter (`#` = the start). Ignored with `year`, `added`, `plays` and with a cursor."
          schema: { type: string, pattern: "^[A-Za-z#]$" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
                  next_cursor: { type: string, nullable: true }
  /library/tracks:
    get:
      tags: [Library]
      summary: All tracks of the scope, 50 per page
      operationId: listTracks
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: sort
          in: query
          schema: { type: string, enum: [name, artist, added, plays], default: name }
        - name: letter
          in: query
          description: "Start at the first track whose sort key (track name with `name`, artist name with `artist`) is at or after this letter (`#` = the start). Ignored with `added`, `plays` and with a cursor."
          schema: { type: string, pattern: "^[A-Za-z#]$" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchTrack" }
                  next_cursor: { type: string, nullable: true }
  /library/albums/{album}:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
      - name: device_id
        in: query
        description: Make `playable` specific to this device
        schema: { type: integer }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [Library]
      operationId: getAlbum
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/albums/{album}/favorite:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Library]
      operationId: favoriteAlbum
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
  /library/albums/{album}/spotify:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Library]
      summary: The album as Spotify has it (needs Spotify connected on the server)
      operationId: getAlbumSpotify
      responses:
        "200":
          description: Spotify's tracks in album order; `track_id` is the library track that holds it, else null
          content:
            application/json:
              schema:
                type: object
                properties:
                  missing: { type: integer, description: Tracks not in the library }
                  tracks:
                    type: array
                    items:
                      type: object
                      properties:
                        spotify_id: { type: string }
                        name: { type: string }
                        number: { type: integer }
                        disc: { type: integer }
                        duration: { type: integer, description: Seconds }
                        track_id: { type: integer, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`spotify_unavailable`: Spotify is not connected" }
        "502": { description: "`driver_error`: Spotify did not answer" }
  /library/albums/{album}/fill-from-spotify:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Library]
      summary: Add the album's missing tracks from Spotify to the library
      operationId: fillAlbumFromSpotify
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`spotify_unavailable`" }
        "502": { description: "`driver_error`" }
  /library/tracks/{track}/favorite:
    parameters:
      - name: track
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Library]
      operationId: favoriteTrack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/editable-playlists:
    get:
      tags: [Library]
      summary: "Playlists made on the server (not smart, not synced from Spotify): the ones tracks can be added to"
      operationId: listEditablePlaylists
      responses:
        "200":
          description: OK, by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        track_count: { type: integer }
                        track_source: { type: string, nullable: true, enum: [files, dlna, spotify], description: "The one library the playlist's tracks come from; null while empty. A playlist never mixes libraries." }
  /library/playlists:
    post:
      tags: [Library]
      summary: Create an empty playlist made here
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  track_count: { type: integer }
  /library/playlists/{playlist}/tracks:
    parameters:
      - name: playlist
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Library]
      summary: Add a track, or an album's tracks in album order, to a playlist made here; tracks already in it are skipped
      operationId: addPlaylistTracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`track_id` or `album_id`"
              properties:
                track_id: { type: integer }
                album_id: { type: integer }
                source: { type: string, enum: [files, dlna, spotify], description: "Only the tracks of that source (an album's other tracks are left out; a track not in it is refused)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  track_count: { type: integer }
        "422": { description: "Validation error, `unsupported` for a smart or Spotify playlist, or `source_mismatch` when the tracks come from another library than the playlist holds (or from several)" }
  /library/health:
    get:
      tags: [Library]
      summary: How many findings each library health report has
      operationId: libraryHealth
      description: Counts only, cached for ten minutes and zero until audio analysis has run. The findings are on the web page /settings/library-health.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [transcodes, damaged, clipping, duplicates, lossy, incomplete, unlinked, missing] }
                        title: { type: string, example: Suspected transcodes }
                        description: { type: string }
                        count: { type: integer }
  /library/listening-modes:
    get:
      tags: [Library]
      summary: Listening modes (focus, party, sleep, workout) the library has enough analysed tracks for
      operationId: listListeningModes
      description: A mode is a selection of the server's own analysed files by tempo, energy, danceability, mood and loudness. A mode with too few matching tracks is left out, so the list is empty until audio analysis has run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: party }
                        name: { type: string, example: Party }
                        description: { type: string }
                        icon: { type: string, description: Font Awesome solid icon name, example: champagne-glasses }
                        track_count: { type: integer, description: Tracks the mode would play (at most 100) }
  /library/genres:
    get:
      tags: [Library]
      operationId: listGenres
      parameters:
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GenreItem" }
  /library/genres/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [Library]
      operationId: getGenre
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  colors: { type: array, maxItems: 3, items: { type: string, pattern: "^#[0-9a-f]{6}$" }, description: Same as GenreItem.colors }
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/playlists:
    get:
      tags: [Library]
      summary: Playlists with tracks (smart ones too), recently played first, 50 per page
      description: "In the Local scope (`dlna`/`local`) playlists of another library (Spotify) with local_coverage >= 0.4 are listed too, with `external: true`."
      operationId: listPlaylists
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PlaylistListItem" }
                  next_cursor: { type: string, nullable: true }
  /library/playlists/{playlist}:
    parameters:
      - name: playlist
        in: path
        required: true
        schema: { type: integer }
      - name: device_id
        in: query
        schema: { type: integer }
      - name: library
        in: query
        description: "The library the client browsed the playlist in (a library id). Decides `mode`: the playlist's own library, or without `library`, gives `library` mode; `dlna` on a playlist of another library (Spotify) gives `local` mode. A library that makes no sense for the playlist is 422."
        schema: { type: string, example: dlna }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [Library]
      operationId: getPlaylist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/recent:
    get:
      tags: [Library]
      summary: Most recently played distinct albums
      operationId: listRecent
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
  /library/random-album:
    get:
      tags: [Library]
      summary: One random album in a library
      description: A random album with at least one visible track in the scope; with device_id one that device can play is preferred, else any. 404 when the library has no album.
      operationId: randomAlbum
      parameters:
        - name: device_id
          in: query
          schema: { type: integer }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlbumItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /library/favorites:
    get:
      tags: [Library]
      operationId: listFavorites
      parameters:
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/SearchTrack" }
  /library/search:
    get:
      tags: [Library]
      summary: Substring search over artist, album and track names
      operationId: searchLibrary
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: At most 10 artists, 15 albums, 20 tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/SearchTrack" }

  /devices/{device}/library/play:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      summary: Play one library track (capability library_playback)
      operationId: playTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`track_id`, or `spotify_track_id` for a Spotify track the library does not hold"
              properties:
                track_id: { type: integer }
                spotify_track_id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/PlayedOk" }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-album:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playAlbum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [album_id]
              properties:
                album_id: { type: integer }
                start_track_id: { type: integer }
                shuffle: { type: boolean, default: false }
                source: { type: string, enum: [files, dlna, spotify], description: "Play only from that path; `spotify` plays the album from Spotify even when the library holds none of its tracks" }
      responses:
        "200": { $ref: "#/components/responses/PlayedOk" }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-artist:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playArtist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist_id]
              properties:
                artist_id: { type: integer }
                shuffle: { type: boolean, default: false }
                source: { type: string, enum: [files, dlna, spotify], description: Play only the tracks of this library. }
      responses:
        "200": { $ref: "#/components/responses/PlayedOk" }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-tracks:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playTracks
      description: Shuffles the whole library, a random sample of up to 100 tracks of the scope that the device can play. 422 `not_playable` when it can play none, 422 `unsupported` without library playback.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, description: A library id, `local`, `streaming` or `all`. }
                client: { type: string, description: A client `api_token` whose hidden sources apply. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  queued: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-listening-mode:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playListeningMode
      description: Plays a random selection of up to 100 tracks that fit the mode and that the device can play. 422 `not_playable` when fewer than 5 qualify on this device, 422 `unsupported` when the device has no library playback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, description: A `key` from `GET /library/listening-modes`, example: sleep }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  mode: { type: string }
                  queued: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-playlist:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playlist_id]
              properties:
                playlist_id: { type: integer }
                start_track_id: { type: integer }
                shuffle: { type: boolean, default: false }
                library:
                  type: string
                  description: "The library the playlist was browsed in; `dlna` on a playlist of another library plays it in local mode (only tracks with a local copy, others skipped). A library that makes no sense for the playlist is 422."
                  example: dlna
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  playlist: { type: string }
                  mode: { type: string, enum: [library, local] }
                  queued: { type: integer, description: Local mode only; tracks queued }
                  skipped: { type: integer, description: Local mode only; playlist tracks without a local copy }
        "422": { $ref: "#/components/responses/DeviceError" }

  /admin/login:
    post:
      tags: [Admin]
      summary: Sign in as the shared admin (password only) and get a bearer token
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                device_name: { type: string, maxLength: 100, description: Labels the sign-in under Settings › Users }
      responses:
        "200":
          description: The plain token is shown once; store it in the Keychain
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: rmt_… }
                  token_id: { type: integer }
                  name: { type: string, nullable: true }
        "401":
          description: invalid_credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: too_many_attempts (5 wrong passwords per minute per IP)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  retry_after: { type: integer }
  /admin/me:
    get:
      tags: [Admin]
      summary: Check the stored token
      operationId: adminMe
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  token_id: { type: integer }
                  name: { type: string, nullable: true }
                  last_used_at: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/token:
    delete:
      tags: [Admin]
      summary: Sign out (revokes this token)
      operationId: adminLogout
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/devices/{device}/sources/{source_id}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - { name: source_id, in: path, required: true, schema: { type: string }, description: URL-encoded }
    put:
      tags: [Admin]
      summary: Show/hide or reorder a source (household-wide)
      operationId: updateSource
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id: { type: string }
                  hidden: { type: boolean }
                  sort_order: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Source not known for this device (list sources first) }
        "422": { description: Invalid body }

  /clients/register:
    post:
      tags: [Clients]
      summary: Register a client (idempotent per hardware_id)
      operationId: registerClient
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hardware_id: { type: string }
                firmware_version: { type: string }
                build_number: { type: integer }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
        "201":
          description: Newly registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
  /clients/status/{registrationToken}:
    parameters:
      - name: registrationToken
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Clients]
      summary: Poll for approval
      operationId: clientStatus
      responses:
        "200":
          description: pending, or approved with the api_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientStatus" }
  /clients/{apiToken}/devices:
    parameters: [{ $ref: "#/components/parameters/apiToken" }]
    get:
      tags: [Clients]
      summary: Devices this client may see (all of them for a multi client with none assigned)
      operationId: clientDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceList" }
  /clients/{apiToken}/heartbeat:
    parameters: [{ $ref: "#/components/parameters/apiToken" }]
    put:
      tags: [Clients]
      operationId: clientHeartbeat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firmware_version: { type: string }
                build_number: { type: integer }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
  /clients/{apiToken}/artwork:
    parameters:
      - { $ref: "#/components/parameters/apiToken" }
      - { $ref: "#/components/parameters/cursor" }
    get:
      tags: [Clients]
      summary: Processed covers to pre-cache, by hash
      operationId: clientArtwork
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PrecacheArtwork" }
                  next_cursor: { type: string, nullable: true }

  /players:
    get:
      tags: [Players]
      summary: The existing players, so a new client can take one over
      operationId: listPlayers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerSummary" }
  /players/register:
    post:
      tags: [Players]
      summary: Register a player (idempotent per token)
      description: |
        A player plays the server's own files and then shows up as a normal device. Send the `token` from
        the first registration on every later call (keep it in flash, keychain or `localStorage`); omit it the
        first time. A client without a token can send `adopt_device_id` to take over an existing player: it
        gets a token of its own and the device keeps its name, kind and formats. See `docs/api/players.md`.
      operationId: registerPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerRegistration" }
      responses:
        "201":
          description: Registered (also for a repeat call with a known token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRegistered" }
        "422": { description: Invalid request }
  /players/{token}/commands:
    parameters:
      - $ref: "#/components/parameters/playerToken"
    get:
      tags: [Players]
      summary: Commands for the player (the HTTP alternative to MQTT `remoment/playercmd/{device_id}`)
      description: |
        Returns the commands with an id above `since`, oldest first; the last 50 are kept for 5 minutes. With
        `wait` the call holds for up to that many seconds (max 25) until a command arrives, so an old client
        with no MQTT can long-poll. Also counts as a sign of life. Start `since` at `last_command_id` from
        registration, and ignore ids already seen.
      operationId: getPlayerCommands
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 25, default: 0 }, description: "Seconds to wait for a command" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerCommand" }
        "404": { description: Unknown token }
  /players/{token}/state:
    parameters:
      - $ref: "#/components/parameters/playerToken"
    put:
      tags: [Players]
      summary: "Report what the player is doing (on every change and about every 5 s: this is the heartbeat)"
      description: |
        No report for 10 s makes the device `unreachable`. Send `ended: true` when the track finishes: the server
        then sends the next `play`, or `stop` at the end of the queue.
      operationId: putPlayerState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerState" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "404": { description: Unknown token }
        "422": { description: Invalid request }
  /artwork/{hash}/{size}.{format}:
    parameters:
      - { name: hash, in: path, required: true, description: "`hash` of a library artwork object, or the last segment of `lite` in a `play` command", schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      - { name: size, in: path, required: true, schema: { type: integer, enum: [32, 48, 64, 96, 120, 160] } }
      - { name: format, in: path, required: true, schema: { type: string, enum: [gif, bmp, pgm] } }
    get:
      tags: [Players]
      summary: A tiny cover for old or small screens
      description: |
        A square GIF, uncompressed 8-bit BMP or binary PGM (P5), cut on the first request from the processed
        320 px cover and kept. `404` also means the cover is not processed yet: show a placeholder and try
        again on the next track.
      operationId: getLiteArtwork
      parameters:
        - { name: colors, in: query, description: "Palette size (grey levels for a PGM)", schema: { type: integer, enum: [2, 4, 16, 64, 256], default: 16 } }
      responses:
        "200":
          description: The image
          content:
            image/gif: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
            image/x-portable-graymap: { schema: { type: string, format: binary } }
        "404": { description: "Unknown size or format, or the cover is not processed yet" }
        "422": { description: "`colors` is not one of the allowed values" }
  /stream/{track}:
    servers:
      - url: http://remoment.local
        description: Not under /api
    parameters:
      - { name: track, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Players]
      summary: The audio of one of the server's own tracks (the `url` of a `play` command)
      description: |
        Unauthenticated, byte ranges supported (seek). Without `profile` it is the original file. With a
        `profile` it is a smaller MP3 made on demand (`mp3-lo`: mono, 22.05 kHz, 48 kbit/s; `mp3-mid`: stereo,
        44.1 kHz, 128 kbit/s); until that proxy exists the original is sent and the proxy is queued, so a client
        that was told a `profile` by a `play` command always finds it ready. `/stream/{track}.{ext}` is the same
        file under an address with its extension. Plain HTTP/1.0 works.
      operationId: streamTrack
      parameters:
        - { name: profile, in: query, schema: { type: string, enum: [mp3-lo, mp3-mid] } }
      responses:
        "200":
          description: The audio file
          content:
            "*/*": { schema: { type: string, format: binary } }
        "206": { description: Partial content (Range request) }
        "404": { description: The track has no file }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "Token from POST /admin/login (rmt_…). Only routes marked with security need it; the rest of the API is open."
  parameters:
    device:
      name: device
      in: path
      required: true
      schema: { type: integer }
    apiToken:
      name: apiToken
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      description: Opaque; pass back `next_cursor` until it is null
      schema: { type: string }
    playerToken:
      name: token
      in: path
      required: true
      description: "`player_token` from POST /players/register (secret: the only credential of the player endpoints)"
      schema: { type: string }
    client:
      name: client
      in: query
      description: Client api_token, applies the sources hidden for that client
      schema: { type: string }
    scope:
      name: scope
      in: query
      description: >-
        What to show: a library id (`dlna`, `spotify`, and any library added later, see
        `GET /library/libraries`), or `local` / `streaming` (kept for compatibility: the libraries of
        that kind) / `all` (every library combined; the library list never offers this to a player UI).
        Without it the default is the leading library (DLNA when it has tracks, else Spotify), so pass
        `all` to list e.g. the playlists of every library. Anything else is 422.
      schema: { type: string, enum: [dlna, spotify, local, streaming, all] }

  responses:
    Unauthenticated:
      description: Missing, unknown or revoked admin token (drop it and sign in again)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id (also a record merged away by library:merge-duplicates)
    DeviceError:
      description: unreachable (503), unsupported / not_playable / invalid (422), driver_error (502)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: unsupported }
              message: { type: string }
    PlayedOk:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok }
              track: { type: string }
              album: { type: string }
              artist: { type: string }
              playlist: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: unauthenticated }
        message: { type: string }
    ServerInfo:
      type: object
      required: [name, version, api_version, base_url, api_base_url, artwork_base_url, mqtt]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: integer, description: Bumped on breaking changes }
        base_url: { type: string }
        api_base_url: { type: string }
        artwork_base_url: { type: string, description: "Prefix artwork paths with this, taking the path from /storage/ on" }
        mqtt:
          type: object
          required: [host, port, ws_port, ws_url, topic_prefix]
          properties:
            host: { type: string }
            port: { type: integer, description: Plain MQTT over TCP }
            ws_port: { type: integer }
            ws_url: { type: string, example: "ws://192.168.1.100:9001" }
            topic_prefix: { type: string, example: remoment/player }
        placeholder:
          allOf: [{ $ref: "#/components/schemas/Artwork" }]
          nullable: true

    State:
      type: string
      enum: [playing, standby, paused, unreachable]
    Repeat:
      type: string
      enum: [off, all, one]
    Capability:
      type: string
      enum: [media_controls, volume_control, radio_control, source_control, source_activation, multi_room, library_playback, seek, queue, queue_jump, queue_add, queue_next, queue_remove, queue_move, queue_clear, shuffle, repeat, like, power, sound_adjustment, bluetooth, device_info, battery, network_settings, wireless_speakers, wired_speakers, sleep_timer, digits, remote_control, stream_url, source_controls, move_playback, sync_group]
    Battery:
      type: object
      nullable: true
      properties:
        level: { type: integer, minimum: 0, maximum: 100 }
        charging: { type: boolean }
    MultiRoom:
      type: object
      nullable: true
      description: Multiroom role as the device's listener last saw it; null while unknown (ASE only for now)
    SyncGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        leader:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              offset_ms: { type: integer }
      properties:
        role: { type: string, enum: [standalone, host, listener] }
        host:
          type: object
          nullable: true
          description: The device this one is joined to (role listener)
          properties: { id: { type: integer }, name: { type: string } }
        listeners:
          type: array
          description: Devices listening to this one (role host)
          items:
            type: object
            properties: { id: { type: integer }, name: { type: string } }
    Modes:
      type: object
      description: Each value is null when unknown or unsupported
      properties:
        shuffle: { type: boolean, nullable: true }
        repeat: { allOf: [{ $ref: "#/components/schemas/Repeat" }], nullable: true }
        liked: { type: boolean, nullable: true }
    Volume:
      type: object
      required: [volume]
      properties:
        volume: { type: integer, minimum: 0, maximum: 100 }
    Mute:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }
    FavoriteBody:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }

    DeviceList:
      type: object
      properties:
        id: { type: integer }
        device_name: { type: string }
        device_brand_name: { type: string }
        device_product_type: { type: string }
        device_driver_name: { type: string }
        ip_address: { type: string }
        state: { $ref: "#/components/schemas/State" }
        last_seen: { type: string, nullable: true }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        battery: { $ref: "#/components/schemas/Battery" }
        multiroom: { $ref: "#/components/schemas/MultiRoom" }
        mqtt_topic: { type: string, example: remoment/player/1 }
    DeviceDetail:
      allOf:
        - { $ref: "#/components/schemas/DeviceList" }
        - type: object
          properties:
            now_playing:
              allOf: [{ $ref: "#/components/schemas/NowPlaying" }]
              nullable: true

    NowPlaying:
      type: object
      properties:
        track:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            source: { type: string }
            duration: { type: integer, nullable: true }
            artist:
              type: object
              nullable: true
              properties:
                name: { type: string }
                images: { type: array, items: { type: string } }
                source: { type: string }
            images: { type: array, items: { type: string } }
            meta: { type: array, items: { type: object, additionalProperties: true } }
        album:
          type: object
          nullable: true
          properties:
            name: { type: string }
            images: { type: array, items: { type: string } }
            released_at: { type: string, nullable: true }
            artist:
              type: object
              properties:
                name: { type: string }
        radio:
          type: object
          nullable: true
          properties:
            name: { type: string }
            genre: { type: string, nullable: true }
            images: { type: array, items: { type: string } }
        source:
          type: object
          nullable: true
          properties:
            name: { type: string }
            category: { type: string }
            sourceType: { type: string }
            connector: { type: string, nullable: true }
            jid: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/State" }
        position: { type: integer, nullable: true, description: Seconds into the track }
        platform: { type: string }
        type: { type: string }
        endTime: { type: string, nullable: true }
        artwork:
          allOf: [{ $ref: "#/components/schemas/Artwork" }]
          description: Absent while a new cover is still being processed; show the placeholder
        modes: { $ref: "#/components/schemas/Modes" }

    Artwork:
      type: object
      description: Full artwork object (now playing, MQTT /data, placeholder). Take the path from /storage/ on and prefix artwork_base_url.
      properties:
        kind: { type: string, enum: [album, radio, source] }
        proxy_512: { type: string }
        proxy_320: { type: string }
        proxy_120: { type: string }
        proxy_bg: { type: string, description: "Blurred, darkened 1024x600 background" }
        proxy_bg_320x480: { type: string }
        proxy_bg_480x480: { type: string }
        colors: { type: array, items: { type: string, example: "#1a2b3c" }, description: Five dominant colors }
        safe_colors: { type: array, items: { type: string }, description: "colors lightened to >=65% lightness for text on dark backgrounds" }
    LibraryArtwork:
      type: object
      nullable: true
      description: Small artwork object of library items; null until processed
      properties:
        hash: { type: string, description: "md5 of the source image URL; stable cache key" }
        proxy_120: { type: string }
        proxy_320: { type: string }
        colors: { type: array, nullable: true, items: { type: string, example: "#1a2b3c" }, description: "Same palette as Artwork.colors; null when the cover's cache entry expired or predates the palette (proxies still present)" }
        safe_colors: { type: array, nullable: true, items: { type: string }, description: "Same as Artwork.safe_colors; null like colors" }
    PrecacheArtwork:
      type: object
      properties:
        kind: { type: string, enum: [source, playlist, album] }
        hash: { type: string }
        proxy_320: { type: string }
        proxy_120: { type: string }
        proxy_bg: { type: string }
        proxy_bg_320x480: { type: string }
        proxy_bg_480x480: { type: string }

    QueueItem:
      type: object
      properties:
        name: { type: string }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        image: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        uri: { type: string, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
    Source:
      type: object
      properties:
        source_id: { type: string }
        friendly_name: { type: string }
        source_type: { type: string }
        category: { type: string }
        in_use: { type: boolean }
        borrowed: { type: boolean }
        provider_jid: { type: string, nullable: true }
        provider_name: { type: string, nullable: true }
        input:
          type: string
          description: Physical connection such as "HDMI 5" or "AV". Absent for purely digital sources. Show it as a badge, never invent it from the name.
        active:
          type: boolean
          description: This is the selected source. Absent when the device cannot tell.
        hidden: { type: boolean, description: "Household preference; hidden sources stay out of pickers. QPlay and borrowed sources start hidden." }
        sort_order: { type: integer }
    RadioStation:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        genre: { type: string, nullable: true }
        favorite: { type: boolean }
        artwork:
          allOf: [{ $ref: "#/components/schemas/Artwork" }]
          nullable: true
        now:
          type: object
          nullable: true
          description: Cached title of the station's stream; null while unknown. Read from cache only; GET /radio/{id}/now keeps it fresh.
          properties:
            artist: { type: string, nullable: true }
            title: { type: string }
            source: { type: string, description: "icy | nts" }
    MultiroomPeer:
      type: object
      properties:
        id: { type: integer }
        device_name: { type: string }
        state: { $ref: "#/components/schemas/State" }

    ArtistItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        album_count: { type: integer }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        favorite: { type: boolean }
    AlbumItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        artist_name: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        favorite: { type: boolean }
    PlaylistItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        track_count: { type: integer }
        owner: { type: string, nullable: true }
        last_played_at: { type: string, format: date-time, nullable: true, description: When it was last started from the server; null if never }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
    PlaylistListItem:
      description: A PlaylistItem of the playlist list, with its library and how much of it exists in Local
      allOf:
        - { $ref: "#/components/schemas/PlaylistItem" }
        - type: object
          properties:
            library: { type: string, nullable: true, description: "The library the playlist belongs to (spotify); null for local and smart playlists", example: spotify }
            external: { type: boolean, description: "True only in the Local scope, for a playlist of another library listed because local_coverage >= 0.4; open it with library=dlna" }
            local_track_count: { type: integer, nullable: true, description: Tracks with a playable Local copy; null for local/smart/Local playlists }
            local_coverage: { type: number, nullable: true, description: "local_track_count / track_count, 0..1, 2 decimals; null as local_track_count" }
    Library:
      type: object
      properties:
        id: { type: string, description: "Stable id, also a valid `scope`: dlna | spotify | (deezer, tidal later)", example: dlna }
        name: { type: string, example: Local }
        kind: { type: string, enum: [local, streaming] }
        album_count: { type: integer }
        artist_count: { type: integer }
        playlist_count: { type: integer }
        playable: { type: boolean, description: "Only with `device_id`: whether that device can play this library (a non-playable library can still be browsed). Absent without it." }
        artwork:
          allOf: [{ $ref: "#/components/schemas/LibraryArtwork" }]
          nullable: true
          description: A representative cover, its most recently played album (else its newest); null until processed
    RecentItem:
      type: object
      description: Exactly one of album, playlist and station is set, matching `type`
      properties:
        type: { type: string, enum: [album, playlist, radio] }
        library: { type: string, description: "A library id, or `radio` for a station" }
        played_at: { type: string, format: date-time }
        album:
          allOf: [{ $ref: "#/components/schemas/AlbumItem" }]
          nullable: true
        playlist:
          allOf: [{ $ref: "#/components/schemas/PlaylistItem" }]
          nullable: true
        station:
          allOf: [{ $ref: "#/components/schemas/RadioStation" }]
          nullable: true
    GenreItem:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        artist_count: { type: integer }
        album_count: { type: integer }
        colors:
          type: array
          maxItems: 3
          description: >-
            Up to 3 hex colours the covers of the genre's albums share (same scope and filtering as
            album_count), dominant first, vivid ones (HSV saturation >= 0.25, value 0.2-0.95) before
            grey/black/white. Palettes come from the artwork cache (first 2 entries per cover, channels
            bucketed in steps of 32, most albums per bucket, at most 200 albums sampled). Empty when no
            cover is processed. Cached 1 hour.
          items: { type: string, pattern: "^#[0-9a-f]{6}$", example: "#2a4d8f" }
    ArtistDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        favorite: { type: boolean }
        genres: { type: array, items: { type: string } }
        details:
          type: object
          additionalProperties: true
          description: "bio, wikipedia_url, links, images, mood, style, tags, listeners, playcount, fanart (processed artwork object with proxy_bg backdrops, or null) … all may be null; see docs/api/library.md"
        source: { type: string, enum: [files, dlna, spotify], nullable: true, description: The library the albums are from. }
        sources:
          type: array
          description: The libraries to switch between (where the artist has tracks, plus Spotify while connected).
          items:
            type: object
            properties:
              id: { type: string, enum: [files, dlna, spotify] }
              name: { type: string }
              albums: { type: integer }
              tracks: { type: integer }
        albums:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/AlbumItem" }
              - type: object
                properties:
                  kind: { type: string, enum: [album, single, live, compilation, edition], description: "Which shelf: single covers singles and EPs, edition special editions and regional pressings." }
    AlbumDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        artist:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        year: { type: integer, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        favorite: { type: boolean }
        genres: { type: array, items: { type: string } }
        details:
          type: object
          additionalProperties: true
          description: "label, release type, mood, rating, credits … see docs/api/library.md"
        playable: { type: boolean }
        tracks:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              duration: { type: integer, nullable: true }
              playable: { type: boolean }
              favorite: { type: boolean }
              details: { type: object, additionalProperties: true }
    PlaylistDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        owner: { type: string, nullable: true }
        last_played_at: { type: string, format: date-time, nullable: true, description: When it was last started from the server }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        mode: { type: string, enum: [library, local], description: "How this request would play the playlist: its own library (`library`), or the Local copies of a playlist of another library (`local`, from library=dlna)" }
        mode_library: { type: string, nullable: true, description: "The library playback goes through in that mode (spotify, dlna); null for a local/smart playlist without `library`" }
        sources:
          type: array
          items: { type: string }
          description: "Libraries the visible tracks come from (spotify, dlna); for a playlist of a library (a Spotify playlist) only that library, whatever its tracks' merged copies offer; [dlna] in local mode"
        track_count: { type: integer, description: All tracks of the playlist }
        local_track_count: { type: integer, nullable: true, description: Tracks with a playable Local copy; null for local/smart/Local playlists }
        local_coverage: { type: number, nullable: true, description: "0..1, 2 decimals; null as local_track_count" }
        smart: { type: boolean, description: Rule-based playlist }
        rules:
          type: object
          nullable: true
          description: The stored rules of a smart playlist; null otherwise
          properties:
            match: { type: string, enum: [all, any] }
            sort: { type: string, example: most_played }
            limit: { type: integer }
            rules:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: genre }
                  operator: { type: string, example: is }
                  value: { description: string or integer, depending on the field }
                  text: { type: string, example: Genre is Rock }
        rules_summary: { type: string, nullable: true, example: "Genre is Rock and Times played at least 3, up to 50 tracks" }
        playable: { type: boolean }
        tracks:
          type: array
        signal:
          type: boolean
          description: The source has a signal (an HDMI box that is on). Show it as a status dot. Absent when the device cannot tell (B&O TVs report it).
          description: First 200 tracks in playlist order
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              artist_name: { type: string, nullable: true }
              duration: { type: integer, nullable: true }
              artwork: { $ref: "#/components/schemas/LibraryArtwork", description: The track's album cover, null when none or not processed }
              playable: { type: boolean, description: "In local mode: has a local copy playable on device_id" }
              missing_locally: { type: boolean, description: "Local mode only: the track has no copy in the Local library (not playable)" }
    SearchTrack:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        artist_name: { type: string, nullable: true }
        album_id: { type: integer }
        album_name: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }

    Registration:
      type: object
      properties:
        registration_token: { type: string }
        pairing_code: { type: string, example: K7M3QX }
        status: { type: string, example: pending }
    ClientStatus:
      type: object
      properties:
        status: { type: string, enum: [pending, approved] }
        api_token: { type: string }
        type: { type: string, enum: [single, multi] }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceList" }

    PlayerSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PlayerKind" }
        state: { type: string }
    PlayerKind:
      type: string
      description: Display only. `retro` is for old handhelds and computers.
      enum: [web, ios, esp32, retro]
    PlayerRegistration:
      type: object
      required: [name, kind]
      properties:
        token: { type: string, description: "From the first registration; omit the first time" }
        adopt_device_id: { type: integer, description: "Take over this existing player (only when `token` is not known)" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PlayerKind" }
        capabilities:
          type: array
          description: "Optional controls the player supports (default all). `media_controls` and `library_playback` are always on."
          items: { type: string, enum: [seek, queue, queue_jump, shuffle, repeat, volume_control] }
        formats:
          type: array
          description: "MIME types the player decodes (default: mp3, aac, flac, ogg, wav)"
          items: { type: string, example: audio/mpeg }
        profile:
          type: string
          enum: [mp3-lo, mp3-mid]
          description: "Wants this proxy of every track, even one it could decode (a slow link or a small decoder). Unknown values are ignored."
    PlayerRegistered:
      type: object
      properties:
        player_token: { type: string }
        device_id: { type: integer }
        name: { type: string }
        command_topic: { type: string, example: remoment/playercmd/12 }
        last_command_id: { type: integer, description: "Poll commands after this id" }
        mqtt:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            ws_port: { type: integer }
    PlayerCommand:
      type: object
      description: |
        `op` decides the other fields. `play`: `track`. `seek`: `position` (seconds). `volume`: `volume` (0-100).
        `mute`: `muted`. `resume`, `pause` and `stop` have none. `next`, `previous`, queue jumps, shuffle and
        repeat are resolved by the server into `play` or `stop`. A `pause` right after a skip means the proxy of
        the next track is being made; the `play` follows.
      required: [id, op]
      properties:
        id: { type: integer, description: "Rises per player; ignore ids you have seen" }
        op: { type: string, enum: [play, resume, pause, stop, seek, volume, mute] }
        track: { $ref: "#/components/schemas/PlayerTrack" }
        position: { type: number }
        volume: { type: integer, minimum: 0, maximum: 100 }
        muted: { type: boolean }
    PlayerTrack:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, example: "/stream/42?profile=mp3-lo", description: "A path: prefix the server's address" }
        profile: { type: string, nullable: true, description: "Proxy profile of `url`, null for the original" }
        mime: { type: string, nullable: true, description: "MIME type of what `url` serves" }
        name: { type: string }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        images:
          type: array
          description: "Cover paths (320 px JPEG); empty until the cover is processed"
          items: { type: string }
        lite:
          type: string
          nullable: true
          example: /api/artwork/9e107d9d372bb6826bd81d3542a419d6
          description: "Base of the tiny covers: add `/{size}.{gif|bmp|pgm}` (GET /artwork/{hash}/{size}.{format}). Null until the cover is processed."
    PlayerState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [playing, paused, stopped] }
        track_id: { type: integer, nullable: true }
        position: { type: number, minimum: 0 }
        duration: { type: number, minimum: 0 }
        volume: { type: integer, minimum: 0, maximum: 100 }
        muted: { type: boolean }
        ended: { type: boolean, description: "The track finished; the server sends the next `play` (or `stop`)" }
