        "403": { description: Forbidden for client devices }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/external/{provider}/search:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [spotify] } }
      - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      - { name: type, in: query, required: true, schema: { type: string, enum: [artist, album, track] } }
