                    type: array
                    items: { $ref: "#/components/schemas/ExternalItem" }
        "403": { description: Forbidden for client devices }
        "404": { description: unknown_provider or not_found }
        "422": { description: not_connected }
        "502": { description: The service did not answer (driver_error) }
  /library/external/{provider}/albums/{id}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [spotify] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Library]
      operationId: getExternalAlbum
      responses:
        "200":
          description: The album and its tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  album: { $ref: "#/components/schemas/ExternalItem" }
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalItem" }
        "403": { description: Forbidden for client devices }
        "404": { description: unknown_provider or not_found }
        "422": { description: not_connected }
        "502": { description: The service did not answer (driver_error) }
  /library/external/{provider}/{section}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [spotify] } }
      - { name: section, in: path, required: true, schema: { type: string, enum: [saved-albums, liked-tracks, recent] } }
    get:
      tags: [Library]
      operationId: getExternalAccountSection
      description: What the account saved (albums), liked (tracks) or played recently (tracks) on the service, read live, newest first, at most 50. Recently played needs the `user-read-recently-played` scope. Not available to client devices.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalItem" }
        "403": { description: Forbidden for client devices }
        "404": { description: unknown provider or section }
        "422": { description: not_connected }
        "502": { description: The service did not answer or refused the scope (driver_error) }
  /library/external/{provider}/playlists:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [spotify] } }
    get:
      tags: [Library]
      operationId: listExternalPlaylists
      description: The account's playlists on the service, read live (never imported). Not available to client devices.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalItem" }
        "403": { description: Forbidden for client devices }
        "404": { description: unknown_provider }
        "422": { description: not_connected }
        "502": { description: The service did not answer (driver_error) }
  /library/external/{provider}/playlists/{id}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [spotify] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Library]
      operationId: getExternalPlaylist
      responses:
        "200":
          description: The playlist and its tracks (`tracks` is null when the service does not share them)
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist: { $ref: "#/components/schemas/ExternalItem" }
                  tracks:
                    type: array
                    nullable: true
                    items: { $ref: "#/components/schemas/ExternalItem" }
        "403": { description: Forbidden for client devices }
        "404": { description: unknown_provider or not_found }
        "422": { description: not_connected }
        "502": { description: The service did not answer (driver_error) }
  /devices/{device}/library/play-external:
    parameters:
      - { name: device, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Library]
      operationId: playExternal
      description: Plays an item of an external catalogue on a device without importing it (Spotify as the album/artist context or the track URI).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, type, id]
              properties:
                provider: { type: string, enum: [spotify] }
                type: { type: string, enum: [artist, album, track, playlist] }
                id: { type: string }
                shuffle: { type: boolean }
      responses:
        "200":
          description: Playing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  provider: { type: string }
                  type: { type: string }
                  id: { type: string }
        "422": { $ref: "#/components/responses/DeviceError" }
        "502": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }
  /library/catalogue/{id}/wanted:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Library]
      operationId: wantCatalogueAlbum
      description: Household-wide wish for an album the library lacks; clears "ignored". Not available to client devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wanted]
              properties:
                wanted: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wanted: { type: boolean }
        "403": { description: Forbidden for client devices }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/catalogue/{id}/ignored:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Library]
      operationId: ignoreCatalogueAlbum
      description: '"I don''t want this": hides the release-group from the discography and the wishlist; clears a wish. Not available to client devices.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ignored]
              properties:
                ignored: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ignored: { type: boolean }
        "403": { description: Forbidden for client devices }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/artists/{artist}/favorite:
    parameters:
      - name: artist
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Library]
      operationId: favoriteArtist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
  /library/albums:
    get:
      tags: [Library]
      summary: All albums with tracks, 60 per page
      operationId: listAlbums
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: sort
          in: query
          schema: { type: string, enum: [name, artist, year, added, plays, plr, bpm, arousal], default: name, description: "`plr`, `bpm` and `arousal` order by the mean over the album's analysed tracks, highest first, albums without analysis last" }
        - name: letter
          in: query
          description: "Start at the first album whose sort key (album name with `name`, artist name with `artist`, \"The \" ignored for artists only) is at or after this letter (`#` = the start). Ignored with `year`, `added`, `plays` and with a cursor."
          schema: { type: string, pattern: "^[A-Za-z#]$" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
                  next_cursor: { type: string, nullable: true }
  /library/tracks:
    get:
      tags: [Library]
      summary: All tracks of the scope, 50 per page
      operationId: listTracks
      description: "Sound filters keep tracks whose own audio file is analysed and meets every criterion given (Full profile has the data; elsewhere nothing matches). A track without analysis, or without the value a filter tests, never matches. Values are raw, never normalised (arousal and valence of a library may use only a narrow part of 0 to 1). `include=analysis` adds an `analysis` block per row (null for an unanalysed track); `count_only=1` answers `{ total }` for the same filters, for a slider. `sort=plr|bpm|arousal` is highest first, unanalysed last. See docs/api/sound-query.md."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: sort
          in: query
          schema: { type: string, enum: [name, artist, added, plays, plr, bpm, arousal], default: name }
        - { name: include, in: query, schema: { type: string, enum: [analysis] }, description: "Adds `analysis` (TrackSoundSummary or null) to every row" }
        - { name: count_only, in: query, schema: { type: boolean }, description: "Answer `{ total }` (tracks matching the scope and filters) instead of a page" }
        - { name: bpm_min, in: query, schema: { type: number } }
        - { name: bpm_max, in: query, schema: { type: number } }
        - { name: camelot, in: query, schema: { type: string, example: "8A,9A" }, description: "Comma list of Camelot codes, any of them" }
        - { name: arousal_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: arousal_max, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: valence_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: valence_max, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: danceability_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: instrumental_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: plr_min, in: query, schema: { type: number }, description: "Peak-to-loudness ratio in dB, at least" }
        - { name: mood, in: query, schema: { type: string, example: "relaxed,happy" }, description: "Comma list of happy, sad, aggressive, relaxed, party, acoustic, electronic; any of them" }
        - { name: lossless_suspect_max, in: query, schema: { type: number, minimum: 0, maximum: 1 }, description: "At most this suspicion of a transcode (lossy files have no value and never match)" }
        - { name: measured_bit_depth_min, in: query, schema: { type: integer, minimum: 1 } }
        - { name: clipping, in: query, schema: { type: integer, enum: [0, 1] }, description: "1 = clipping suspected, 0 = not" }
        - name: letter
          in: query
          description: "Start at the first track whose sort key (track name with `name`, artist name with `artist`) is at or after this letter (`#` = the start). Ignored with `added`, `plays` and with a cursor."
          schema: { type: string, pattern: "^[A-Za-z#]$" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: "Only with count_only=1: the answer is `{ total }` and nothing else" }
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SearchTrack" }
                        - type: object
                          properties:
                            analysis:
                              allOf: [{ $ref: "#/components/schemas/TrackSoundSummary" }]
                              nullable: true
                              description: "Only with include=analysis; null for a track without an analysed file"
                  next_cursor: { type: string, nullable: true }
  /library/tracks/{track}/waveform:
    parameters:
      - { name: track, in: path, required: true, schema: { type: integer }, description: "Library track id (a merged id resolves to the survivor)" }
    get:
      tags: [Library]
      summary: The waveform of a track's own audio file
      operationId: getTrackWaveform
      description: "404 until the file is analysed (`features.analysis`). Cacheable for an hour."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrackWaveform" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/tracks/{track}/mixes-with:
    parameters:
      - name: track
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Library]
      summary: Tracks that mix well with this one (similar tempo, compatible Camelot key), closest first, 50 per page
      operationId: listTrackMixesWith
      description: "Needs audio analysis (Full profile). Candidates have a tempo within 6 % of the track's, or of half or double it, and a Camelot code that is the same, one step either way or the relative key; never the same recording. Order: key relation (same, relative, adjacent), then tempo difference, then direct before half/double time, then id. `422 not_analysed` while the track has no tempo and key."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: device_id
          in: query
          description: Keep to tracks this device can play
          schema: { type: integer }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  canonical_id: { type: integer }
                  source:
                    type: object
                    properties:
                      bpm: { type: number }
                      camelot: { type: string, example: 8A }
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SearchTrack" }
                        - type: object
                          properties:
                            bpm: { type: number }
                            camelot: { type: string, example: 9A }
                            key_relation: { type: string, enum: [same, relative, adjacent] }
                            tempo_relation: { type: string, enum: [same, half, double] }
                            tempo_diff_percent: { type: number, example: 2.1 }
                  next_cursor: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`not_analysed`: the track has no tempo and key yet" }
  /library/tracks/{track}/similar:
    parameters:
      - name: track
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Library]
      summary: Tracks that sound like this one (sound embedding), most similar first, 50 per page
      operationId: listSimilarTracks
      description: "Needs the sound embedding of the track's own file (analysis with the ML sidecar; Full profile). Candidates are the tracks of the scope that have one too, ranked by the cosine similarity of the embeddings; never the track itself, the same recording, or the same artist's track with the same title. At most 200 deep (`next_cursor` ends there). `device_id` keeps to tracks that device can play. `similarity` is 0 to 1 for typical music (cosine, higher is closer), `distance` is 1 minus it; `reason` says what else the two share, from the analysis. `422 not_analysed` while the track has no embedding. See docs/api/similar-tracks.md."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: device_id
          in: query
          description: Keep to tracks this device can play
          schema: { type: integer }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  canonical_id: { type: integer }
                  source:
                    type: object
                    properties:
                      model: { type: string, example: discogs-effnet-bs64-1 }
                      dimensions: { type: integer, example: 1280 }
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SearchTrack" }
                        - type: object
                          properties:
                            similarity: { type: number, example: 0.912 }
                            distance: { type: number, example: 0.088 }
                            reason:
                              type: object
                              properties:
                                moods: { type: array, items: { type: string }, description: Mood tags both tracks have }
                                genres: { type: array, items: { type: string }, description: Classifier genre tags both tracks have }
                                tempo_diff_percent: { type: number, nullable: true, description: "Tempo difference as a percentage of this track's tempo; null without a tempo on either" }
                                same_artist: { type: boolean }
                  next_cursor: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`not_analysed`: the track has no sound embedding yet" }
  /library/albums/{album}:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
      - name: device_id
        in: query
        description: Make `playable` specific to this device
        schema: { type: integer }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [Library]
      operationId: getAlbum
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/albums/{album}/favorite:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Library]
      operationId: favoriteAlbum
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
  /library/albums/{album}/spotify:
    parameters:
      - name: album
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Library]
      summary: The album as Spotify has it (needs Spotify connected on the server)
      operationId: getAlbumSpotify
      responses:
        "200":
          description: Spotify's tracks in album order; `track_id` is the library track that holds it, else null
          content:
            application/json:
              schema:
                type: object
                properties:
                  missing: { type: integer, description: Tracks not in the library }
                  tracks:
                    type: array
                    items:
                      type: object
                      properties:
                        spotify_id: { type: string }
                        name: { type: string }
                        number: { type: integer }
                        disc: { type: integer }
                        duration: { type: integer, description: Seconds }
                        track_id: { type: integer, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`spotify_unavailable`: Spotify is not connected" }
        "502": { description: "`driver_error`: Spotify did not answer" }
  /library/tracks/{track}/favorite:
    parameters:
      - name: track
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Library]
      operationId: favoriteTrack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteBody" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/tracks/{track}/deep-analysis:
    parameters:
      - { name: track, in: path, required: true, schema: { type: integer }, description: "Library track id (a merged id resolves to the survivor). The track needs an own audio file on this server." }
    post:
      tags: [Library]
      summary: Ask for a deep analysis of one track (sections, stems), computed in the background
      description: "Open (no admin token). Queues what is not stored yet for the current file and stage version; a stored result is `already_done`, a missing or unhealthy service of a requested kind (structure service for sections, stems service for stems) `not_available` (409). Poll GET for the state. See docs/api/deep-analysis.md."
      operationId: requestDeepAnalysis
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kinds]
              properties:
                kinds: { type: array, minItems: 1, items: { $ref: "#/components/schemas/DeepAnalysisKind" } }
      responses:
        "200": { description: "`already_done`", content: { application/json: { schema: { $ref: "#/components/schemas/DeepAnalysisRequest" } } } }
        "202": { description: "`queued`", content: { application/json: { schema: { $ref: "#/components/schemas/DeepAnalysisRequest" } } } }
        "409": { description: "`not_available`: STRUCTURE_URL / STEMS_URL unset or the service failed its health check", content: { application/json: { schema: { $ref: "#/components/schemas/DeepAnalysisRequest" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`unknown_kind`, `no_file` (the track has no own file), or a validation error", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [Library]
      summary: State of the deep analysis of one track, per kind
      operationId: getDeepAnalysis
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [track_id, available, kinds]
                properties:
                  track_id: { type: integer, description: The surviving track id }
                  available: { type: boolean, description: "A deep analysis can be requested now (same as features.deep_analysis)" }
                  kinds:
                    type: object
                    properties:
                      sections: { $ref: "#/components/schemas/DeepAnalysisState" }
                      stems: { $ref: "#/components/schemas/DeepAnalysisState" }
                      stem_audio: { $ref: "#/components/schemas/DeepAnalysisState" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`no_file`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /stems/weights:
    get:
      tags: [Library]
      summary: Where the opt-in download of the stem separation weights stands
      description: "Open (no admin token). The Demucs weights are not part of ReMoment and never downloaded by themselves, because their licence is unclear: the stems service starts without them (`weights: missing` in its health) and refuses stem jobs. `state` is `missing`, `downloading`, `ready` or `failed`; kinds `stems` and `stem_audio` are in `features.deep_analysis_kinds` of GET /info only when it is `ready`. `licence` carries the note to show before the download is started. 409 `not_available` without a stems service (`STEMS_URL`), 503 `unreachable`, 502 when the service is an older image without the download. Full profile only. See docs/api/stems.md, \"Weights\"."
      operationId: getStemWeights
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StemWeights" }
        "409": { description: "`not_available`: no stems service is configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "`driver_error`: the service answered wrongly", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`unreachable`: the stems service does not answer", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/stems/weights:
    post:
      tags: [Library]
      summary: Start the opt-in download of the stem separation weights (admin)
      description: "Admin token. Tells the stems service to download the weights from the source and SHA-256 pinned in the service (a file in its models volume, verified before it gets its name). No body. Nothing happens when they are `ready` (200) or already `downloading` (202); a `failed` download is tried again. Poll GET /stems/weights for the progress. Same errors as GET /stems/weights, plus 401 without the token. Full profile only. See docs/api/stems.md, \"Weights\"."
      operationId: downloadStemWeights
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: The weights are ready already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StemWeights" }
        "202":
          description: The download is running (just started or already under way)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StemWeights" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: "`not_available`: no stems service is configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "`driver_error`: the service answered wrongly", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`unreachable`: the stems service does not answer", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/tracks/{track}/stems:
    parameters:
      - { name: track, in: path, required: true, schema: { type: integer }, description: "Library track id (a merged id resolves to the survivor)" }
    get:
      tags: [Library]
      summary: The kept stems of one track as signed audio URLs, for a mixer
      description: "Open (no admin token). Available once a `stem_audio` deep analysis finished for the track (POST /library/tracks/{track}/deep-analysis). Four files (vocals, drums, bass, other), MP3 or FLAC as the server is set (`STEM_AUDIO_FORMAT`), all stereo, 44.1 kHz and as long as the track, so they start together; with `bpm` and `camelot` to line tracks up. Each `url` is a path (put the server address in front) signed for `expires_in` seconds; the signature is the authorization, no token header. A download answers Range requests. See docs/api/stems.md."
      operationId: getTrackStems
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [track_id, format, mime, sample_rate, channels, duration, bytes, expires_in, stems]
                properties:
                  track_id: { type: integer, description: The surviving track id }
                  format: { type: string, enum: [mp3, flac] }
                  mime: { type: string, enum: [audio/mpeg, audio/flac] }
                  bitrate: { type: integer, nullable: true, description: "kbps (MP3); null for FLAC" }
                  sample_rate: { type: integer }
                  channels: { type: integer }
                  duration: { type: number, description: Seconds }
                  bytes: { type: integer, description: Total size of the four files }
                  expires_in: { type: integer, description: Seconds the URLs stay valid }
                  bpm: { type: number, nullable: true }
                  key: { type: string, nullable: true }
                  mode: { type: string, nullable: true }
                  camelot: { type: string, nullable: true, description: "Camelot code such as 8A, null without key data" }
                  stems:
                    type: object
                    description: "Four stems (vocals, drums, bass, other), or six with guitar and piano when the stems service runs `STEMS_MODEL=htdemucs_6s`. Clients read the keys, they do not assume four."
                    required: [vocals, drums, bass, other]
                    additionalProperties:
                      type: object
                      required: [url, bytes]
                      properties:
                        url: { type: string, description: Signed path of the file }
                        bytes: { type: integer }
        "404": { description: "`not_ready` (not kept yet; `state` says none, queued, running or failed) or `files_missing` (gone from the disk: DELETE kind stem_audio and ask again)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`no_file` (the track has no own file)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/tracks/{track}/stems/{stem}:
    get:
      tags: [Library]
      summary: Download one kept stem (signed)
      description: "The URL comes from GET /library/tracks/{track}/stems, signed and temporary. Answers Range requests."
      operationId: downloadTrackStem
      security: []
      parameters:
        - { name: track, in: path, required: true, schema: { type: integer } }
        - { name: stem, in: path, required: true, schema: { type: string, enum: [vocals, drums, bass, guitar, piano, other] } }
      responses:
        "200":
          description: The audio file
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/flac: { schema: { type: string, format: binary } }
        "403": { description: Invalid or expired signature }
        "404": { description: "Not kept, removed, or the file changed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/tracks/{track}/deep-analysis/{kind}:
    delete:
      tags: [Library]
      summary: Remove the stored result of one kind
      description: "Does not follow a merged id: a stale id answers 404."
      operationId: removeDeepAnalysis
      security: []
      parameters:
        - { name: track, in: path, required: true, schema: { type: integer } }
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/DeepAnalysisKind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  removed: { type: boolean, description: False when nothing was stored }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`unknown_kind` or `no_file`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/exports/estimate:
    post:
      tags: [Library]
      summary: What an export would hold, without queueing anything
      description: "Admin only. Plans the selection for a profile: how many tracks are copied, transcoded or skipped (no own file) and the estimated size and number of zip parts. See docs/api/export.md."
      operationId: estimateExport
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExportEstimate" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: "Validation error (unknown type, id or profile)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/exports:
    post:
      tags: [Library]
      summary: Start an export (a zip for an MP3 player or car radio), written in the background
      description: "Admin only. Refused with `export_too_large` (and the estimate) when the plan is over `EXPORT_MAX_GB` or `EXPORT_DIR_MAX_GB`, `nothing_to_export` when no track has an own file, `not_available` (409) without ffmpeg. Poll GET /library/exports/{id}."
      operationId: startExport
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [id, status, estimate]
                properties:
                  id: { type: string, description: The export id (uuid) }
                  status: { type: string, enum: [queued] }
                  estimate: { $ref: "#/components/schemas/ExportEstimate" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: "`not_available`: ffmpeg is missing", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422":
          description: "Validation error, `export_too_large` or `nothing_to_export` (these two carry `estimate`)"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      estimate: { $ref: "#/components/schemas/ExportEstimate" }
    get:
      tags: [Library]
      summary: Recent exports, newest first
      operationId: listExports
      security: [{ adminToken: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Export" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /library/exports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Export id (uuid) from POST /library/exports" }
    get:
      tags: [Library]
      summary: Status, progress and, when done, signed download URLs of one export
      description: "Admin only. Every GET makes fresh signed part URLs (valid 15 minutes); they are paths, put the server address in front."
      operationId: getExport
      security: [{ adminToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Library]
      summary: Cancel a queued or running export, or remove a finished one with its files
      operationId: deleteExport
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  id: { type: string }
                  result: { type: string, enum: [cancelled, removed] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/exports/{id}/download/{part}:
    get:
      tags: [Library]
      summary: Download one zip part of a finished export
      description: "No token: the `expires` and `signature` query parameters of the URL from GET /library/exports/{id} are the authorization (403 without a valid signature). Supports Range requests."
      operationId: downloadExportPart
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: part, in: path, required: true, schema: { type: integer, minimum: 1 }, description: "1-based part number" }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: The zip file, content: { application/zip: { schema: { type: string, format: binary } } } }
        "206": { description: Partial content (Range request), content: { application/zip: { schema: { type: string, format: binary } } } }
        "403": { description: Missing, invalid or expired signature, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: The export or part is not available (not finished, expired, removed), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/editable-playlists:
    get:
      tags: [Library]
      summary: "Playlists made on the server (not smart, not synced from Spotify): the ones tracks can be added to"
      operationId: listEditablePlaylists
      responses:
        "200":
          description: OK, by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        track_count: { type: integer }
                        track_source: { type: string, nullable: true, enum: [files, dlna, spotify], description: "The one library the playlist's tracks come from; null while empty. A playlist never mixes libraries." }
  /library/playlists/{playlist}/tracks:
    parameters:
      - name: playlist
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Library]
      summary: Add a track, or an album's tracks in album order, to a playlist made here; tracks already in it are skipped
      operationId: addPlaylistTracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`track_id` or `album_id`"
              properties:
                track_id: { type: integer }
                album_id: { type: integer }
                source: { type: string, enum: [files, dlna, spotify], description: "Only the tracks of that source (an album's other tracks are left out; a track not in it is refused)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  track_count: { type: integer }
        "422": { description: "Validation error, `unsupported` for a smart or Spotify playlist, or `source_mismatch` when the tracks come from another library than the playlist holds (or from several)" }
  /library/history:
    get:
      tags: [Library]
      summary: What was played, newest first, on every device
      operationId: listPlayHistory
      description: "The server's own play log, household-wide (no per-person history). Cursor-paged on (started_at, id), 50 per page. Plays of a library track outside `scope` are left out; radio, source and unmatched text-only plays always stay. Works in every profile. See docs/api/history.md."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day (Y-m-d, server timezone)" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, inclusive" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Matches title, artist, album, station or source name" }
        - { name: source_type, in: query, schema: { type: string, maxLength: 50 }, description: "Only plays logged for this source type (`spotify`, `radio`, `dlna`, `source` …)" }
        - { name: match, in: query, schema: { type: string, enum: [library, unknown] }, description: "`library`: plays of a track in the library; `unknown`: plays that match none (logged as text, or a radio stub)" }
        - { name: device_id, in: query, schema: { type: integer }, description: "Only plays on this device" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayHistoryPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Invalid cursor or filter", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /devices/{device}/history:
    parameters:
      - { $ref: "#/components/parameters/device" }
    get:
      tags: [Devices]
      summary: What was played on one device, newest first
      operationId: listDevicePlayHistory
      description: "Same entries and filters as GET /library/history, for one device."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day (Y-m-d, server timezone)" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, inclusive" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Matches title, artist, album, station or source name" }
        - { name: source_type, in: query, schema: { type: string, maxLength: 50 }, description: "Only plays logged for this source type (`spotify`, `radio`, `dlna`, `source` …)" }
        - { name: match, in: query, schema: { type: string, enum: [library, unknown] }, description: "`library`: plays of a track in the library; `unknown`: plays that match none (logged as text, or a radio stub)" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayHistoryPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Invalid cursor or filter", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/albums/{album}/plays:
    parameters:
      - { name: album, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Library]
      summary: Recent plays of an album's tracks, newest first
      operationId: listAlbumPlays
      description: "Every play of the album's tracks (no scope trimming). A merged id resolves to the survivor."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day (Y-m-d, server timezone)" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, inclusive" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Matches title, artist, album, station or source name" }
        - { name: source_type, in: query, schema: { type: string, maxLength: 50 }, description: "Only plays logged for this source type (`spotify`, `radio`, `dlna`, `source` …)" }
        - { name: match, in: query, schema: { type: string, enum: [library, unknown] }, description: "`library`: plays of a track in the library; `unknown`: plays that match none (logged as text, or a radio stub)" }
        - { name: device_id, in: query, schema: { type: integer }, description: "Only plays on this device" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayHistoryPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Invalid cursor or filter", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/artists/{artist}/plays:
    parameters:
      - { name: artist, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Library]
      summary: Recent plays of an artist's tracks, newest first
      operationId: listArtistPlays
      description: "Every play of the artist's tracks (no scope trimming). A merged id resolves to the survivor."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day (Y-m-d, server timezone)" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, inclusive" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Matches title, artist, album, station or source name" }
        - { name: source_type, in: query, schema: { type: string, maxLength: 50 }, description: "Only plays logged for this source type (`spotify`, `radio`, `dlna`, `source` …)" }
        - { name: match, in: query, schema: { type: string, enum: [library, unknown] }, description: "`library`: plays of a track in the library; `unknown`: plays that match none (logged as text, or a radio stub)" }
        - { name: device_id, in: query, schema: { type: integer }, description: "Only plays on this device" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayHistoryPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Invalid cursor or filter", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/health/{report}:
    parameters:
      - { name: report, in: path, required: true, schema: { type: string, enum: [transcodes, damaged, clipping, duplicates, lossy, incomplete, unlinked, missing, covers] } }
    get:
      tags: [Library]
      summary: The findings of one library health report
      operationId: getLibraryHealthReport
      description: "Full profile only, except `covers` (albums with no cover, a cover under `config/artwork.php` min_cover_px, a non-square cover or an embedded cover that differs from the one in use: one finding per album, kind `album`, every reason in `reason`), which Standard has too. Each finding names the track, album and artist (where there is one), a one-line `reason` in the server's own wording ('suspected', cutoff in kHz) and, for albums with a physical-collection item, that item (medium, ripped, shelf): the re-rip list for CDs the household owns. The physical collection is closed to client tokens, so `physical` is null with `?client=`. Paged by `cursor`, 100 per page by default, in the report's own order. See docs/api/library-health.md."
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { $ref: "#/components/parameters/client" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  title: { type: string }
                  description: { type: string }
                  count: { type: integer, description: "All findings of the report (cached for ten minutes, like GET /library/health)" }
                  data: { type: array, items: { $ref: "#/components/schemas/HealthFinding" } }
                  next_cursor: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/NotAvailableInProfile" }
  /library/overview:
    get:
      tags: [Library]
      summary: The library at a glance (totals, decades, coverage, sound buckets, formats) and how far audio analysis is
      operationId: getLibraryOverview
      description: "What the web Library page shows, as data. Cached for a few minutes per scope, so counts can lag a scan. `analysis` is null in profiles without analysis (Standard, Control: Control has no library at all and answers 422 not_available_in_profile). See docs/api/overview.md."
      parameters:
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryOverview" } } } }
        "422": { $ref: "#/components/responses/NotAvailableInProfile" }
  /library/stats:
    get:
      tags: [Library]
      summary: Listening statistics of the household (totals, by hour, weekday, day, source, device, top lists)
      operationId: getListeningStats
      description: "The JSON version of the web /stats page, read from the play log: per household and per device, never per person. Dates are in the server's timezone; the default range is the last 30 days including today, at most 731 days. Plays of a library track outside `scope` are left out; plays without a library track (radio, unmatched text-only plays) always count. 'Plays logged', not plays heard: see docs/api/stats.md for what skipped, seconds and a play mean."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day (Y-m-d), default 29 days before `to`" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day (Y-m-d), inclusive, default today" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: "Length of each top list" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListeningStats" } } } }
        "422": { description: "Bad date, `to` before `from`, or a range over 731 days", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/insights:
    get:
      tags: [Library]
      summary: Listening insights of the household (skip rate per artist, new against repeat per week, mood and tempo by part of the day, late listening)
      operationId: getListeningInsights
      description: "Read from the play log joined with audio analysis of the own files; household-wide, never per person. The last `days` days ending today (default 90, at most 365), hours and dates in the server's timezone (`timezone`). Cached for five minutes. Standard and Full only (Control: 422 not_available_in_profile); `parts_of_day` and `late.moods` need the Full profile's analysis and are empty or null-valued without it, and every block degrades to empty when nothing is analysed. See docs/api/insights.md for the skip rule."
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 90 }, description: "Window in days ending today" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListeningInsights" } } } }
        "422": { description: "Bad `days`, or not available in the Control profile (`not_available_in_profile`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /library/health:
    get:
      tags: [Library]
      summary: How many findings each library health report has
      operationId: libraryHealth
      description: Counts only, cached for ten minutes and zero until audio analysis has run. The findings of one report are at GET /library/health/{report}.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [transcodes, damaged, clipping, duplicates, lossy, incomplete, unlinked, missing] }
                        title: { type: string, example: Suspected transcodes }
                        description: { type: string }
                        count: { type: integer }
  /library/listening-modes:
    get:
      tags: [Library]
      summary: Listening modes (focus, party, sleep, workout) the library has enough analysed tracks for
      operationId: listListeningModes
      description: A mode is a selection of the server's own analysed files by tempo, energy, danceability, mood and loudness. A mode with too few matching tracks is left out, so the list is empty until audio analysis has run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: party }
                        name: { type: string, example: Party }
                        description: { type: string }
                        icon: { type: string, description: Font Awesome solid icon name, example: champagne-glasses }
                        track_count: { type: integer, description: Tracks the mode would play (at most 100) }
  /library/discover:
    get:
      tags: [Library]
      summary: Discover shelves (rediscover, new releases, mixes, listening modes, random picks)
      operationId: getLibraryDiscover
      description: >-
        The Discover shelves as data: a list of sections, each with a `kind` (album, artist, track, catalogue, mode), a title, a description and
        items that each carry a `reason` in words. A section with nothing in it is left out, so a small library answers a short list; a new
        shelf is a new section, so lay sections out by `kind`. Rediscover shelves come from the play history and the favorites only
        (thresholds in config/discover.php). `new_releases` is left out for a client token and where the profile has no catalogue;
        `mixes_well` and `listening_modes` need audio analysis (Full). Not available in the Control profile. See docs/api/discover.md.
      parameters:
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
        - { name: sections, in: query, schema: { type: string }, description: "Comma-separated section keys to build (default all): new_releases, forgotten_favorites, used_to_play, on_this_day, forgotten_artists, forgotten_tracks, not_played_in_a_year, mixes_well, listening_modes, random_albums. An unknown key is 422." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60 }, description: "Items per section (default 18)." }
        - { name: seed, in: query, schema: { type: integer }, description: "Another seed, another `random_albums` pick; the same seed gives the same pick." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DiscoverSection" }
        "422": { description: "Validation error, or not available in the Control profile" }
  /library/genres:
    get:
      tags: [Library]
      operationId: listGenres
      parameters:
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GenreItem" }
  /library/genres/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [Library]
      operationId: getGenre
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  colors: { type: array, maxItems: 3, items: { type: string, pattern: "^#[0-9a-f]{6}$" }, description: Same as GenreItem.colors }
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/playlists:
    get:
      tags: [Library]
      summary: Playlists with tracks (smart ones too), recently played first, 50 per page
      description: "In the Local scope (`dlna`/`local`) playlists of another library (Spotify) with local_coverage >= 0.4 are listed too, with `external: true`."
      operationId: listPlaylists
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PlaylistListItem" }
                  next_cursor: { type: string, nullable: true }
    post:
      tags: [Library]
      summary: Create an empty playlist made here
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  track_count: { type: integer }
  /library/playlists/{playlist}:
    parameters:
      - name: playlist
        in: path
        required: true
        schema: { type: integer }
      - name: device_id
        in: query
        schema: { type: integer }
      - name: library
        in: query
        description: "The library the client browsed the playlist in (a library id). Decides `mode`: the playlist's own library, or without `library`, gives `library` mode; `dlna` on a playlist of another library (Spotify) gives `local` mode. A library that makes no sense for the playlist is 422."
        schema: { type: string, example: dlna }
      - { $ref: "#/components/parameters/client" }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [Library]
      operationId: getPlaylist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /library/recent:
    get:
      tags: [Library]
      summary: Most recently played distinct albums
      operationId: listRecent
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
  /library/random-album:
    get:
      tags: [Library]
      summary: One random album in a library
      description: A random album with at least one visible track in the scope; with device_id one that device can play is preferred, else any. 404 when the library has no album.
      operationId: randomAlbum
      parameters:
        - name: device_id
          in: query
          schema: { type: integer }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlbumItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /library/favorites:
    get:
      tags: [Library]
      operationId: listFavorites
      parameters:
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/SearchTrack" }
  /library/search:
    get:
      tags: [Library]
      summary: Substring search over artist, album and track names
      operationId: searchLibrary
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - { $ref: "#/components/parameters/client" }
        - { $ref: "#/components/parameters/scope" }
      responses:
        "200":
          description: At most 10 artists, 15 albums, 20 tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items: { $ref: "#/components/schemas/ArtistItem" }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumItem" }
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/SearchTrack" }

  /devices/{device}/library/play:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      summary: Play one library track (capability library_playback)
      operationId: playTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`track_id`, or `spotify_track_id` for a Spotify track the library does not hold"
              properties:
                track_id: { type: integer }
                spotify_track_id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/PlayedOk" }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-album:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playAlbum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [album_id]
              properties:
                album_id: { type: integer }
                start_track_id: { type: integer }
                shuffle: { type: boolean, default: false }
                source: { type: string, enum: [files, dlna, spotify], description: "Play only from that path; `spotify` plays the album from Spotify even when the library holds none of its tracks" }
      responses:
        "200": { $ref: "#/components/responses/PlayedOk" }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-artist:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playArtist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist_id]
              properties:
                artist_id: { type: integer }
                shuffle: { type: boolean, default: false }
                source: { type: string, enum: [files, dlna, spotify], description: Play only the tracks of this library. }
      responses:
        "200": { $ref: "#/components/responses/PlayedOk" }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-tracks:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playTracks
      description: Shuffles the whole library, a random sample of up to 100 tracks of the scope that the device can play. 422 `not_playable` when it can play none, 422 `unsupported` without library playback.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, description: 'A library id, `local`, `streaming` or `all`.' }
                client: { type: string, description: A client `api_token` whose hidden sources apply. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  queued: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-listening-mode:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playListeningMode
      description: "Plays a random selection of up to 100 tracks that fit the mode and that the device can play. Send a preset `mode`, or a custom `filter` (the sound filter of GET /library/tracks, at least one criterion; own analysed files only). 422 `not_playable` when fewer than 5 qualify on this device, 422 `unsupported` when the device has no library playback, a validation 422 for an unknown mode, a bad filter value, an empty filter, or neither. See docs/api/sound-query.md."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, description: A `key` from `GET /library/listening-modes`, example: sleep }
                filter: { $ref: "#/components/schemas/SoundFilter" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  mode: { type: string, description: "Only when a preset `mode` was sent" }
                  queued: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-similar:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      summary: Similar tracks radio
      operationId: playSimilarTracks
      description: "Plays the track, then up to 49 of the tracks that sound most like it (the order of GET /library/tracks/{id}/similar, only what the device can play), once (no refill). 422 `not_analysed` while the track has no sound embedding, 422 `not_playable` when the track itself or fewer than 6 neighbours can be played on this device, 422 `unsupported` without library playback. See docs/api/similar-tracks.md."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id: { type: integer }
                client: { type: string, description: "A client's api_token: hides what it hides" }
                scope: { type: string, description: "local, streaming, all or a library id; default the leading source" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  seed: { type: integer, description: The track the radio started from }
                  queued: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-daily-mix:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      summary: Play the daily mix
      operationId: playDailyMix
      description: "Plays today's daily mix (the `daily_mix` section of GET /library/discover): songs you loved and have not played for a while, deep cuts (never played, on albums you love) and one track of albums you own and never played, in turns, only what the device can play, once. The same mix all day, a new one tomorrow. 422 `not_playable` when nothing is left to bring back, 422 `unsupported` without library playback. See docs/api/discover.md."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { type: string, description: "A client's api_token: hides what it hides" }
                scope: { type: string, description: "local, streaming, all or a library id; default the leading source" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  queued: { type: integer }
        "422": { $ref: "#/components/responses/DeviceError" }
  /devices/{device}/library/play-playlist:
    parameters: [{ $ref: "#/components/parameters/device" }]
    post:
      tags: [Library playback]
      operationId: playPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playlist_id]
              properties:
                playlist_id: { type: integer }
                start_track_id: { type: integer }
                shuffle: { type: boolean, default: false }
                library:
                  type: string
                  description: "The library the playlist was browsed in; `dlna` on a playlist of another library plays it in local mode (only tracks with a local copy, others skipped). A library that makes no sense for the playlist is 422."
                  example: dlna
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  playlist: { type: string }
                  mode: { type: string, enum: [library, local] }
                  queued: { type: integer, description: Local mode only; tracks queued }
                  skipped: { type: integer, description: Local mode only; playlist tracks without a local copy }
        "422": { $ref: "#/components/responses/DeviceError" }

  /alerts:
    get:
      tags: [Alerts]
      summary: Alerts of the server, newest first
      operationId: listAlerts
      description: >-
        Conditions the server detects (stuck queue, silent scheduler, stale backup, unreachable storage,
        offline device, down listener), raised and later resolved; the same alerts are pushed on MQTT
        `remoment/alerts/{kind}` and summarised on the retained `remoment/alerts/active`. `since` is an id:
        only newer alerts are returned, so a client that opens later passes the highest id it has seen. An
        alert keeps its id when it resolves; re-read with `state=active` to learn which ones ended. The server
        keeps all active alerts and the last 100 resolved.
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0 } }
        - { name: state, in: query, schema: { type: string, enum: [active, resolved, all], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
                  summary:
                    type: object
                    properties:
                      counts:
                        type: object
                        properties:
                          info: { type: integer }
                          warning: { type: integer }
                          critical: { type: integer }
                      kinds: { type: array, items: { type: string } }
                      total: { type: integer }
  /push/subscribe:
    post:
      tags: [Alerts]
      summary: Turn on background alert notifications for this browser (Web Push)
      operationId: subscribePush
      description: >-
        Stores the browser's Web Push subscription (`PushSubscription.toJSON()`: endpoint and keys) so warning and
        critical alerts reach it while the browser is closed. Open like the rest of the API, one row per endpoint
        (posting the same endpoint again refreshes its keys), no account or user. The endpoint must be https on a
        known browser push service (`config/push.php`); the server stores at most 100. The browser takes the
        server's VAPID public key from the settings page (`/settings/health`), not from the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, example: "https://fcm.googleapis.com/fcm/send/abc" }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string, example: "BNc..." }
                    auth: { type: string, example: "x1y2z3" }
      responses:
        "200":
          description: The endpoint was already stored; its keys are refreshed
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
        "201":
          description: Stored
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
        "422":
          description: Not https, not a known push service, malformed keys, or the server is full (`error` `invalid` or `too_many`)
        "429":
          description: More than 20 requests a minute
    delete:
      tags: [Alerts]
      summary: Turn off background alert notifications for this browser
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "200":
          description: Removed (also when it was not stored)
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
        "429":
          description: More than 20 requests a minute
  /admin/alerts/{alert}/ack:
    post:
      tags: [Alerts]
      summary: Acknowledge an alert (admin-wide, not per user)
      operationId: acknowledgeAlert
      security: [{ adminToken: [] }]
      parameters:
        - { name: alert, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The alert with `acknowledged_at` set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Alert" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/diagnostics:
    get:
      tags: [Alerts]
      summary: Download the diagnostics bundle (a redacted zip to attach to an issue)
      description: |
        A zip with versions, profile, health, queues, failed jobs (class and first line), devices without addresses, alerts,
        upgrade history and the last 500 log lines. IP/MAC addresses, tokens, passwords and API keys are never included
        (`docs/architecture/diagnostics.md`). Nothing is uploaded; the response is the file.
      operationId: downloadDiagnostics
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: The zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/queues:
    get:
      tags: [Alerts]
      summary: Health of every job queue (pending, oldest job age, running, failed in 24 hours, workers, paused)
      description: |
        One row per queue the server's workers serve (`docs/api/admin-queues.md`). `state` is `ok` (heartbeat ran), `busy`
        (no heartbeat, a job runs within its allowed time), `stuck` (worker down or hung), `paused` or `unknown` (no heartbeat
        for this queue). `lagging` is true when the oldest waiting job passed `lag_after_seconds` and nothing finished or
        runs; the `queue.stuck` alert follows it. `workers` is null when the worker processes can't be counted.
        `supported` is false for a queue driver that can't be listed (sync); `can_reorder` says whether `prioritise` works.
      operationId: listQueues
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: The queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { type: string, example: redis }
                  supported: { type: boolean }
                  can_reorder: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/QueueHealth" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/queues/{queue}/pause:
    post:
      tags: [Alerts]
      summary: Pause a queue (workers take no new job from it; a running job finishes)
      description: Takes effect on the next poll of every worker, without restarting any. The `health` queue cannot be paused (422 `invalid`). Waiting jobs stay in place. A paused queue raises no alert.
      operationId: pauseQueue
      security: [{ adminToken: [] }]
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The queue's row, `paused` true
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QueueHealth" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: No such queue }
        "422": { description: The queue cannot be paused }
  /admin/queues/{queue}/resume:
    post:
      tags: [Alerts]
      summary: Resume a paused queue
      operationId: resumeQueue
      security: [{ adminToken: [] }]
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The queue's row, `paused` false
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QueueHealth" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: No such queue }
  /admin/queues/{queue}/cancel:
    post:
      tags: [Alerts]
      summary: Cancel the waiting and delayed jobs of a queue, or of one job class in it
      description: |
        Removes jobs a worker has not taken; running jobs are never touched. A cancelled unique job gives its lock back, so
        the same work can be queued again. Heartbeat jobs are never cancelled. `skipped_running` counts jobs a worker took
        while this ran. Not undoable.
      operationId: cancelQueueJobs
      security: [{ adminToken: [] }]
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job: { type: string, description: "A job class, short (EnrichTrackLyrics) or full name; every job when absent", example: EnrichTrackLyrics }
      responses:
        "200":
          description: How many jobs were removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: integer }
                  skipped_running: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: No such queue }
        "422": { description: "Validation failed, or the queue driver cannot be managed" }
  /admin/queues/{queue}/prioritise:
    post:
      tags: [Alerts]
      summary: Run the waiting jobs of a class before the rest of the queue
      description: Moves them to the head of the queue in their order (redis driver). The database driver can't reorder and answers 422 `unsupported`; pause the other queues instead.
      operationId: prioritiseQueueJobs
      security: [{ adminToken: [] }]
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job]
              properties:
                job: { type: string, example: AnalyzeAudioFile }
      responses:
        "200":
          description: How many jobs moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: No such queue }
        "422": { description: "Validation failed, or the driver can't reorder" }
  /announcements/clips:
    get:
      tags: [Playback]
      summary: The clips an announcement can play
      operationId: listAnnouncementClips
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AnnouncementClip" }
  /announcements:
    post:
      tags: [Playback]
      summary: Play a clip on one or more devices; each goes back to what it played
      description: |
        Needs the `stream_url` capability per device. Each device answers for itself in `devices`; `status` is
        `ok`, `partial` or `failed` (502 when no device took the clip). Playback is restored by a queued job after
        the clip's length, so the queue worker must run. See docs/api/announcements.md.
      operationId: announce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clip, device_ids]
              properties:
                clip: { type: string, example: chime }
                device_ids:
                  type: array
                  items: { type: integer }
                volume: { type: integer, minimum: 0, maximum: 100, description: Volume during the clip (never above the device's limit) }
      responses:
        "200":
          description: At least one device plays the clip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementResult" }
        "422": { description: Validation error (unknown clip or device) }
        "502":
          description: No device took the clip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementResult" }
  /scenes:
    get:
      tags: [Scenes]
      summary: All scenes (name, icon and colour for shortcuts and widgets)
      operationId: listScenes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SceneItem" }
    post:
      tags: [Scenes]
      summary: Create a scene
      operationId: createScene
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Scene" }
        "422": { description: "Validation errors, steps as `steps.N.field`" }
  /scenes/{scene}:
    parameters:
      - { name: scene, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Scenes]
      summary: One scene with its steps and the result of its last run
      operationId: getScene
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Scene" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Scenes]
      summary: Change a scene (only the fields given)
      operationId: updateScene
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Scene" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Validation errors" }
    delete:
      tags: [Scenes]
      summary: Delete a scene
      operationId: deleteScene
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
  /scenes/{scene}/activate:
    parameters:
      - { name: scene, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Scenes]
      summary: Run a scene
      operationId: activateScene
      description: |
        A scene without delay steps runs at once (200, per-step `results`). One with delays is queued (202,
        `status` queued) so the request does not wait; read `last_run` on the scene afterwards. See docs/api/scenes.md.
      responses:
        "200":
          description: Ran; `status` is ok, partial or failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, partial, failed] }
                  results: { type: array, items: { $ref: "#/components/schemas/SceneStepResult" } }
                  data: { $ref: "#/components/schemas/SceneItem" }
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: queued }
                  data: { $ref: "#/components/schemas/SceneItem" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tags/{uid}:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: string } }
    get:
      tags: [Tags]
      summary: What a tag plays
      operationId: getTag
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlayTag" }
        "404": { description: "unknown_tag: not assigned to anything" }
  /tags/{uid}/play:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: string } }
    post:
      tags: [Tags]
      summary: Play a tag's target (a reader taps the tag)
      description: |
        On `device_id`, else the tag's own device, else the first device of the client `client` (its api_token).
        The errors are those of the play endpoint behind the target (422 not_playable, not_available_in_profile,
        unsupported; 502; 503). An unknown uid answers 404 `unknown_tag` and is kept for 10 minutes so the admin
        can assign it. See docs/api/tags.md.
      operationId: playTag
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { type: integer }
                client: { type: string, description: A client device's api_token }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  tag: { $ref: "#/components/schemas/PlayTag" }
                  device:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
        "404": { description: "unknown_tag" }
        "422": { description: "no_device, not_playable, unsupported or not_available_in_profile" }
        "502": { $ref: "#/components/responses/DeviceError" }
        "503": { $ref: "#/components/responses/DeviceError" }
  /admin/login:
    post:
      tags: [Admin]
      summary: Sign in as the shared admin (password only) and get a bearer token
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                device_name: { type: string, maxLength: 100, description: Labels the sign-in under Settings › Users }
      responses:
        "200":
          description: The plain token is shown once; store it in the Keychain
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: rmt_… }
                  token_id: { type: integer }
                  name: { type: string, nullable: true }
        "401":
          description: invalid_credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: too_many_attempts (5 wrong passwords per minute per IP)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  retry_after: { type: integer }
  /admin/storage/playback-loudness:
    get:
      tags: [Admin]
      summary: Whether converted streams are levelled to a common loudness
      operationId: getPlaybackLoudness
      security: [{ adminToken: [] }]
      description: "Admin only; Standard and Full (own files). Loudness-normalised playback is off by default and only touches audio the server converts for a renderer that cannot play the original (a proxy of `config/proxies.php`): the gain comes from the stored ReplayGain tag or measured loudness and never passes the true peak. Original files streamed as they are (direct DLNA playback) are never changed, nothing is written to files, no device volume is moved. See docs/architecture/audio-analysis.md."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackLoudness" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/NotAvailableInProfile" }
    put:
      tags: [Admin]
      summary: Switch loudness levelling of converted streams on or off
      operationId: setPlaybackLoudness
      security: [{ adminToken: [] }]
      description: "Admin only. Takes effect for proxies made from now on (a levelled proxy has its own file); proxies already made without gain are not touched."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackLoudness" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/NotAvailableInProfile" }
  /admin/me:
    get:
      tags: [Admin]
      summary: Check the stored token
      operationId: adminMe
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  token_id: { type: integer }
                  name: { type: string, nullable: true }
                  last_used_at: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/token:
    delete:
      tags: [Admin]
      summary: Sign out (revokes this token)
      operationId: adminLogout
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/announcements/clips:
    post:
      tags: [Admin]
      summary: Upload a clip (converted to MP3, the first 30 seconds)
      operationId: uploadAnnouncementClip
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                label: { type: string, maxLength: 64 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AnnouncementClip" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: Not a sound file ffmpeg can read }
  /admin/announcements/clips/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: Remove an uploaded clip
      operationId: deleteAnnouncementClip
      security: [{ adminToken: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "Unknown clip, or the built-in chime" }
  /admin/tags:
    get:
      tags: [Admin]
      summary: All tags
      operationId: listTags
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PlayTag" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Admin]
      summary: Add a tag
      operationId: createTag
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PlayTagInput" }
                - { type: object, required: [target_type, target_id] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlayTag" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: Validation error (also a uid that is in use) }
  /admin/tags/last-scanned:
    get:
      tags: [Admin]
      summary: The unknown tag that was tapped in the last 10 minutes
      operationId: lastScannedTag
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      uid: { type: string }
                      at: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/tags/{tag}:
    parameters:
      - { name: tag, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Admin]
      summary: Change a tag (not its uid)
      operationId: updateTag
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayTagInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlayTag" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [Admin]
      summary: Remove a tag
      operationId: deleteTag
      security: [{ adminToken: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/devices/{device}/volume-limits:
    parameters: [{ $ref: "#/components/parameters/device" }]
    put:
      tags: [Admin]
      summary: Set the device's volume limits (null clears one)
      operationId: setVolumeLimits
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max: { type: integer, minimum: 0, maximum: 100, nullable: true }
                quiet_max: { type: integer, minimum: 0, maximum: 100, nullable: true }
                quiet_from: { type: string, example: "22:00", nullable: true }
                quiet_until: { type: string, example: "07:00", nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeLimits" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/devices/{device}/sources/{source_id}:
    parameters:
      - { $ref: "#/components/parameters/device" }
      - { name: source_id, in: path, required: true, schema: { type: string }, description: URL-encoded }
    put:
      tags: [Admin]
      summary: Show/hide or reorder a source (household-wide)
      operationId: updateSource
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id: { type: string }
                  hidden: { type: boolean }
                  sort_order: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Source not known for this device (list sources first) }
        "422": { description: Invalid body }

  /admin/devices/{device}/links:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Admin]
      summary: The sub device links of a device, as host and as sub device
      description: |
        `sub_devices` are the links where this device is the host, `hosts` those where it is connected to another device.
        Everyone reads the relation in the device detail (`host`, `sub_devices`); the links with their configuration are admin only.
        See docs/api/sub-devices.md.
      operationId: listDeviceLinks
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub_devices: { type: array, items: { $ref: "#/components/schemas/DeviceLink" } }
                  hosts: { type: array, items: { $ref: "#/components/schemas/DeviceLink" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/devices/{device}/link-suggestions:
    parameters: [{ $ref: "#/components/parameters/device" }]
    get:
      tags: [Admin]
      summary: Links this device reports itself (an ASE player's Products list)
      description: Asks the device, so it may answer 502. Only devices of yours that the host lists are suggested; an input is linked by hand.
      operationId: listDeviceLinkSuggestions
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: { type: integer }
                        device_name: { type: string }
                        kind: { $ref: "#/components/schemas/DeviceLinkKind" }
                        via: { type: string }
                        borrowing: { type: boolean, description: "The host already borrows this product's sources" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { description: The device did not answer }
  /admin/device-links:
    post:
      tags: [Admin]
      summary: Connect a sub device to a host
      description: |
        `device_id` is the sub device, `host_device_id` its host. One level deep: a host is no sub device and a sub device is no host.
        A link of kind `input` or `source` needs `via` (the host's source id or input label).
      operationId: createDeviceLink
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, host_device_id, kind]
              properties:
                device_id: { type: integer }
                host_device_id: { type: integer }
                kind: { $ref: "#/components/schemas/DeviceLinkKind" }
                via: { type: string, nullable: true, example: hdmi_1 }
                meta: { type: object, nullable: true, additionalProperties: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: "Invalid body, or a link the rules refuse (error invalid, message says why)" }
  /admin/device-links/{link}:
    parameters:
      - { name: link, in: path, required: true, schema: { type: integer }, description: Link id }
    put:
      tags: [Admin]
      summary: Change the via or the meta of a link
      operationId: updateDeviceLink
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                via: { type: string, nullable: true, example: hdmi_2 }
                meta: { type: object, nullable: true, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Invalid body or a link the rules refuse" }
    delete:
      tags: [Admin]
      summary: Remove a link (both devices keep working on their own)
      operationId: deleteDeviceLink
      security: [{ adminToken: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/job:
    get:
      tags: [Clients]
      summary: The next job for this node (called by the node, Bearer = its client api_token)
      description: |
        A node's own token, not the admin token. `job` is the oldest queued job for a role that is switched on, a job this node already
        accepted (a retry after a lost answer), or null. Counts as a sign of life. See docs/architecture/node-agent.md.
      operationId: nodeNextJob
      security: [{ nodeToken: [] }]
      responses:
        "200":
          description: A job or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { nullable: true, allOf: [{ $ref: "#/components/schemas/NodeJob" }] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /nodes/jobs/{job}/accept:
    post:
      tags: [Clients]
      summary: Accept a queued job (atomic; a second accept after the first is idempotent for the same node)
      operationId: nodeAcceptJob
      security: [{ nodeToken: [] }]
      parameters: [{ $ref: "#/components/parameters/nodeJob" }]
      responses:
        "200":
          description: The job, now accepted
          content:
            application/json:
              schema: { type: object, properties: { job: { $ref: "#/components/schemas/NodeJob" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The job is no longer queued (expired, cancelled, ...)" }
  /nodes/jobs/{job}/progress:
    post:
      tags: [Clients]
      summary: Renew the lease of a running job; the answer says whether the admin cancelled it
      description: Optionally carries `progress` (phase, track, tracks, percent, detail), kept for the job and shown by the admin API (a rip's progress).
      operationId: nodeJobProgress
      security: [{ nodeToken: [] }]
      parameters: [{ $ref: "#/components/parameters/nodeJob" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                progress:
                  type: object
                  properties:
                    phase: { type: string, maxLength: 30 }
                    track: { type: integer, minimum: 0, maximum: 999 }
                    tracks: { type: integer, minimum: 0, maximum: 999 }
                    percent: { type: number, minimum: 0, maximum: 100 }
                    detail: { type: string, maxLength: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { cancel_requested: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The job is not running (any more)" }
  /nodes/jobs/{job}/result:
    post:
      tags: [Clients]
      summary: Report the outcome of a job (idempotent, the first result wins)
      operationId: nodeJobResult
      security: [{ nodeToken: [] }]
      parameters: [{ $ref: "#/components/parameters/nodeJob" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean }
                result: { type: object, additionalProperties: true }
                error: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The job with its final state
          content:
            application/json:
              schema: { type: object, properties: { job: { $ref: "#/components/schemas/NodeJob" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Invalid body }
  /nodes/rippers:
    get:
      tags: [Clients]
      summary: The nodes that can rip a CD (ripper role switched on) and whether a disc is in
      description: Open. `disc` is the disc as of the last check (`POST /admin/rips` without a release), null when there was none or it is older than RIPPER_DISC_FRESH_SECONDS. Full profile. See docs/api/rips.md.
      operationId: listRippers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ripper" }
        "422": { description: "not_available_in_profile" }
  /nodes/files:
    post:
      tags: [Clients]
      summary: Upload one ripped audio file (called by a ripping node, Bearer = its client api_token)
      description: |
        The node's own token, not the admin token, and only while the node has a running `ripper.rip` job that was not cancelled (otherwise `403 no_rip_job`).
        The same ingest as `POST /admin/files` (the Ripper app): an identical file that is already in the library is kept instead, so a retry is safe.
      operationId: nodeUploadFile
      security: [{ nodeToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored and indexed
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { type: object, properties: { id: { type: integer }, path: { type: string }, size: { type: integer }, hash: { type: string } } }
                  track_id: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "no_rip_job: the node has no running rip" }
        "422": { description: "invalid: not audio, or unreadable" }
  /admin/rips:
    get:
      tags: [Clients]
      summary: Recent disc checks and rips of ripper nodes, newest first
      operationId: listRips
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Rip" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Clients]
      summary: Check the disc in a node's drive, or (with `release_mbid`) rip it as that release
      description: |
        Without `release_mbid`: queues a disc check (`kind: probe`); an open check is returned again (200). When the node has answered and MusicBrainz was asked,
        `GET /admin/rips/{id}` has state `choose_release` and the `candidates`. With `release_mbid` (one candidate, or any release with as many tracks as the disc):
        queues the rip (`kind: rip`). Errors: `unsupported` (role not on), `node_offline` 503, `busy` 409, `not_probed`, `no_disc`, `not_audio`, `unknown_release`, `lookup_failed` 502.
        See docs/api/rips.md.
      operationId: startRip
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id: { type: integer }
                release_mbid: { type: string, format: uuid }
      responses:
        "200": { description: The open check or rip that this request would have created, content: { application/json: { schema: { $ref: "#/components/schemas/Rip" } } } }
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Rip" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "No such node" }
        "409": { description: "busy: the node is ripping another disc" }
        "422": { description: "A refusal (see description) or an invalid body" }
        "503": { description: "node_offline" }
  /admin/rips/{rip}:
    get:
      tags: [Clients]
      summary: One disc check or rip, with progress, candidates, files and (rips) the log
      operationId: getRip
      security: [{ adminToken: [] }]
      parameters: [{ name: rip, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Rip" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/rips/{rip}/cancel:
    post:
      tags: [Clients]
      summary: Cancel a check or rip (a running rip is told on its next progress call and stops)
      operationId: cancelRip
      security: [{ adminToken: [] }]
      parameters: [{ name: rip, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Rip" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/nodes/{client}/jobs:
    parameters: [{ name: client, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Clients]
      summary: The last 50 jobs of a node
      operationId: listNodeJobs
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NodeJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Clients]
      summary: Create a job for a node (fixed types only; the same idempotency_key returns the same job)
      operationId: createNodeJob
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [ping] }
                params: { type: object, additionalProperties: true }
                idempotency_key: { type: string, maxLength: 100 }
      responses:
        "200": { description: The existing job of that idempotency key }
        "201":
          description: Created and the node nudged over MQTT (`remoment/node/{id}/cmd/job`, only the id)
          content:
            application/json:
              schema: { type: object, properties: { job: { $ref: "#/components/schemas/NodeJob" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "Unknown type, bad params, role not switched on, not an approved node" }
  /admin/nodes/{client}/jobs/{job}/cancel:
    post:
      tags: [Clients]
      summary: Cancel a job (a queued one ends at once, a running one is told on its next progress call)
      operationId: cancelNodeJob
      security: [{ adminToken: [] }]
      parameters:
        - { name: client, in: path, required: true, schema: { type: integer } }
        - { $ref: "#/components/parameters/nodeJob" }
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { type: object, properties: { job: { $ref: "#/components/schemas/NodeJob" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /clients/register:
    post:
      tags: [Clients]
      summary: Register a client (idempotent per hardware_id)
      operationId: registerClient
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hardware_id: { type: string }
                firmware_version: { type: string }
                build_number: { type: integer }
                metadata: { type: object, additionalProperties: true }
                kind:
                  type: string
                  enum: [client, node]
                  description: "`node` for a ReMoment Node (a headless agent, see docs/architecture/node-agent.md; needs `hardware_id`). Fixed at first registration (`422 kind_mismatch` afterwards)."
                roles:
                  type: array
                  description: Roles a node can take; the admin switches them on. Nodes only.
                  items: { $ref: "#/components/schemas/NodeRole" }
                capabilities:
                  type: object
                  additionalProperties: true
                  description: Informational, keyed by role, at most 16 KiB. Nodes only.
      responses:
        "200":
          description: Already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
        "201":
          description: Newly registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
  /clients/status/{registrationToken}:
    parameters:
      - name: registrationToken
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Clients]
      summary: Poll for approval
      operationId: clientStatus
      responses:
        "200":
          description: pending, or approved with the api_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientStatus" }
  /clients/{apiToken}/devices:
    parameters: [{ $ref: "#/components/parameters/apiToken" }]
    get:
      tags: [Clients]
      summary: Devices this client may see (all of them for a multi client with none assigned)
      operationId: clientDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceList" }
  /clients/{apiToken}/heartbeat:
    parameters: [{ $ref: "#/components/parameters/apiToken" }]
    put:
      tags: [Clients]
      operationId: clientHeartbeat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firmware_version: { type: string }
                build_number: { type: integer }
                metadata: { type: object, additionalProperties: true }
                status:
                  type: object
                  description: Nodes only, every 30 s. Stored as the node's last reported status; ignored for other clients.
                  properties:
                    roles:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          state: { type: string, enum: [idle, busy, error, absent] }
                          detail: { type: string, maxLength: 200 }
                    uptime_seconds: { type: integer }
                    load: { type: number }
                    disk_free_bytes: { type: integer }
      responses:
        "200":
          description: OK; for a node also `roles`, the roles the admin has switched on
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/NodeRole" }
  /clients/{apiToken}/artwork:
    parameters:
      - { $ref: "#/components/parameters/apiToken" }
      - { $ref: "#/components/parameters/cursor" }
    get:
      tags: [Clients]
      summary: Processed covers to pre-cache, by hash
      operationId: clientArtwork
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PrecacheArtwork" }
                  next_cursor: { type: string, nullable: true }

  /players:
    get:
      tags: [Players]
      summary: The existing players, so a new client can take one over
      operationId: listPlayers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerSummary" }
  /players/register:
    post:
      tags: [Players]
      summary: Register a player (idempotent per token)
      description: |
        A player plays the server's own files and then shows up as a normal device. Send the `token` from
        the first registration on every later call (keep it in flash, keychain or `localStorage`); omit it the
        first time. A client without a token can send `adopt_device_id` to take over an existing player: it
        gets a token of its own and the device keeps its name, kind and formats. See `docs/api/players.md`.
      operationId: registerPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerRegistration" }
      responses:
        "201":
          description: Registered (also for a repeat call with a known token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerRegistered" }
        "422": { description: Invalid request }
  /players/{token}/commands:
    parameters:
      - $ref: "#/components/parameters/playerToken"
    get:
      tags: [Players]
      summary: Commands for the player (the HTTP alternative to MQTT `remoment/playercmd/{device_id}`)
      description: |
        Returns the commands with an id above `since`, oldest first; the last 50 are kept for 5 minutes. With
        `wait` the call holds for up to that many seconds (max 25) until a command arrives, so an old client
        with no MQTT can long-poll. Also counts as a sign of life. Start `since` at `last_command_id` from
        registration, and ignore ids already seen.
      operationId: getPlayerCommands
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 25, default: 0 }, description: "Seconds to wait for a command" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerCommand" }
        "404": { description: Unknown token }
  /players/{token}/state:
    parameters:
      - $ref: "#/components/parameters/playerToken"
    put:
      tags: [Players]
      summary: "Report what the player is doing (on every change and about every 5 s: this is the heartbeat)"
      description: |
        No report for 10 s makes the device `unreachable`. Send `ended: true` when the track finishes: the server
        then sends the next `play`, or `stop` at the end of the queue.
      operationId: putPlayerState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerState" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "404": { description: Unknown token }
        "422": { description: Invalid request }
  /artwork/{hash}/{size}.{format}:
    parameters:
      - { name: hash, in: path, required: true, description: "`hash` of a library artwork object, or the last segment of `lite` in a `play` command", schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      - { name: size, in: path, required: true, schema: { type: integer, enum: [32, 48, 64, 96, 120, 160] } }
      - { name: format, in: path, required: true, schema: { type: string, enum: [gif, bmp, pgm] } }
    get:
      tags: [Players]
      summary: A tiny cover for old or small screens
      description: |
        A square GIF, uncompressed 8-bit BMP or binary PGM (P5), cut on the first request from the processed
        320 px cover and kept. `404` also means the cover is not processed yet: show a placeholder and try
        again on the next track.
      operationId: getLiteArtwork
      parameters:
        - { name: colors, in: query, description: "Palette size (grey levels for a PGM)", schema: { type: integer, enum: [2, 4, 16, 64, 256], default: 16 } }
      responses:
        "200":
          description: The image
          content:
            image/gif: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
            image/x-portable-graymap: { schema: { type: string, format: binary } }
        "404": { description: "Unknown size or format, or the cover is not processed yet" }
        "422": { description: "`colors` is not one of the allowed values" }
  /stream/{track}:
    servers:
      - url: http://remoment.local
        description: Not under /api
    parameters:
      - { name: track, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Players]
      summary: The audio of one of the server's own tracks (the `url` of a `play` command)
      description: |
        Unauthenticated, byte ranges supported (seek). Without `profile` it is the original file. With a
        `profile` it is a smaller MP3 made on demand (`mp3-lo`: mono, 22.05 kHz, 48 kbit/s; `mp3-mid`: stereo,
        44.1 kHz, 128 kbit/s); until that proxy exists the original is sent and the proxy is queued, so a client
        that was told a `profile` by a `play` command always finds it ready. `/stream/{track}.{ext}` is the same
        file under an address with its extension. Plain HTTP/1.0 works.
      operationId: streamTrack
      parameters:
        - { name: profile, in: query, schema: { type: string, enum: [mp3-lo, mp3-mid] } }
      responses:
        "200":
          description: The audio file
          content:
            "*/*": { schema: { type: string, format: binary } }
        "206": { description: Partial content (Range request) }
        "404": { description: The track has no file }
  /admin/health:
    get:
      tags: [Admin]
      summary: Server health (the data of Settings › Health)
      description: "Broker, scheduler and queue worker heartbeats, queue size, last backup and upgrade, radio relay, active alerts and every device with its listener. `ok` is one flag for a badge. See docs/api/admin-health.md."
      operationId: getAdminHealth
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealth" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/health/services:
    get:
      tags: [Admin]
      summary: Cached probe results of the external services
      operationId: listHealthServices
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthServices" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/health/services/check:
    post:
      tags: [Admin]
      summary: Run the external-service probes now
      description: "Runs all probes, or only the ids in `only`; each has an 8 second timeout. Answers with the fresh list."
      operationId: checkHealthServices
      security: [{ adminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                only: { type: array, minItems: 1, items: { type: string, example: musicbrainz }, description: "Probe ids from GET /admin/health/services" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthServices" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/clients:
    get:
      tags: [Admin]
      summary: Client registrations (pending first)
      operationId: listAdminClients
      security: [{ adminToken: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved] } }
      responses:
        "200":
          description: OK (the API token is never in the list)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminClient" } }
                  pending: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/clients/{client}:
    parameters:
      - { name: client, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Admin]
      summary: One client, with its API token
      operationId: getAdminClient
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin]
      summary: Edit a client (only the keys sent change)
      operationId: updateClient
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true, maxLength: 255 }
                type: { type: string, enum: [single, multi], description: "A single client keeps at most one device" }
                device_ids: { type: array, items: { type: integer }, description: "Replaces the list; existing devices only" }
                roles: { type: array, items: { $ref: "#/components/schemas/NodeRole" }, description: "A node's roles switched on, within what it declared" }
                hidden_sources: { type: array, items: { type: string }, description: "Library ids the client does not see (replaces the list)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Admin]
      summary: Remove a client (its token stops working)
      operationId: deleteClient
      security: [{ adminToken: [] }]
      responses:
        "200": { description: "{ status: ok }" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/clients/{client}/approve:
    parameters:
      - { name: client, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Approve a pending registration (issues the API token)
      operationId: approveClient
      security: [{ adminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [single, multi], default: single }
                name: { type: string, nullable: true, maxLength: 255 }
                roles: { type: array, items: { $ref: "#/components/schemas/NodeRole" }, description: "A node's declared roles to switch on; default none" }
      responses:
        "200":
          description: OK (with the API token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`not_pending`: already approved" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/clients/{client}/reject:
    parameters:
      - { name: client, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Reject (remove) a pending registration
      operationId: rejectClient
      security: [{ adminToken: [] }]
      responses:
        "200": { description: "{ status: ok }" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`not_pending`: an approved client is removed with DELETE" }
  /admin/clients/{client}/regenerate-token:
    parameters:
      - { name: client, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: A new API token for an approved client (the old one stops working)
      operationId: regenerateClientToken
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK (with the new token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`not_approved`: a pending registration has no token yet" }
  /multiroom/presets:
    get:
      tags: [Multiroom]
      summary: Multiroom presets (open, no admin token)
      operationId: listMultiroomPresets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MultiroomPreset" } }
    post:
      tags: [Multiroom]
      summary: Create a preset (the first device is the host)
      operationId: createMultiroomPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, device_ids]
              properties:
                name: { type: string, maxLength: 100 }
                device_ids: { type: array, minItems: 2, items: { type: integer }, description: "Distinct, existing devices; the first is the host" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiroomPresetEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /multiroom/presets/{preset}:
    parameters:
      - { name: preset, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Multiroom]
      summary: Rename or regroup a preset
      operationId: updateMultiroomPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                device_ids: { type: array, minItems: 2, items: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiroomPresetEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Multiroom]
      summary: Delete a preset
      operationId: deleteMultiroomPreset
      responses:
        "200": { description: "{ status: ok }" }
        "404": { $ref: "#/components/responses/NotFound" }
  /multiroom/presets/{preset}/activate:
    parameters:
      - { name: preset, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Multiroom]
      summary: Make every other device of the preset join the first (the host)
      operationId: activateMultiroomPreset
      responses:
        "200":
          description: "`ok`, or `partial` when some devices failed (listed in `failed`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiroomPresetActivation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`invalid`: fewer than 2 of the preset's devices still exist" }
        "502": { description: "`driver_error`: nobody could join (the body also has host, joined, failed)" }
  /admin/radio-stations:
    get:
      tags: [Admin]
      summary: Every radio station with its identifiers
      operationId: listAdminRadioStations
      security: [{ adminToken: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Name filter }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminRadioStation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Admin]
      summary: Add a radio station
      operationId: createRadioStation
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/RadioStationInput" }
                - { type: object, required: [name] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRadioStationEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/radio-stations/search:
    get:
      tags: [Admin]
      summary: Stream finder (radio-browser.info)
      description: "Plain streams only; an empty list for under 2 characters or an unreachable directory."
      operationId: searchRadioDirectory
      security: [{ adminToken: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RadioDirectoryResult" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/radio-stations/directory:
    post:
      tags: [Admin]
      summary: Add a stream-finder result as a station (once per stream URL)
      operationId: addRadioFromDirectory
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/RadioDirectoryResult" }
                - { type: object, required: [name, url] }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRadioStationEnvelope" }
        "200":
          description: The station that already has this stream URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRadioStationEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/radio-stations/{station}:
    parameters:
      - { name: station, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Admin]
      summary: One station with its identifiers
      operationId: getAdminRadioStation
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRadioStationEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin]
      summary: Change a station (only the keys sent; an empty identifier removes it)
      operationId: updateRadioStation
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioStationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRadioStationEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Admin]
      summary: Remove a station
      operationId: deleteRadioStation
      security: [{ adminToken: [] }]
      responses:
        "200": { description: "{ status: ok }" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/device-models:
    get:
      tags: [Admin]
      summary: What a device can be added as
      operationId: listDeviceModels
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        brand: { type: string, example: Sonos }
                        product: { type: string }
                        driver_name: { type: string }
                        virtual: { type: boolean, description: "No network address (Spotify)" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/devices:
    get:
      tags: [Admin]
      summary: Every device, hidden ones too
      operationId: listAdminDevices
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminDevice" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Admin]
      summary: Add a device by hand (the driver follows from brand and product)
      operationId: createDevice
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name, device_brand_name, device_product_type]
              properties:
                device_name: { type: string, maxLength: 255 }
                device_brand_name: { type: string, description: "From GET /admin/device-models" }
                device_product_type: { type: string }
                ip_address: { type: string, description: "Required unless the model is virtual" }
                hidden: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeviceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/devices/{device}:
    parameters:
      - { $ref: "#/components/parameters/device" }
    get:
      tags: [Admin]
      summary: One device, with `hidden`
      operationId: getAdminDevice
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeviceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin]
      summary: Edit a device (only the keys sent)
      operationId: updateDevice
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: { type: string, maxLength: 255 }
                ip_address: { type: string, nullable: true }
                hidden: { type: boolean, description: "Out of the pickers; the device stays stored and listened to" }
                device_brand_name: { type: string, description: "Together with device_product_type: picks the driver again" }
                device_product_type: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeviceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Admin]
      summary: Remove a device and its meta
      operationId: deleteDevice
      security: [{ adminToken: [] }]
      responses:
        "200": { description: "{ status: ok }" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/discovery:
    get:
      tags: [Admin]
      summary: The discovery inbox and the state of the last scan
      operationId: getDiscovery
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan: { $ref: "#/components/schemas/DiscoveryScan" }
                  data: { type: array, items: { $ref: "#/components/schemas/DiscoveredDevice" } }
                  ignored: { type: array, items: { $ref: "#/components/schemas/DiscoveredDevice" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/discovery/scan:
    post:
      tags: [Admin]
      summary: Queue a network scan (poll GET /admin/discovery)
      description: "A scan that is already running is not started twice; the same state comes back."
      operationId: startDiscoveryScan
      security: [{ adminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hosts: { type: array, maxItems: 20, items: { type: string, example: 192.168.1.9 }, description: "Extra addresses probed directly (IPv4 or http(s) URL), for when multicast does not reach the server" }
      responses:
        "202":
          description: Queued, or the scan that runs already
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan: { $ref: "#/components/schemas/DiscoveryScan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/discovery/add-all:
    post:
      tags: [Admin]
      summary: Add every find that is not ignored as a device
      operationId: addAllDiscovered
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  device_ids: { type: array, items: { type: integer } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /admin/discovery/{found}/add:
    parameters:
      - { name: found, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Add a find as a device
      operationId: addDiscovered
      security: [{ adminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true, maxLength: 255, description: "Default: the name it was found with" }
      responses:
        "201":
          description: Added (the find leaves the inbox)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeviceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/discovery/{found}/ignore:
    parameters:
      - { name: found, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Set a find aside
      operationId: ignoreDiscovered
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DiscoveredDevice" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/discovery/{found}/restore:
    parameters:
      - { name: found, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Bring an ignored find back
      operationId: restoreDiscovered
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DiscoveredDevice" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/sync/targets:
    get:
      tags: [Sync]
      summary: Sync targets (a USB stick on a node, the iOS app's offline library)
      description: "Admin token. Sync keeps a target filled with a rule-defined part of the library (docs/api/sync.md). Standard and Full profile with own files and ffmpeg (`features.sync`); Control answers `422 not_available_in_profile`."
      operationId: listSyncTargets
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK, by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SyncTarget" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Sync]
      summary: Create a sync target (an app target is idempotent on `client_ref`)
      description: "An `app` target needs the `client_ref` the install keeps (200 and the existing target when it is known); a `node` target needs an approved node that declares the `sync-target` role, one target per node. Rules are validated and defaults filled."
      operationId: createSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, maxLength: 100 }
                kind: { type: string, enum: [app, node] }
                client_ref: { type: string, maxLength: 64 }
                node_id: { type: integer }
                rules: { $ref: "#/components/schemas/SyncRules" }
      responses:
        "200": { description: The target of this `client_ref` already existed, content: { application/json: { schema: { $ref: "#/components/schemas/SyncTarget" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SyncTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: Validation error (unknown selection type, unknown profile, flat layout for more than one playlist ...), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/sync/targets/{target}:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string }, description: "Target id (a ULID)" }
    get:
      tags: [Sync]
      summary: One sync target with its rules, last report and last run
      operationId: getSyncTarget
      security: [{ adminToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Sync]
      summary: Rename a target or change its rules (a changed rule set bumps `rules_version`)
      operationId: updateSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                rules: { $ref: "#/components/schemas/SyncRules" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Sync]
      summary: Delete a target (files already on it stay; `409` while a job runs)
      operationId: deleteSyncTarget
      security: [{ adminToken: [] }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A job for this target is running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/sync/targets/{target}/estimate:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sync]
      summary: What the rules would hold (the stored rules, or the `rules` sent), nothing stored or prepared
      operationId: estimateSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rules: { $ref: "#/components/schemas/SyncRules" }
                free_bytes: { type: integer, minimum: 0, description: "Free space of the target; caps the budget" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncEstimate" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/sync/targets/{target}/plan:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sync]
      summary: The stateless plan from what the target holds (its manifest) to what it should hold
      description: "The client posts `have` (the manifest entries) and gets the changes: add, replace, move, remove and a count of kept entries. Nothing about the target's files is stored. Starts preparing the transcodes the plan needs (at most `SYNC_PREPARE_AHEAD` at once); entries are `preparing` until their artifact is ready, ask again then. Refused with `over_budget` (fill `all`), `nothing_to_sync` or `encoder_unavailable` (each with the estimate)."
      operationId: planSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPlanRequest" }
      responses:
        "200": { description: The plan, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validation error, or `over_budget` / `nothing_to_sync` / `encoder_unavailable` (these carry `estimate`)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      estimate: { $ref: "#/components/schemas/SyncEstimate" }
  /admin/sync/targets/{target}/report:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sync]
      summary: What the executor applied, failed and released (counts and owned totals are kept, never the file list)
      operationId: reportSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncReport" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/sync/targets/{target}/run:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sync]
      summary: Sync now on the node of a node target (queues the node job `sync.apply`)
      description: "`confirm: true` lets a plan with mass deletion (over 30 % of the owned files or over 500) go through; without it the node applies nothing destructive and reports `needs_confirmation`. One job per target: `409 target_busy`."
      operationId: runSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { confirm: { type: boolean } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: string }, status: { type: string, enum: [queued] } } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "target_busy", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`not_a_node_target` or `node_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Sync]
      summary: Cancel the running or queued job of the target (the node finishes the current file, writes its manifest and stops)
      operationId: cancelSyncRun
      security: [{ adminToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { cancelled: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/sync/targets/{target}/volume:
    parameters:
      - { name: target, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sync]
      summary: Read the drive of a node target (`scan`) or claim an unmarked one for this target (`claim`)
      description: "`scan` reports the marker, filesystem, size, free space and what the manifest holds, and writes nothing. `claim` writes `.remoment-sync/target.json` on a volume without a marker; a volume that has one is refused. Nothing is ever formatted. The answer is read from the node job (`GET /admin/nodes/{id}/jobs`)."
      operationId: volumeSyncTarget
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [scan, claim] } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: string }, status: { type: string, enum: [queued] } } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "target_busy", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`not_a_node_target`, `node_unavailable` or a validation error", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/sync/files/{target}/{key}/{fingerprint}:
    get:
      tags: [Sync]
      summary: One file of a sync, with the admin token
      description: "The same file as the signed URL of a plan, for clients that can send a header. Supports Range. `404 stale` when the fingerprint is not the right one any more (plan again), `409 preparing` while the artifact is being made (ask again shortly, never a failure)."
      operationId: downloadSyncFile
      security: [{ adminToken: [] }]
      parameters:
        - { name: target, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string }, description: "`track:{id}`" }
        - { name: fingerprint, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "206": { description: Partial content (Range request), content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: "`not_found` or `stale`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`preparing`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "`failed`: the artifact could not be made", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sync/files/{target}/{key}/{fingerprint}:
    get:
      tags: [Sync]
      summary: One file of a sync, signed (no token)
      description: "The URL from a plan: `expires` and `signature` are the authorization (403 without a valid one), valid 6 hours (`SYNC_URL_HOURS`) and bound to this target, key and fingerprint. Supports Range, so a background download resumes; a re-plan mints fresh URLs."
      operationId: downloadSyncFileSigned
      parameters:
        - { name: target, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: fingerprint, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "The file; `X-Sync-Sha256` carries its SHA-256 when known", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "206": { description: Partial content (Range request), content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "403": { description: Missing, invalid or expired signature, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`not_found` or `stale`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`preparing`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "`failed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /nodes/sync/plan:
    post:
      tags: [Sync]
      summary: The plan for the node's own target (the node's `sync.apply` job calls this)
      description: "Bearer node token. A node can only plan for the target bound to it (`403` for another), `401` for an unknown token. Same body and answer as POST /admin/sync/targets/{target}/plan, plus `target_id`."
      operationId: planSyncNode
      security: [{ nodeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SyncPlanRequest" }
                - type: object
                  required: [target_id]
                  properties:
                    target_id: { type: string }
      responses:
        "200": { description: The plan, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPlan" } } } }
        "401": { description: Unknown node token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not the node's target, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Validation error, over_budget, nothing_to_sync or encoder_unavailable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /nodes/sync/report:
    post:
      tags: [Sync]
      summary: The node's report after a sync (applied, failed, released, owned totals, free space)
      operationId: reportSyncNode
      security: [{ nodeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SyncReport" }
                - type: object
                  required: [target_id]
                  properties:
                    target_id: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } } }
        "401": { description: Unknown node token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not the node's target, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "Token from POST /admin/login (rmt_…). Only routes marked with security need it; the rest of the API is open."
    nodeToken:
      type: http
      scheme: bearer
      description: The api_token of an approved node client. Reaches only the /nodes routes.
  parameters:
    nodeJob:
      name: job
      in: path
      required: true
      schema: { type: string, description: ULID }
    device:
      name: device
      in: path
      required: true
      schema: { type: integer }
    apiToken:
      name: apiToken
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      description: Opaque; pass back `next_cursor` until it is null
      schema: { type: string }
    playerToken:
      name: token
      in: path
      required: true
      description: "`player_token` from POST /players/register (secret: the only credential of the player endpoints)"
      schema: { type: string }
    client:
      name: client
      in: query
      description: Client api_token, applies the sources hidden for that client
      schema: { type: string }
    scope:
      name: scope
      in: query
      description: >-
        What to show: a library id (`files`, `dlna`, and any library added later, see
        `GET /library/libraries`), or `local` / `streaming` (kept for compatibility: the libraries of
        that kind) / `all` (every library combined; the library list never offers this to a player UI).
        Without it the default is the leading library (DLNA when it has tracks, else Spotify), so pass
        `all` to list e.g. the playlists of every library. Anything else is 422.
      schema: { type: string, enum: [files, dlna, local, streaming, all] }

  responses:
    Unauthenticated:
      description: Missing, unknown or revoked admin token (drop it and sign in again)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id (also a record merged away by library:merge-duplicates)
    ValidationError:
      description: "Laravel validation: `{ message, errors: { field: [messages] } }`"
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    NotAvailableInProfile:
      description: "`not_available_in_profile`: the feature is not part of the profile this server runs (`GET /api/info` `features.profile`); the body also has `profile`, `required_profile` and `message`"
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [not_available_in_profile] }
              message: { type: string }
              profile: { type: string, enum: [control, standard, full] }
              required_profile: { type: string, enum: [standard, full] }
    DeviceError:
      description: unreachable (503), unsupported / not_playable / invalid (422), driver_error (502)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: unsupported }
              message: { type: string }
    PlayedOk:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok }
              track: { type: string }
              album: { type: string }
              artist: { type: string }
              playlist: { type: string }

  schemas:
    QueueHealth:
      type: object
      properties:
        queue: { type: string, example: heavy }
        state: { type: string, enum: [ok, busy, stuck, paused, unknown] }
        paused: { type: boolean }
        pausable: { type: boolean, description: "false for `health`" }
        waiting: { type: integer }
        delayed: { type: integer }
        running: { type: integer, description: "Jobs a worker has reserved" }
        oldest_waiting_at: { type: string, format: date-time, nullable: true }
        oldest_age_seconds: { type: integer, nullable: true }
        workers: { type: integer, nullable: true, description: "Worker processes listening on the queue; null when unknown" }
        worker: { type: string, enum: [present, absent, unknown] }
        failed_24h: { type: integer }
        last_progress_at: { type: string, format: date-time, nullable: true, description: "When a job of the queue last finished" }
        heartbeat_at: { type: string, format: date-time, nullable: true }
        lag_after_seconds: { type: integer }
        lagging: { type: boolean }
    SceneStep:
      type: object
      description: "An operation step (operation + device_id + params) or a delay step (type delay + seconds, 1 to 60)"
      properties:
        operation: { type: string, description: "An operationId of this contract that a scene may call (docs/api/scenes.md)", example: setVolume }
        device_id: { type: integer }
        params: { type: object, additionalProperties: true }
        type: { type: string, enum: [delay] }
        seconds: { type: number, minimum: 1, maximum: 60 }
    SceneInput:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 32, nullable: true }
        color: { type: string, example: "#4d7cff", nullable: true }
        steps: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/SceneStep" } }
        stop_on_error: { type: boolean, default: false }
        schedule_enabled: { type: boolean, default: false }
        schedule_time: { type: string, example: "07:30", nullable: true }
        schedule_days: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, nullable: true, description: "ISO weekdays, 1 Monday; null is every day" }
        triggers: { type: array, maxItems: 10, nullable: true, items: { $ref: "#/components/schemas/SceneTrigger" }, description: "What else starts the scene: an MQTT message or a device event" }
        trigger_debounce: { type: integer, minimum: 5, maximum: 3600, default: 10, description: "Seconds after a trigger starts the scene during which its other triggers are ignored" }
        alarm: { allOf: [{ $ref: "#/components/schemas/SceneAlarm" }], nullable: true }
    SceneTrigger:
      type: object
      description: |
        `type: mqtt` needs `topic` (an MQTT topic filter; the server's own `remoment/player/...` topics are refused) and
        may have `payload` (the whole message must equal it). `type: device` needs `device_id` and `event`: `state`
        with `value` playing, paused, standby or unreachable, or `source` with an optional `value` (the source's name or input).
      properties:
        type: { type: string, enum: [mqtt, device] }
        topic: { type: string, maxLength: 200, example: "home/doorbell/#" }
        payload: { type: string, maxLength: 200 }
        device_id: { type: integer }
        event: { type: string, enum: [state, source] }
        value: { type: string, maxLength: 80, example: playing }
    SceneAlarm:
      type: object
      description: Sets `start_volume` before the steps and ramps the volume up to `target_volume` over `minutes` after them
      required: [device_id, minutes, start_volume, target_volume]
      properties:
        device_id: { type: integer }
        minutes: { type: integer, minimum: 1, maximum: 60 }
        start_volume: { type: integer, minimum: 0, maximum: 100 }
        target_volume: { type: integer, minimum: 1, maximum: 100, description: "Higher than start_volume" }
    SleepTimer:
      type: object
      properties:
        id: { type: integer }
        device_id: { type: integer }
        kind: { type: string, example: sleep }
        status: { type: string, enum: [active, done, cancelled] }
        started_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        remaining_seconds: { type: integer }
        action: { type: string, enum: [stop, standby] }
        fade_seconds: { type: integer }
        original_volume: { type: integer, nullable: true, description: "The volume that is put back; null when the device did not report one" }
    SceneItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        step_count: { type: integer }
        stop_on_error: { type: boolean }
        schedule:
          type: object
          properties:
            enabled: { type: boolean }
            time: { type: string, nullable: true }
            days: { type: array, items: { type: integer }, nullable: true }
        triggers: { type: array, items: { $ref: "#/components/schemas/SceneTrigger" } }
        trigger_debounce: { type: integer }
        alarm: { allOf: [{ $ref: "#/components/schemas/SceneAlarm" }], nullable: true }
        last_run:
          type: object
          properties:
            at: { type: string, format: date-time, nullable: true }
            status: { type: string, enum: [ok, partial, failed, running], nullable: true }
            source: { type: string, enum: [api, schedule, trigger], nullable: true }
    Scene:
      allOf:
        - { $ref: "#/components/schemas/SceneItem" }
        - type: object
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/SceneStep" } }
            last_run:
              type: object
              properties:
                results: { type: array, items: { $ref: "#/components/schemas/SceneStepResult" }, nullable: true }
    SceneStepResult:
      type: object
      properties:
        index: { type: integer, nullable: true }
        type: { type: string, enum: [operation, delay, alarm] }
        operation: { type: string, nullable: true }
        device_id: { type: integer, nullable: true }
        minutes: { type: integer, description: "Alarm entry only" }
        seconds: { type: number }
        ok: { type: boolean }
        status: { type: integer, nullable: true, description: "HTTP status of the step; null for a delay or a skipped step" }
        error: { type: string, nullable: true }
        skipped: { type: boolean, description: "Present when stop_on_error ended the run before this step" }
    Alert:
      type: object
      properties:
        id: { type: integer, description: Monotonic }
        kind: { type: string, example: queue.stuck, description: "queue.stuck, scheduler.silent, backup.stale, storage.unreachable, device.offline, listener.down, network.exposed, mount.unavailable (more later: container.crashed, disk.low)" }
        key: { type: string, description: "Dedupe key within the kind: a queue name, a device or location id, '' for a single condition" }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        message: { type: string }
        device_id: { type: integer, nullable: true }
        data: { type: object, nullable: true }
        raised_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [raised, resolved] }
    SyncGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        leader:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              offset_ms: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string, example: unauthenticated }
        message: { type: string }
    ServerInfo:
      type: object
      required: [name, version, api_version, base_url, api_base_url, artwork_base_url, mqtt]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: integer, description: Bumped on breaking changes }
        base_url: { type: string }
        api_base_url: { type: string }
        artwork_base_url: { type: string, description: "Prefix artwork paths with this, taking the path from /storage/ on" }
        mqtt:
          type: object
          required: [host, port, ws_port, ws_url, topic_prefix]
          properties:
            host: { type: string }
            port: { type: integer, description: Plain MQTT over TCP }
            ws_port: { type: integer }
            ws_url: { type: string, example: "ws://192.168.1.100:9001" }
            topic_prefix: { type: string, example: remoment/player }
        placeholder:
          allOf: [{ $ref: "#/components/schemas/Artwork" }]
          nullable: true
        features:
          type: object
          description: "What this server can do beyond the base contract. Only keys that are true today are listed as true; treat a missing key as false."
          properties:
            alerts: { type: boolean, description: "GET /api/alerts exists" }
            profile: { type: string, enum: [control, standard, full], description: "The profile this server runs. Control has no library, catalogue or analysis: those endpoints answer 422 not_available_in_profile (see docs/architecture/profiles.md)" }
            analysis: { type: boolean, description: "Audio analysis of the own files is enabled (ANALYSIS_ENABLED) and the profile allows it (Full). False: Sound data (TrackAnalysis, waveform, listening modes) will not appear, so explain an empty Sound page instead of showing nothing. Always present." }
            deep_analysis: { type: boolean, description: "A deep-analysis service answers its health check (cached for a minute): POST /library/tracks/{id}/deep-analysis can queue something" }
            deep_analysis_kinds: { type: array, items: { $ref: "#/components/schemas/DeepAnalysisKind" }, description: "The kinds that can run now (sections: structure service; stems and stem_audio: stems service, only once its weights are downloaded, see GET /stems/weights). Present only when not empty." }
            scenes: { type: boolean, description: "GET /scenes exists (true in every profile)" }
            similar_tracks: { type: boolean, description: "At least one own file has a sound embedding (analysis with the ML sidecar, Full profile), so GET /library/tracks/{id}/similar and POST /devices/{id}/library/play-similar can answer. Present only when true; a single track still answers 422 not_analysed until its own file has one. See docs/api/similar-tracks.md." }
            export: { type: boolean, description: "Export from the library as zip is available: the profile has the library and own files, and ffmpeg can transcode (POST /library/exports). Present only when true." }
            sync: { type: boolean, description: "Sync to offline targets is available (POST /admin/sync/targets/{target}/plan): the profile has the library and own files and ffmpeg can make the transcodes. Present only when true." }
            export_formats: { type: array, items: { type: string, enum: [mp3, aac, opus] }, description: "The formats ffmpeg on this server can make for an export (probed with `ffmpeg -encoders`, cached); present with `export`. Profiles of other formats cannot convert files here." }
            stems_weights: { type: string, enum: [missing, downloading, ready, failed], description: "State of the opt-in Demucs weights download (see GET /stems/weights), present only with a stems service in a profile that runs deep analysis (cached 30 s). `stems` and `stem_audio` are in deep_analysis_kinds only at `ready`." }
            discover: { type: boolean, description: "GET /library/discover can answer (the profile has the library). Present only when true." }
            rip: { type: boolean, description: "The profile takes rip uploads from the ripper app (Full, with own-file storage). Present only when true." }
            media_servers: { type: boolean, description: "At least one enabled media server has complete credentials (GET /media-servers, GET /devices/{id}/media). Present only when true." }
            sleep_timer: { type: boolean, description: "The server-side sleep timer POST|GET|DELETE /devices/{id}/sleep exists (every profile; needs a real queue). Present only when true." }
            nodes: { type: boolean, description: "Nodes (clients with kind node) can register and take jobs (every profile). Present only when true." }
            line_in: { type: boolean, description: "An approved node has the line-in role switched on, so GET /line-ins lists something. Present only when true." }
            sub_devices: { type: boolean, description: "host and sub_devices in the device detail and the admin link routes (every profile). Present only when true." }
            push: { type: boolean, description: "The server holds a VAPID key pair, so POST /push/subscribe can deliver Web Push (web only; a native app does not use it). Present only when true." }
            ha_discovery: { type: boolean, description: "Home Assistant MQTT discovery is switched on. Present only when true." }
            podcasts: { type: boolean, description: "Reserved: podcasts are not built yet, the key never appears until they are." }

    ExportRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [album, playlist, artist, tracks] }
        id: { type: integer, description: "Album, playlist or artist id (a merged id resolves to the survivor); required unless type is tracks" }
        track_ids: { type: array, minItems: 1, maxItems: 5000, items: { type: integer }, description: "type tracks: library track ids, exported in this order" }
        profile: { type: string, enum: [highest, mp3-320, mp3-256, mp3-192, mp3-128, compat, aac-256, aac-192, aac-128, opus-160, opus-128, opus-96, opus-64], default: mp3-320, description: "MP3, AAC (m4a, ffmpeg's native encoder) or Opus (.opus) with a bitrate ceiling. A file at or below the ceiling in an accepted codec is copied, the rest is transcoded. Many cars and MP3 players do not play Opus, some older ones not m4a; the estimate's `format` says what the server's ffmpeg can make (a profile it cannot make: `422 encoder_unavailable` when files would be transcoded)." }
        options:
          type: object
          properties:
            layout: { type: string, enum: [tree, flat], description: "Folders Artist/Album (default for album and artist) or one flat folder with a position prefix (default for playlist and tracks)" }
            loudness: { type: string, enum: [off, album, track], default: off, description: "Level the loudness of transcoded files with a gain from the analysis (ReplayGain tags, else measured loudness against -18 LUFS), never past the stored true peak (no clipping). `album` keeps the balance between an album's tracks. Copied files are never changed (bit-exact); transcoded files without analysis data are left as they are. Tags of the baked-in gain are removed from the output." }
    ExportSelection:
      type: object
      properties:
        type: { type: string, enum: [album, playlist, artist, tracks] }
        id: { type: integer, nullable: true }
        track_ids: { type: array, items: { type: integer } }
    ExportSkipped:
      type: object
      properties:
        track_id: { type: integer }
        name: { type: string, nullable: true }
        reason: { type: string, description: "`no_own_file`, or while running `transcode_failed`, `copy_failed`, `file_missing`" }
    ExportEstimate:
      type: object
      properties:
        title: { type: string }
        selection: { $ref: "#/components/schemas/ExportSelection" }
        totals:
          type: object
          properties:
            profile: { type: string }
            tracks: { type: integer }
            exportable: { type: integer }
            copied: { type: integer }
            transcoded: { type: integer }
            skipped: { type: integer }
            estimated_bytes: { type: integer }
            parts: { type: integer }
            exceeds_limits: { type: boolean }
            exceeds: { type: array, items: { type: string, enum: [max_gb, dir_max_gb] } }
            loudness:
              type: object
              description: "The loudness option's effect on the transcoded files"
              properties:
                mode: { type: string, enum: [off, album, track] }
                leveled: { type: integer, description: "Transcoded files that get a gain" }
                unleveled: { type: integer, description: "Transcoded files with no analysis data to level them (mode not off)" }
        format:
          type: object
          nullable: true
          description: "The format the profile converts to; null for `highest`"
          properties:
            id: { type: string, enum: [mp3, aac, opus] }
            label: { type: string }
            extension: { type: string, description: "mp3, m4a or opus" }
            mime: { type: string }
            encoder: { type: string, nullable: true, description: "The ffmpeg encoder that will be used, null when the server has none" }
            available: { type: boolean }
            note: { type: string, description: "Compatibility note (for example that many cars do not play Opus)" }
        skipped: { type: array, items: { $ref: "#/components/schemas/ExportSkipped" } }
        limits:
          type: object
          properties:
            max_gb: { type: number }
            part_gb: { type: number }
            dir_max_gb: { type: number }
    SyncRules:
      type: object
      description: "The rule set of a target (docs/api/sync.md). Defaults are filled on save: profile `EXPORT_DEFAULT_PROFILE`, fill `all` (`priority` with a budget), layout `tree`, reserve 5 %, max churn 25 %."
      properties:
        selections:
          type: array
          description: "In priority order. A track belongs to the first selection that has it."
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [playlist, album, artist, favorites, recently_added, most_played] }
              id: { type: integer, description: "playlist, album and artist (ids of merged records resolve through the aliases; an id that no longer exists is skipped with a warning)" }
              limit: { type: integer, minimum: 1, description: "recently_added and most_played (most_played default 200)" }
              days: { type: integer, minimum: 1, description: "recently_added and most_played" }
        profile: { type: string, description: "An export profile (highest, mp3-*, compat, aac-*, opus-*)" }
        options:
          type: object
          properties:
            loudness: { type: string, enum: [off, album, track], default: off, description: "Baked into transcoded files only; the album mean is taken over the whole album, so a selection change never moves a level" }
            layout: { type: string, enum: [tree, flat], default: tree, description: "flat (`Artist - Title.ext`) only for exactly one playlist" }
        budget:
          type: object
          properties:
            bytes: { type: integer, nullable: true, description: "The most the target may hold; null = no cap (free space still caps it)" }
            reserve_percent: { type: integer, minimum: 0, maximum: 50, default: 5 }
        fill: { type: string, enum: [all, priority, fill_rest], description: "all: everything or refuse with over_budget; priority: selections in order, whole albums together, the first unit that does not fit stops its selection; fill_rest: priority, then the rest of the budget with favourites, most played and newest. Tracks already on the target stay while they fit (sticky)." }
        max_churn_percent: { type: integer, minimum: 0, maximum: 100, default: 25, description: "When only the library moved (the manifest's rules_version is the current one), a plan adds and drops at most this percent of the owned bytes; the rest waits for the next sync. 0 = unlimited." }
    SyncTarget:
      type: object
      properties:
        id: { type: string, description: "ULID; the id written into the marker on a node target's volume" }
        name: { type: string }
        kind: { type: string, enum: [app, node] }
        client_ref: { type: string, nullable: true }
        node_id: { type: integer, nullable: true }
        node: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string, nullable: true } } }
        rules: { $ref: "#/components/schemas/SyncRules" }
        rules_version: { type: integer }
        owned_bytes: { type: integer }
        owned_count: { type: integer }
        last_report: { type: object, nullable: true, description: "applied, failed, released counts, failures (first 20), owned_bytes, owned_count, free_bytes" }
        last_report_at: { type: string, format: date-time, nullable: true }
        last_run: { type: object, nullable: true, description: "The latest `sync.apply` of a node target: job_id, state (succeeded, failed, lost, expired, cancelled), result_state (done or needs_confirmation), started_at, finished_at, summary, error" }
        running: { type: boolean, description: "A node job for this target is queued or running" }
        created_at: { type: string, format: date-time }
    SyncEstimate:
      type: object
      properties:
        tracks: { type: integer, description: "Tracks the selections give that have an own file" }
        bytes: { type: integer, description: "Their estimated size" }
        wanted: { type: integer, description: "What fits the budget and fill policy" }
        wanted_bytes: { type: integer }
        copied: { type: integer }
        transcoded: { type: integer }
        skipped: { type: integer, description: "Tracks without an own file" }
        over_budget: { type: boolean }
        budget_bytes: { type: integer, nullable: true, description: "Usable bytes after the reserve" }
        deferred: { type: object, properties: { count: { type: integer }, bytes: { type: integer } } }
        profile: { type: string }
        fill: { type: string }
        format: { type: object, nullable: true }
        warnings: { type: array, items: { $ref: "#/components/schemas/SyncWarning" } }
    SyncWarning:
      type: object
      description: "`no_own_file` (count), `selection_not_found` (type, id), `too_large_for_fat32` (count, examples), `artifact_cache_off` (count)"
      properties:
        code: { type: string }
        count: { type: integer }
    SyncEntry:
      type: object
      description: "A manifest entry: what the target holds"
      required: [key, fingerprint, path]
      properties:
        key: { type: string, description: "`track:{canonical track id}`, survives renames and re-tagging" }
        fingerprint: { type: string, description: "Which bytes: the file's content hash for a copy, a sha1 of the source and the encode for a transcode (computable without transcoding)" }
        path: { type: string, description: "Relative to the volume root, `/`-separated" }
        size: { type: integer }
        mtime: { type: integer }
    SyncPlanRequest:
      type: object
      required: [have]
      properties:
        have: { type: array, items: { $ref: "#/components/schemas/SyncEntry" }, description: "The target's manifest (at most 200000 entries; a duplicate key is a 422)" }
        free_bytes: { type: integer, minimum: 0, description: "Free space of the target; the budget is held to it plus what the target already owns" }
        fs: { type: string, description: "Filesystem of the volume (vfat, exfat, ext4 ...): a file over 4 GB is skipped on FAT" }
        rules_version: { type: integer, description: "The `rules_version` in the target's manifest; equal to the current one means only the library moved (churn limit applies)" }
    SyncPlanOperation:
      type: object
      properties:
        key: { type: string }
        path: { type: string }
        fingerprint: { type: string }
        size: { type: integer, description: "The real size once the artifact is ready, else the estimate" }
        sha256: { type: string, nullable: true }
        state: { type: string, enum: [ready, preparing, failed] }
        url: { type: string, nullable: true, description: "Signed, relative, valid 6 hours; put the server address in front. Null unless ready." }
        error: { type: string }
        from_path: { type: string, description: "replace: the path the old file has" }
        from_size: { type: integer }
    SyncPlan:
      type: object
      properties:
        target_id: { type: string }
        rules_version: { type: integer }
        add: { type: array, items: { $ref: "#/components/schemas/SyncPlanOperation" } }
        replace: { type: array, items: { $ref: "#/components/schemas/SyncPlanOperation" } }
        move:
          type: array
          items: { type: object, properties: { key: { type: string }, path: { type: string }, from_path: { type: string } } }
        keep: { type: integer, description: "Entries that stay as they are (a count, not listed)" }
        remove:
          type: array
          description: "Only entries of the `have` that was sent: only something the server wrote can be removed"
          items: { type: object, properties: { key: { type: string }, path: { type: string }, size: { type: integer } } }
        path_conflicts: { type: array, items: { type: object }, description: "Expected empty: the planner avoids paths that another staying entry holds" }
        totals:
          type: object
          properties:
            bytes_to_add: { type: integer }
            bytes_freed: { type: integer }
            net_bytes: { type: integer }
            wanted: { type: integer }
            wanted_bytes: { type: integer }
            copied: { type: integer }
            transcoded: { type: integer }
            ready: { type: integer }
            preparing: { type: integer }
            failed: { type: integer }
        warnings: { type: array, items: { $ref: "#/components/schemas/SyncWarning" } }
        deferred: { type: object, properties: { count: { type: integer }, bytes: { type: integer } }, description: "New tracks held back by the churn limit" }
        confirm_required: { type: boolean, description: "The plan removes over 30 % of the owned entries or over 500 files (or the selection list is empty): an unattended executor applies nothing destructive" }
        remove_first: { type: boolean, description: "The additions do not fit in the free space: remove before adding" }
        budget_bytes: { type: integer, nullable: true }
    SyncReport:
      type: object
      properties:
        rules_version: { type: integer }
        applied: { type: array, items: { type: string }, description: "Keys applied" }
        failed: { type: array, items: { type: object, properties: { key: { type: string }, error: { type: string } } } }
        released: { type: array, items: { type: string }, description: "Keys the user changed on the target: no longer managed" }
        owned_bytes: { type: integer }
        owned_count: { type: integer }
        free_bytes: { type: integer }
    Export:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, done, failed, expired] }
        title: { type: string }
        selection: { $ref: "#/components/schemas/ExportSelection" }
        profile: { type: string }
        options: { type: object }
        progress:
          type: object
          properties:
            files_done: { type: integer }
            files_total: { type: integer }
            percent: { type: integer }
        totals:
          type: object
          properties:
            tracks: { type: integer, nullable: true }
            copied: { type: integer, nullable: true }
            transcoded: { type: integer, nullable: true }
            skipped: { type: integer, nullable: true }
            estimated_bytes: { type: integer, nullable: true }
            planned_parts: { type: integer, nullable: true }
        skipped: { type: array, items: { $ref: "#/components/schemas/ExportSkipped" } }
        parts:
          type: array
          description: "Only when done"
          items:
            type: object
            properties:
              part: { type: integer, description: 1-based }
              name: { type: string }
              size: { type: integer }
              files: { type: integer }
              url: { type: string, description: "Signed path valid 15 minutes; prefix the server address" }
        bytes: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    StemWeights:
      type: object
      required: [state, size, downloaded, total, percent, source, sha256, error, licence]
      properties:
        state: { type: string, enum: [missing, downloading, ready, failed] }
        model: { type: string, nullable: true, description: "The model the service runs (htdemucs, or htdemucs_6s)" }
        size: { type: integer, nullable: true, description: "Bytes on disk, once ready" }
        downloaded: { type: integer, description: "Bytes received while downloading; the file size when ready; 0 otherwise" }
        total: { type: integer, nullable: true, description: "Bytes expected (the source's Content-Length, else the pinned size)" }
        percent: { type: integer, nullable: true, minimum: 0, maximum: 100, description: "Null while the total is unknown" }
        source: { type: string, nullable: true, description: "The pinned download URL" }
        sha256: { type: string, nullable: true, description: "The pinned checksum (a file that does not match is thrown away)" }
        error: { type: string, nullable: true, description: "Why the last download failed, when `state` is failed" }
        licence:
          type: object
          required: [note, url]
          properties:
            note: { type: string, description: "Show this before starting the download: the weights' licence is unclear" }
            url: { type: string }

    DeepAnalysisKind:
      type: string
      enum: [sections, stems, stem_audio]
      description: "`sections` (where the music changes), `stems` (loudness lanes of vocals, drums, bass, other, and instrumental ranges) and `stem_audio` (the same separation, and the four stems kept as audio files for a mixer, listed by GET /library/tracks/{track}/stems; it fills `stems` too); `mood` is planned (workstream 16). An unknown kind is a 422."
    DeepAnalysisRequest:
      type: object
      required: [status, queued, estimate]
      properties:
        status: { type: string, enum: [queued, already_done, not_available] }
        queued: { type: array, items: { $ref: "#/components/schemas/DeepAnalysisKind" }, description: "Kinds that are queued or already running" }
        estimate:
          type: object
          description: "An ESTIMATE from the track length, measured on a fast machine; a small PC is slower."
          properties:
            sections_seconds: { type: integer }
            stems_seconds: { type: integer, description: "5 s + 0.5 s per second of audio by default; 1.5-2.5 s per second on a small PC" }
            stem_audio_seconds: { type: integer, description: "The stems estimate plus encoding the four files (0.05 s per second of audio by default)" }
            stems_ram_mb: { type: integer, description: "RAM the stems service needs while it works" }
    DeepAnalysisState:
      type: object
      required: [state, finished_at, version, message, stale]
      properties:
        state: { type: string, enum: [none, queued, running, done, failed] }
        finished_at: { type: string, format: date-time, nullable: true, description: "When the stored result was made, or when the last run failed" }
        version: { type: string, nullable: true, description: "Stage version of the stored result" }
        message: { type: string, nullable: true, description: "Why the last run failed (shown while state is failed)" }
        stale: { type: boolean, description: "A stored result exists from an older stage version; state is then none until it is requested again" }
        available: { type: boolean, description: "This kind's service is configured and healthy right now" }
    PlaybackLoudness:
      type: object
      properties:
        enabled: { type: boolean }
    HealthFinding:
      type: object
      properties:
        report: { type: string }
        kind: { type: string, enum: [track, album, file, group], description: "`track`: one track's file; `album`: an incomplete album, or an album with a cover problem (`covers`); `file`: a file without a track, or missing; `group`: duplicate recordings (see `copies`)" }
        title: { type: string, description: "`Artist · Track`, `Artist · Album` or a file path" }
        reason: { type: string, description: "One line, in the server's wording: `FLAC, spectrum ends at 16.5 kHz (95% sure)`, `3 of 12 tracks`. A transcode is only ever suspected." }
        track_id: { type: integer, nullable: true }
        album_id: { type: integer, nullable: true }
        artist_id: { type: integer, nullable: true }
        file:
          type: object
          nullable: true
          properties:
            path: { type: string }
            extension: { type: string, nullable: true }
            size: { type: integer, description: Bytes }
        copies:
          type: array
          nullable: true
          description: "Duplicates only: every copy, best first (lossless, then bit depth, bitrate, spectrum)"
          items:
            type: object
            properties:
              path: { type: string }
              extension: { type: string, nullable: true }
              size: { type: integer }
              track_id: { type: integer, nullable: true }
              description: { type: string, example: "MP3 · 192 kbps · spectrum ends at 19.0 kHz" }
        physical:
          type: array
          nullable: true
          description: "Physical-collection items tied to the finding's album (empty when none; null without an album or for a client token)"
          items:
            type: object
            properties:
              id: { type: integer, description: "Item id of /library/physical/{id}" }
              medium: { type: string, enum: [cd, tape, vinyl, minidisc, other] }
              ripped: { type: boolean }
              location: { type: string, nullable: true, example: Shelf B2 }
    LibraryOverview:
      type: object
      properties:
        totals:
          type: object
          properties:
            artists: { type: integer }
            albums: { type: integer }
            tracks: { type: integer }
            hours: { type: number, description: "Total duration of the tracks, one decimal" }
        decades:
          type: array
          description: "Albums per release decade, oldest first (albums with a release date from 1900 on)"
          items:
            type: object
            properties:
              decade: { type: integer, example: 1970 }
              albums: { type: integer }
        coverage:
          type: array
          description: "How complete the metadata is, as have of of. `analysed` is listed only when the library has own files; it counts files with a loudness measurement."
          items:
            type: object
            properties:
              key: { type: string, enum: [covers, genres, release_details, analysed] }
              label: { type: string }
              have: { type: integer }
              of: { type: integer }
        sound:
          type: object
          description: "Albums per mood and per tempo bucket, from analysed own files only (empty until analysis has run)"
          properties:
            moods:
              type: array
              description: "Most albums first"
              items:
                type: object
                properties:
                  name: { type: string }
                  albums: { type: integer }
            tempos:
              type: array
              description: "Always slow, steady, fast. An album counts in every bucket one of its analysed tracks falls in. BPM from inclusive, to exclusive (null: open end)."
              items:
                type: object
                properties:
                  key: { type: string, enum: [slow, steady, fast] }
                  from: { type: integer }
                  to: { type: integer, nullable: true }
                  albums: { type: integer }
        formats:
          type: array
          description: "Own files of the scope's tracks by codec (extension when the codec is unknown), bit depth and sample rate, most tracks first, at most 20 rows"
          items:
            type: object
            properties:
              codec: { type: string, nullable: true, example: flac }
              bit_depth: { type: integer, nullable: true }
              sample_rate: { type: integer, nullable: true }
              tracks: { type: integer }
        analysis:
          type: object
          nullable: true
          description: "Null when the profile has no analysis. Counts are of own files that can be analysed (not DLNA, not Spotify) and are cached for a minute."
          properties:
            enabled: { type: boolean, description: "ANALYSIS_ENABLED; false explains a zero everywhere" }
            files: { type: integer, description: "Own files that can be analysed" }
            complete: { type: integer, description: "Files with every enabled stage done" }
            with_problems: { type: integer, description: "Files with a failed or given-up stage" }
            backlog: { type: integer, description: "Files with an enabled stage still to run" }
            stages:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, enum: [loudness, waveform, quality, fingerprint, acoustid, essentia] }
                  enabled: { type: boolean }
                  reason: { type: string, nullable: true, description: "Why the stage cannot run (ffmpeg missing, analysis off …)" }
                  done: { type: integer }
                  pending: { type: integer, description: "Waiting to run (includes files changed since or a newer stage version)" }
                  failed: { type: integer, description: "Failed, will be retried" }
                  gave_up: { type: integer, description: "Failed too often, not retried" }
                  total: { type: integer, description: "Equals analysis.files; done + pending + failed + gave_up = total" }
    PlayHistoryEntry:
      type: object
      description: "One logged play. `track_id`, `album_id` and `artist_id` are null for a play that matches no library track (radio, a stream, a track logged as text)."
      properties:
        id: { type: integer }
        type: { type: string, enum: [track, radio, source], description: "`radio` for a station, `source` for line-in, TV and the like (name is the source)" }
        name: { type: string, nullable: true, description: "Track title, station name or source name" }
        artist_name: { type: string, nullable: true }
        album_name: { type: string, nullable: true }
        track_id: { type: integer, nullable: true }
        album_id: { type: integer, nullable: true }
        artist_id: { type: integer, nullable: true }
        station:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        device:
          type: object
          nullable: true
          description: "Null when the device was removed (the plays are kept)"
          properties:
            id: { type: integer }
            name: { type: string }
        library: { type: string, nullable: true, enum: [files, dlna, spotify, null], description: "The library the track is available from (own files before DLNA); null without a library track" }
        source_type: { type: string, nullable: true, example: dlna, description: "How it played (radio, dlna, spotify, line-in …) as logged" }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        duration: { type: integer, nullable: true, description: Seconds }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, description: "Null while it plays, or when the server never saw it end" }
        listened_seconds: { type: integer, nullable: true, description: "ended_at - started_at; null while ended_at is null" }
        completed: { type: boolean, description: "Closed and not skipped (a skip is a play closed within 30 s)" }
        skipped: { type: boolean }
    PlayHistoryPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlayHistoryEntry" } }
        next_cursor: { type: string, nullable: true }
    ListeningInsights:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date, description: Inclusive }
            days: { type: integer }
        timezone: { type: string, example: UTC, description: "Timezone of every hour and date here (config app.timezone)" }
        analysis: { type: boolean, description: "False when the profile has no audio analysis (Standard): parts_of_day and late.moods are then empty" }
        skips:
          type: object
          properties:
            rule:
              type: object
              properties:
                fraction: { type: number, example: 0.5, description: "A finished play of a track with a known length that lasted less than this fraction is a skip" }
                min_plays: { type: integer, example: 3, description: "Measured plays an artist needs to be listed" }
            plays: { type: integer, description: "Measured plays: finished, track length known" }
            skipped: { type: integer }
            rate: { type: number, nullable: true, description: "skipped / plays, null when nothing was measured" }
            artists:
              type: array
              description: "Highest skip rate first, at most 10"
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  plays: { type: integer }
                  skipped: { type: integer }
                  rate: { type: number }
        weekly:
          type: array
          description: "Every week (Monday start) touching the window, oldest first, zero-filled; the first and last may be partial. Plays without a library track are not counted."
          items:
            type: object
            properties:
              week: { type: string, format: date, description: "The Monday" }
              new: { type: integer, description: "Plays that were their track's first logged play ever" }
              repeat: { type: integer }
        parts_of_day:
          type: array
          description: "night, morning, afternoon, evening, always all four"
          items:
            type: object
            properties:
              part: { type: string, enum: [night, morning, afternoon, evening] }
              hours: { type: object, properties: { from: { type: integer }, until: { type: integer, description: Exclusive } } }
              plays: { type: integer }
              analysed_plays: { type: integer }
              bpm: { type: number, nullable: true, description: "Mean BPM of the analysed plays" }
              arousal: { type: number, nullable: true, description: "Mean arousal, raw 0-1" }
              tempos: { type: object, properties: { slow: { type: integer }, steady: { type: integer }, fast: { type: integer } }, description: "Plays per tempo bucket (below 90, 90-125, from 125 BPM)" }
              moods: { type: array, items: { type: object, properties: { name: { type: string }, plays: { type: integer } } }, description: "Most plays first, at most 10; a play counts for each of its moods" }
        late:
          type: object
          properties:
            hours: { type: object, properties: { from: { type: integer, example: 22 }, until: { type: integer, example: 5, description: "Exclusive, from midnight" } } }
            plays: { type: integer }
            artists: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, plays: { type: integer } } } }
            tracks: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, artist: { type: string }, plays: { type: integer } } } }
            moods: { type: array, items: { type: object, properties: { name: { type: string }, plays: { type: integer } } } }
    ListeningStats:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date, description: Inclusive }
        totals:
          type: object
          properties:
            plays: { type: integer, description: Plays logged in the range }
            seconds: { type: integer, description: "Seconds of finished plays only (ended_at - played_at); a play still open, or never closed, counts 0" }
            skipped: { type: integer, description: "Plays closed within 30 s of wall clock" }
            artists: { type: integer, description: Distinct library artists played }
            tracks: { type: integer, description: "Distinct library tracks played (text-only plays have no track)" }
        by_hour: { type: array, minItems: 24, maxItems: 24, items: { type: integer }, description: "Plays per hour of day 0-23 (server timezone)" }
        by_weekday: { type: array, minItems: 7, maxItems: 7, items: { type: integer }, description: "Plays per weekday, 0 = Sunday" }
        by_day:
          type: array
          description: "Every day of the range, oldest first, zero-filled"
          items:
            type: object
            properties:
              day: { type: string, format: date }
              plays: { type: integer }
              seconds: { type: integer }
        by_source:
          type: array
          description: "Most plays first; `unknown` when the play has no source type"
          items:
            type: object
            properties:
              source_type: { type: string, example: dlna }
              plays: { type: integer }
        by_device:
          type: array
          description: "Most plays first; only devices with plays in the range"
          items:
            type: object
            properties:
              device_id: { type: integer }
              name: { type: string, nullable: true }
              plays: { type: integer }
              seconds: { type: integer }
              by_hour: { type: array, minItems: 24, maxItems: 24, items: { type: integer } }
        top:
          type: object
          properties:
            artists:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/ArtistItem" }
                  - { type: object, properties: { plays: { type: integer } } }
            albums:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/AlbumItem" }
                  - { type: object, properties: { plays: { type: integer } } }
            tracks:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/SearchTrack" }
                  - { type: object, properties: { plays: { type: integer } } }
    TrackDetails:
      type: object
      description: "What the library shows about a track beyond its name and duration. `analysis` is null until the own file is analysed."
      properties:
        genres: { type: array, items: { type: string } }
        quality: { type: string, nullable: true, description: "Text a DLNA server reported, e.g. `FLAC · 16-bit / 44.1 kHz · 1411 kbps · stereo`" }
        credits:
          type: object
          description: "MusicBrainz credits by role (`composer`, `instrument` as `Name (guitar)` …); empty object when none"
          additionalProperties: { type: array, items: { type: string } }
        isrc: { type: string, nullable: true }
        explicit: { type: boolean, nullable: true }
        popularity: { type: integer, nullable: true, description: "Spotify, 0 to 100" }
        listeners: { type: integer, nullable: true, description: Last.fm }
        playcount: { type: integer, nullable: true, description: Last.fm }
        analysis:
          allOf: [{ $ref: "#/components/schemas/TrackAnalysis" }]
          nullable: true
        sections:
          allOf: [{ $ref: "#/components/schemas/TrackSections" }]
          nullable: true
          description: Null until requested (deep analysis)
        sections_reason: { type: string, nullable: true, enum: [too_short, no_structure, null] }
        stems: { type: object, nullable: true, additionalProperties: true, description: "Null until requested (deep analysis); see TrackStems" }
        vocal_ratio: { type: number, nullable: true }
        instrumental: { type: array, nullable: true, items: { type: object, additionalProperties: true }, description: "Instrumental ranges (stems); null until requested" }
    SoundFilter:
      type: object
      description: "Criteria over the analysis of a track's own audio file; all given criteria must hold. Same names and meaning as the query parameters of GET /library/tracks. Raw values, no normalisation. `camelot` and `mood` take a comma-separated string or a list."
      properties:
        bpm_min: { type: number }
        bpm_max: { type: number }
        camelot: { type: string, example: "8A,9A" }
        arousal_min: { type: number, minimum: 0, maximum: 1 }
        arousal_max: { type: number, minimum: 0, maximum: 1 }
        valence_min: { type: number, minimum: 0, maximum: 1 }
        valence_max: { type: number, minimum: 0, maximum: 1 }
        danceability_min: { type: number, minimum: 0, maximum: 1 }
        instrumental_min: { type: number, minimum: 0, maximum: 1 }
        plr_min: { type: number }
        mood: { type: string, example: "relaxed,happy" }
        lossless_suspect_max: { type: number, minimum: 0, maximum: 1 }
        measured_bit_depth_min: { type: integer, minimum: 1 }
        clipping: { type: integer, enum: [0, 1] }
    TrackSoundSummary:
      type: object
      description: "The few analysis values a list row carries (include=analysis), the same raw values as TrackAnalysis; each null when its stage has not run."
      properties:
        bpm: { type: number, nullable: true }
        camelot: { type: string, nullable: true }
        arousal: { type: number, nullable: true }
        valence: { type: number, nullable: true }
        danceability: { type: number, nullable: true }
        instrumental: { type: number, nullable: true }
        plr: { type: number, nullable: true }
        loudness: { type: number, nullable: true, description: LUFS }
    TrackAnalysis:
      type: object
      description: "Computed from the track's own audio file (own files only, never DLNA or Spotify). Every field is null while the stage that computes it has not run (BPM, key, danceability, mood need the Essentia sidecar; arousal, valence, instrumental and mood its ML build). null is 'no information', never zero. Values are raw; the server does not normalise energy or mood."
      properties:
        bpm: { type: number, nullable: true }
        key: { type: string, nullable: true, description: "Sharps, C to B" }
        mode: { type: string, nullable: true, enum: [major, minor, null] }
        camelot: { type: string, nullable: true, example: 8A, description: "1A to 12B" }
        loudness: { type: number, nullable: true, description: "Integrated EBU R128 loudness, LUFS" }
        loudness_range: { type: number, nullable: true, description: LU }
        true_peak: { type: number, nullable: true, description: dBFS }
        plr: { type: number, nullable: true, description: "Peak-to-loudness ratio in dB (true_peak - loudness); low is heavily compressed" }
        replaygain_track_gain: { type: number, nullable: true, description: dB }
        replaygain_album_gain: { type: number, nullable: true, description: dB }
        danceability: { type: number, nullable: true, description: "0 to 1" }
        arousal: { type: number, nullable: true, description: "0 to 1, raw (a library may only use a narrow part of it)" }
        valence: { type: number, nullable: true, description: "0 to 1, raw" }
        instrumental: { type: number, nullable: true, description: "0 to 1" }
        mood: { type: array, items: { type: string }, description: "Classifier moods; empty list when none" }
        recording_mbid: { type: string, nullable: true }
        spectral_cutoff_hz: { type: integer, nullable: true, description: "Where the spectrum falls off a cliff; null when it does not" }
        lossless_suspect: { type: number, nullable: true, description: "0 to 1 for a lossless file: how likely a transcode or upsample; null for lossy. Say 'suspected', never proof" }
        measured_bit_depth: { type: integer, nullable: true }
        clipping: { type: boolean, nullable: true }
        mono: { type: boolean, nullable: true }
        phase_issue: { type: boolean, nullable: true }
        lead_silence_ms: { type: integer, nullable: true }
        trail_silence_ms: { type: integer, nullable: true }
        decode_warnings: { type: array, items: { type: string } }
    TrackWaveform:
      type: object
      properties:
        points: { type: array, items: { type: integer, minimum: 0, maximum: 100 } }
        duration: { type: integer, nullable: true, description: Seconds }
    TrackSections:
      type: array
      description: "The sections of a track in seconds, from the structure service. Empty when it found none (see sections_reason)."
      items:
        type: object
        required: [start, end, label, confidence]
        properties:
          start: { type: number }
          end: { type: number }
          label: { type: string, nullable: true, description: "A repetition letter: the same letter = sounds like that other part. Never verse/chorus." }
          confidence: { type: number, description: "Cosine similarity to the best same-letter section, 0 when the letter is unique; not calibrated" }
    TrackStems:
      type: object
      description: "Per-stem loudness curves of a track, from the stems service (Demucs). Each lane is integer dB (RMS of the stem over one frame, relative to full scale, clamped to -80..0), one value per 1/rate_hz seconds from the start of the file. Draw each lane on its own scale."
      required: [method, rate_hz, vocals, drums, bass, other]
      properties:
        method: { type: string, example: htdemucs, description: "htdemucs, or htdemucs_6s (then also the guitar and piano lanes)" }
        rate_hz: { type: integer, example: 2 }
        vocals: { type: array, items: { type: integer, minimum: -80, maximum: 0 } }
        drums: { type: array, items: { type: integer, minimum: -80, maximum: 0 } }
        bass: { type: array, items: { type: integer, minimum: -80, maximum: 0 } }
        other: { type: array, items: { type: integer, minimum: -80, maximum: 0 } }
        guitar: { type: array, items: { type: integer, minimum: -80, maximum: 0 }, description: "Only with the htdemucs_6s model" }
        piano: { type: array, items: { type: integer, minimum: -80, maximum: 0 }, description: "Only with the htdemucs_6s model; the weakest stem" }
    InstrumentalRanges:
      type: array
      description: "Where the vocals lane stays more than 20 dB under the track's own vocal level for at least 8 s (seconds from the start of the file)."
      items:
        type: object
        required: [start, end]
        properties:
          start: { type: number }
          end: { type: number }
    State:
      type: string
      enum: [playing, standby, paused, unreachable]
    Repeat:
      type: string
      enum: [off, all, one]
    Capability:
      type: string
      enum: [media_controls, volume_control, radio_control, source_control, source_activation, multi_room, library_playback, seek, queue, queue_jump, queue_add, queue_next, queue_remove, queue_move, queue_clear, shuffle, repeat, like, power, sound_adjustment, bluetooth, device_info, battery, network_settings, wireless_speakers, wired_speakers, sleep_timer, digits, remote_control, stream_url, source_controls, move_playback, sync_group, sub_devices]
    Battery:
      type: object
      nullable: true
      properties:
        level: { type: integer, minimum: 0, maximum: 100 }
        charging: { type: boolean }
    MultiRoom:
      type: object
      nullable: true
      description: Multiroom role as the device's listener last saw it; null while unknown (ASE only for now)
      properties:
        role: { type: string, enum: [standalone, host, listener] }
        host:
          type: object
          nullable: true
          description: The device this one is joined to (role listener)
          properties: { id: { type: integer }, name: { type: string } }
        listeners:
          type: array
          description: Devices listening to this one (role host)
          items:
            type: object
            properties: { id: { type: integer }, name: { type: string } }
    Modes:
      type: object
      description: Each value is null when unknown or unsupported
      properties:
        shuffle: { type: boolean, nullable: true }
        repeat: { allOf: [{ $ref: "#/components/schemas/Repeat" }], nullable: true }
        liked: { type: boolean, nullable: true }
    Volume:
      type: object
      required: [volume]
      properties:
        volume: { type: integer, minimum: 0, maximum: 100 }
    AnnouncementClip:
      type: object
      properties:
        name: { type: string, example: chime }
        label: { type: string }
        duration_ms: { type: integer }
        builtin: { type: boolean }
    AnnouncementResult:
      type: object
      properties:
        status: { type: string, enum: [ok, partial, failed] }
        clip: { type: string }
        devices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              status: { type: string, enum: [ok, error] }
              error: { type: string, enum: [unreachable, unsupported, driver_error] }
              message: { type: string }
    PlayTag:
      type: object
      properties:
        id: { type: integer }
        uid: { type: string, description: "Upper case, letters and digits only" }
        label: { type: string, nullable: true }
        target:
          type: object
          properties:
            type: { type: string, enum: [album, artist, playlist, track, radio, physical] }
            id: { type: integer }
            name: { type: string, nullable: true }
            exists: { type: boolean }
        device:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        shuffle: { type: boolean }
        last_used_at: { type: string, nullable: true }
        url: { type: string, description: The page behind the tag's QR code }
    PlayTagInput:
      type: object
      properties:
        uid: { type: string, description: "Empty: a new uid for a QR code. Ignored on update" }
        label: { type: string, nullable: true }
        target_type: { type: string, enum: [album, artist, playlist, track, radio, physical] }
        target_id: { type: integer }
        device_id: { type: integer, nullable: true }
        shuffle: { type: boolean }
    VolumeLimits:
      type: object
      properties:
        max: { type: integer, nullable: true, description: Maximum volume }
        quiet_max: { type: integer, nullable: true, description: Maximum during quiet hours }
        quiet_from: { type: string, nullable: true, example: "22:00" }
        quiet_until: { type: string, nullable: true, example: "07:00" }
        limit: { type: integer, nullable: true, description: The limit that applies now }
    Mute:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }
    FavoriteBody:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }

    DeviceLinkKind:
      type: string
      description: borrow (a source the host borrowed from the sub device), input (an HDMI input) or source (any other source of the host)
      enum: [borrow, input, source]
    DeviceLink:
      type: object
      properties:
        id: { type: integer }
        device_id: { type: integer, description: The sub device }
        device_name: { type: string, nullable: true }
        host_device_id: { type: integer }
        host_name: { type: string, nullable: true }
        kind: { $ref: "#/components/schemas/DeviceLinkKind" }
        via: { type: string, nullable: true, description: "The host's source id or input label that selects the sub device; null for a borrow link covering every source" }
        meta:
          type: object
          description: |
            `on_activate` / `on_deactivate`: lists of `{action: power_on | power_off | source, source_id?}` run on the sub device when the link
            becomes active or ends; `follow` (`off`, `from_standby`, `always`; default `from_standby`) and `follow_off_after` (minutes):
            the follow rule; `state`: what the server keeps (read only). Anything else is refused.
          properties:
            on_activate: { type: array, items: { $ref: "#/components/schemas/DeviceLinkAction" } }
            on_deactivate: { type: array, items: { $ref: "#/components/schemas/DeviceLinkAction" } }
            follow: { type: string, enum: [off, from_standby, always] }
            follow_off_after: { type: integer, minimum: 1, maximum: 1440 }
            state: { type: object, additionalProperties: true }
        active: { type: boolean, nullable: true }
    DeviceLinkAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [power_on, power_off, source] }
        source_id: { type: string, description: "Needed for the source action" }
    DeviceList:
      type: object
      properties:
        id: { type: integer }
        device_name: { type: string }
        device_brand_name: { type: string }
        device_product_type: { type: string }
        device_driver_name: { type: string }
        ip_address: { type: string }
        state: { $ref: "#/components/schemas/State" }
        last_seen: { type: string, nullable: true }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        volume_limit: { type: integer, nullable: true, description: "The volume limit that applies now (null: none); a volume above it is lowered to it" }
        battery: { $ref: "#/components/schemas/Battery" }
        multiroom: { $ref: "#/components/schemas/MultiRoom" }
        mqtt_topic: { type: string, example: remoment/player/1 }
    DeviceDetail:
      allOf:
        - { $ref: "#/components/schemas/DeviceList" }
        - type: object
          properties:
            now_playing:
              allOf: [{ $ref: "#/components/schemas/NowPlaying" }]
              nullable: true
            supported_keys:
              type: array
              description: Only with the remote_control capability
              items: { $ref: "#/components/schemas/RemoteKey" }
            host:
              type: object
              nullable: true
              description: |
                The host this device is connected to as a sub device: the one that has its input selected now, else the oldest link.
                Null for a device that is no sub device. `via` is null for a link with none.
              properties:
                id: { type: integer }
                name: { type: string }
                via: { type: string, nullable: true }
            sub_devices:
              type: array
              description: The sub devices connected to this device (a host also has the `sub_devices` capability)
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  via: { type: string, nullable: true }
                  active: { type: boolean, nullable: true, description: "The host has this device's input or source selected now; null while unknown (a host that does not report its input)" }

    MediaServer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        driver: { type: string, description: "The server type, `jellyfin`" }
        label: { type: string }
        base_url: { type: string }
        enabled: { type: boolean }
        configured: { type: boolean, description: "Its credentials are complete (Settings > Services); a server that is not is left out of the device lists" }
        capabilities:
          type: array
          items: { type: string, enum: [continue_watching, next_up, play_on_client, sessions] }

    MediaItem:
      type: object
      description: One title of a media server, the same shape for every server type. Times are seconds.
      properties:
        id: { type: string, description: "Namespaced by the server (`3:abc`): what play takes" }
        server_id: { type: integer }
        item_id: { type: string }
        kind: { type: string, enum: [movie, episode, series, season, album, track] }
        title: { type: string, description: "The film or the series" }
        subtitle: { type: string, nullable: true, description: "The year, or `S2E3 · Episode name`" }
        year: { type: integer, nullable: true }
        image: { type: string, nullable: true, description: "A poster URL on the media server" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        resume_position: { type: number, description: "Seconds to resume from" }
        duration: { type: integer, nullable: true }
        library: { type: string, nullable: true }

    JellyfinTile:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        image: { type: string, nullable: true }
        progress: { type: integer, minimum: 0, maximum: 100 }
        ticks: { type: integer }

    RemoteKey:
      type: string
      enum: [up, down, left, right, ok, back, home, menu, source, info, guide, exit, play, pause, stop, next, previous, fast_forward, rewind, volume_up, volume_down, mute, channel_up, channel_down, red, green, yellow, blue]

    NowPlaying:
      type: object
      properties:
        track:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            source: { type: string }
            duration: { type: integer, nullable: true }
            artist:
              type: object
              nullable: true
              properties:
                name: { type: string }
                images: { type: array, items: { type: string } }
                source: { type: string }
            images: { type: array, items: { type: string } }
            meta: { type: array, items: { type: object, additionalProperties: true } }
        album:
          type: object
          nullable: true
          properties:
            name: { type: string }
            images: { type: array, items: { type: string } }
            released_at: { type: string, nullable: true }
            artist:
              type: object
              properties:
                name: { type: string }
        radio:
          type: object
          nullable: true
          properties:
            name: { type: string }
            genre: { type: string, nullable: true }
            images: { type: array, items: { type: string } }
            relay: { type: boolean, description: "Present and true while the station plays through the radio relay (converted to MP3 by this server)" }
        source:
          type: object
          nullable: true
          properties:
            name: { type: string }
            category: { type: string }
            sourceType: { type: string }
            connector: { type: string, nullable: true }
            jid: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/State" }
        position: { type: integer, nullable: true, description: Seconds into the track }
        platform: { type: string }
        type: { type: string }
        endTime: { type: string, nullable: true }
        artwork:
          allOf: [{ $ref: "#/components/schemas/Artwork" }]
          description: Absent while a new cover is still being processed; show the placeholder
        modes: { $ref: "#/components/schemas/Modes" }
        sections:
          allOf: [{ $ref: "#/components/schemas/TrackSections" }]
          description: Present only when the admin asked for the sections of the playing track (deep analysis).
        sections_reason: { type: string, enum: [too_short, no_structure], description: "Present with an empty `sections`" }
        library:
          type: object
          description: The library record behind the playing track (same lookup as the waveform; a streamed copy of an own track resolves to it). Absent when nothing matches. Ids are the surviving (canonical) ids.
          required: [track_id, album_id, artist_id]
          properties:
            track_id: { type: integer }
            album_id: { type: integer, nullable: true, description: Null for a track without an album }
            artist_id: { type: integer, nullable: true }
        lyrics:
          type: object
          description: Present when the library track has lyrics.
          properties:
            plain: { type: string, nullable: true }
            synced: { type: string, nullable: true, description: LRC text with [mm:ss.xx] stamps }
        waveform:
          type: array
          description: Present when the playing track is a library track with an analysed own file. 0-100 heights, RMS contrast-normalised per track.
          items: { type: integer, minimum: 0, maximum: 100 }
        stems: { $ref: "#/components/schemas/TrackStems" }
        vocal_ratio: { type: number, minimum: 0, maximum: 1, description: "Share of the track that is not instrumental. Present with `stems`." }
        instrumental: { $ref: "#/components/schemas/InstrumentalRanges" }

    Artwork:
      type: object
      description: Full artwork object (now playing, MQTT /data, placeholder). Take the path from /storage/ on and prefix artwork_base_url.
      properties:
        kind: { type: string, enum: [album, radio, source] }
        proxy_512: { type: string }
        proxy_320: { type: string }
        proxy_120: { type: string }
        proxy_bg: { type: string, description: "Blurred, darkened 1024x600 background" }
        proxy_bg_320x480: { type: string }
        proxy_bg_480x480: { type: string }
        colors: { type: array, items: { type: string, example: "#1a2b3c" }, description: Five dominant colors }
        safe_colors: { type: array, items: { type: string }, description: "colors lightened to >=65% lightness for text on dark backgrounds" }
    LibraryArtwork:
      type: object
      nullable: true
      description: Small artwork object of library items; null until processed
      properties:
        hash: { type: string, description: "md5 of the source image URL; stable cache key" }
        proxy_120: { type: string }
        proxy_320: { type: string }
        colors: { type: array, nullable: true, items: { type: string, example: "#1a2b3c" }, description: "Same palette as Artwork.colors; null when the cover's cache entry expired or predates the palette (proxies still present)" }
        safe_colors: { type: array, nullable: true, items: { type: string }, description: "Same as Artwork.safe_colors; null like colors" }
    PrecacheArtwork:
      type: object
      properties:
        kind: { type: string, enum: [source, playlist, album] }
        hash: { type: string }
        proxy_320: { type: string }
        proxy_120: { type: string }
        proxy_bg: { type: string }
        proxy_bg_320x480: { type: string }
        proxy_bg_480x480: { type: string }

    QueueItem:
      type: object
      properties:
        name: { type: string }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        image: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        uri: { type: string, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
    Source:
      type: object
      properties:
        source_id: { type: string }
        friendly_name: { type: string }
        source_type: { type: string }
        category: { type: string }
        in_use: { type: boolean }
        borrowed: { type: boolean }
        provider_jid: { type: string, nullable: true }
        provider_name: { type: string, nullable: true }
        input:
          type: string
          description: Physical connection such as "HDMI 5" or "AV". Absent for purely digital sources. Show it as a badge, never invent it from the name.
        active:
          type: boolean
          description: This is the selected source. Absent when the device cannot tell.
        signal:
          type: boolean
          description: The source has a signal (an HDMI box that is on). Show it as a status dot. Absent when the device cannot tell (B&O TVs report it).
        sub_device:
          type: object
          description: "A sub device is connected to the host through this source or input (device links, docs/api/sub-devices.md). A link that names no source the host lists gets an entry of its own (category `link`, `source_type` the link's kind in capitals, `source_id` and `input` = the link's `via`), after the others."
          properties:
            id: { type: integer }
            name: { type: string }
        hidden: { type: boolean, description: "Household preference; hidden sources stay out of pickers. QPlay and borrowed sources start hidden." }
        sort_order: { type: integer }
    RadioStation:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        genre: { type: string, nullable: true }
        favorite: { type: boolean }
        artwork:
          allOf: [{ $ref: "#/components/schemas/Artwork" }]
          nullable: true
        now:
          type: object
          nullable: true
          description: Cached title of the station's stream; null while unknown. Read from cache only; GET /radio/{id}/now keeps it fresh.
          properties:
            artist: { type: string, nullable: true }
            title: { type: string }
            source: { type: string, description: "icy | nts" }
    MultiroomPeer:
      type: object
      properties:
        id: { type: integer }
        device_name: { type: string }
        state: { $ref: "#/components/schemas/State" }

    ArtistItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        album_count: { type: integer }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        favorite: { type: boolean }
    AlbumItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        artist_name: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        favorite: { type: boolean }
    PlaylistItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        track_count: { type: integer }
        owner: { type: string, nullable: true }
        last_played_at: { type: string, format: date-time, nullable: true, description: When it was last started from the server; null if never }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
    PlaylistListItem:
      description: A PlaylistItem of the playlist list, with its library and how much of it exists in Local
      allOf:
        - { $ref: "#/components/schemas/PlaylistItem" }
        - type: object
          properties:
            library: { type: string, nullable: true, description: "The library the playlist belongs to (spotify); null for local and smart playlists", example: spotify }
            external: { type: boolean, description: "True only in the Local scope, for a playlist of another library listed because local_coverage >= 0.4; open it with library=dlna" }
            local_track_count: { type: integer, nullable: true, description: Tracks with a playable Local copy; null for local/smart/Local playlists }
            local_coverage: { type: number, nullable: true, description: "local_track_count / track_count, 0..1, 2 decimals; null as local_track_count" }
    Library:
      type: object
      properties:
        id: { type: string, description: "Stable id, also a valid `scope`: dlna | spotify | (deezer, tidal later)", example: dlna }
        name: { type: string, example: Local }
        kind: { type: string, enum: [local, streaming] }
        album_count: { type: integer }
        artist_count: { type: integer }
        playlist_count: { type: integer }
        playable: { type: boolean, description: "Only with `device_id`: whether that device can play this library (a non-playable library can still be browsed). Absent without it." }
        artwork:
          allOf: [{ $ref: "#/components/schemas/LibraryArtwork" }]
          nullable: true
          description: A representative cover, its most recently played album (else its newest); null until processed
    RecentItem:
      type: object
      description: Exactly one of album, playlist and station is set, matching `type`
      properties:
        type: { type: string, enum: [album, playlist, radio] }
        library: { type: string, description: "A library id, or `radio` for a station" }
        played_at: { type: string, format: date-time }
        album:
          allOf: [{ $ref: "#/components/schemas/AlbumItem" }]
          nullable: true
        playlist:
          allOf: [{ $ref: "#/components/schemas/PlaylistItem" }]
          nullable: true
        station:
          allOf: [{ $ref: "#/components/schemas/RadioStation" }]
          nullable: true
    GenreItem:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        artist_count: { type: integer }
        album_count: { type: integer }
        colors:
          type: array
          maxItems: 3
          description: >-
            Up to 3 hex colours the covers of the genre's albums share (same scope and filtering as
            album_count), dominant first, vivid ones (HSV saturation >= 0.25, value 0.2-0.95) before
            grey/black/white. Palettes come from the artwork cache (first 2 entries per cover, channels
            bucketed in steps of 32, most albums per bucket, at most 200 albums sampled). Empty when no
            cover is processed. Cached 1 hour.
          items: { type: string, pattern: "^#[0-9a-f]{6}$", example: "#2a4d8f" }
    ExternalItem:
      type: object
      properties:
        provider: { type: string }
        type: { type: string, enum: [artist, album, track, playlist] }
        id: { type: string, description: The service's own id. }
        title: { type: string }
        artist: { type: string, nullable: true }
        year: { type: string, nullable: true }
        track_count: { type: integer, nullable: true }
        image: { type: string, nullable: true, description: "The service's own image URL; show it through the artwork pipeline." }
        in_library: { type: boolean }
        library_id: { type: integer, nullable: true, description: 'The library artist, album or track when in_library.' }
    PhysicalItemInput:
      type: object
      required: [artist, title, medium]
      properties:
        artist: { type: string }
        title: { type: string }
        medium: { type: string, enum: [cd, tape, vinyl, minidisc, other] }
        year: { type: integer, nullable: true }
        barcode: { type: string, nullable: true }
        catalogue_number: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        location: { type: string, nullable: true }
        acquired_on: { type: string, format: date, nullable: true }
        release_group_mbid: { type: string, format: uuid, nullable: true }
        release_mbid: { type: string, format: uuid, nullable: true }
    PhysicalItem:
      type: object
      properties:
        id: { type: integer }
        artist: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        medium: { type: string, enum: [cd, tape, vinyl, minidisc, other] }
        barcode: { type: string, nullable: true }
        catalogue_number: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        location: { type: string, nullable: true }
        acquired_on: { type: string, nullable: true }
        album_id: { type: integer, nullable: true, description: "The library album with the same artist and title; for a ripped CD, the album the ripped files landed in." }
        release_group_mbid: { type: string, nullable: true }
        ripped: { type: boolean, description: "Set by hand, or by itself when a file with the item's MusicBrainz release id or barcode in its tags arrives (a CD ripped by the ReMoment Ripper); `album_id` then links the album." }
        ripped_at: { type: string, nullable: true }
    WantedSong:
      type: object
      properties:
        id: { type: integer }
        artist: { type: string }
        title: { type: string }
        album: { type: string, nullable: true }
        track_id: { type: integer, nullable: true, description: 'The library track of the song, when there is one.' }
        fulfilled: { type: boolean, description: 'The library track has an own file or a DLNA copy: the wish is closed.' }
        source: { type: string, enum: [history, radio, manual, streaming] }
        wanted_at: { type: string, format: date-time }
        artwork: { type: object, nullable: true, additionalProperties: true }
    CatalogueItem:
      type: object
      properties:
        id: { type: integer }
        release_group_mbid: { type: string }
        title: { type: string }
        type: { type: string, enum: [album, ep] }
        year: { type: integer, nullable: true }
        artist:
          type: object
          properties:
            id: { type: integer }
            name: { type: string, nullable: true }
        state: { type: string, enum: [owned, streamable, known], description: "Derived: owned (own files or DLNA), streamable (a streaming provider has it), known (MusicBrainz only, not playable)." }
        album_id: { type: integer, nullable: true, description: The library album when the library has it; null = missing from the library. }
        wanted: { type: boolean }
        ignored: { type: boolean }
        fulfilled: { type: boolean, description: 'Wished and now owned: the wish is closed.' }
        availability:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              library: { type: string, nullable: true }
              status: { type: string, enum: [available] }
              playable: { type: boolean, description: Only with device_id. }
        artwork: { type: object, nullable: true, additionalProperties: true }
    ArtistDetail:
      type: object
      properties:
        id: { type: integer }
        canonical_id: { type: integer, description: "The surviving id. Equal to `id` unless the id in the URL was merged away by library:merge-duplicates; then `id` is the survivor too. Replace a cached id with this. See docs/api/library.md, Merged records and stale ids." }
        name: { type: string }
        favorite: { type: boolean }
        genres: { type: array, items: { type: string } }
        plays: { type: integer, description: "Plays logged of this record (all libraries, all time); 0 when never played" }
        last_played_at: { type: string, format: date-time, nullable: true, description: "Null when never played" }
        details:
          type: object
          additionalProperties: true
          description: "bio, wikipedia_url, links, images, mood, style, tags, listeners, playcount, fanart (processed artwork object with proxy_bg backdrops, or null) … all may be null; see docs/api/library.md"
        source: { type: string, enum: [files, dlna, spotify], nullable: true, description: The library the albums are from. }
        sources:
          type: array
          description: The libraries to switch between (where the artist has tracks, plus Spotify while connected).
          items:
            type: object
            properties:
              id: { type: string, enum: [files, dlna, spotify] }
              name: { type: string }
              albums: { type: integer }
              tracks: { type: integer }
        discography:
          type: array
          description: "Only with include=discography and never for a client token: the MusicBrainz discography, newest first."
          items: { $ref: "#/components/schemas/CatalogueItem" }
        related_artists:
          type: array
          description: "Last.fm similar artists that exist in the library (only those with albums), most relevant first, at most 12. Empty while Last.fm has not been read for the artist. `artwork` is null while the cover is processed."
          items:
            type: object
            properties:
              id: { type: integer, description: "A library artist id; open it with GET /api/library/artists/{id}." }
              name: { type: string }
              artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        albums:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/AlbumItem" }
              - type: object
                properties:
                  kind: { type: string, enum: [album, single, live, compilation, edition], description: "Which shelf: single covers singles and EPs, edition special editions and regional pressings." }
    AlbumDetail:
      type: object
      properties:
        id: { type: integer }
        canonical_id: { type: integer, description: "The surviving id. Equal to `id` unless the id in the URL was merged away by library:merge-duplicates; then `id` is the survivor too. Replace a cached id with this. See docs/api/library.md, Merged records and stale ids." }
        name: { type: string }
        artist:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        year: { type: integer, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        favorite: { type: boolean }
        genres: { type: array, items: { type: string } }
        details:
          type: object
          additionalProperties: true
          description: "label, release type, mood, rating, credits … see docs/api/library.md"
        plays: { type: integer, description: "Plays logged of this record (all libraries, all time); 0 when never played" }
        last_played_at: { type: string, format: date-time, nullable: true, description: "Null when never played" }
        playable: { type: boolean }
        sources:
          type: array
          items: { type: string, enum: [files, dlna, spotify] }
          description: "Where the album's visible tracks come from, in that order (a track merged from two counts for both)."
        tracks:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              duration: { type: integer, nullable: true }
              playable: { type: boolean }
              favorite: { type: boolean }
              plays: { type: integer, description: "Plays logged of this track; 0 when never played" }
              last_played_at: { type: string, format: date-time, nullable: true }
              details: { $ref: "#/components/schemas/TrackDetails" }
    PlaylistDetail:
      type: object
      properties:
        id: { type: integer }
        canonical_id: { type: integer, description: "The surviving id. Equal to `id` unless the id in the URL was merged away by library:merge-duplicates; then `id` is the survivor too. Replace a cached id with this. See docs/api/library.md, Merged records and stale ids." }
        name: { type: string }
        owner: { type: string, nullable: true }
        last_played_at: { type: string, format: date-time, nullable: true, description: When it was last started from the server }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }
        mode: { type: string, enum: [library, local], description: "How this request would play the playlist: its own library (`library`), or the Local copies of a playlist of another library (`local`, from library=dlna)" }
        mode_library: { type: string, nullable: true, description: "The library playback goes through in that mode (spotify, dlna); null for a local/smart playlist without `library`" }
        sources:
          type: array
          items: { type: string }
          description: "Libraries the visible tracks come from (spotify, dlna); for a playlist of a library (a Spotify playlist) only that library, whatever its tracks' merged copies offer; [dlna] in local mode"
        track_count: { type: integer, description: All tracks of the playlist }
        local_track_count: { type: integer, nullable: true, description: Tracks with a playable Local copy; null for local/smart/Local playlists }
        local_coverage: { type: number, nullable: true, description: "0..1, 2 decimals; null as local_track_count" }
        smart: { type: boolean, description: Rule-based playlist }
        rules:
          type: object
          nullable: true
          description: The stored rules of a smart playlist; null otherwise
          properties:
            match: { type: string, enum: [all, any] }
            sort: { type: string, example: most_played }
            limit: { type: integer }
            rules:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: genre }
                  operator: { type: string, example: is }
                  value: { description: 'string or integer, depending on the field' }
                  text: { type: string, example: Genre is Rock }
        rules_summary: { type: string, nullable: true, example: "Genre is Rock and Times played at least 3, up to 50 tracks" }
        playable: { type: boolean }
        tracks:
          type: array
          description: First 200 tracks in playlist order
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              artist_name: { type: string, nullable: true }
              duration: { type: integer, nullable: true }
              artwork: { $ref: "#/components/schemas/LibraryArtwork", description: 'The track''s album cover, null when none or not processed' }
              playable: { type: boolean, description: "In local mode: has a local copy playable on device_id" }
              missing_locally: { type: boolean, description: "Local mode only: the track has no copy in the Local library (not playable)" }
    DiscoverSection:
      type: object
      description: One Discover shelf. `items` are AlbumItem, ArtistItem, SearchTrack, CatalogueItem or a listening mode according to `kind`, each with a `reason`.
      properties:
        key: { type: string, example: forgotten_favorites }
        title: { type: string, example: Forgotten favorites }
        description: { type: string, description: "What the shelf is, in one sentence" }
        kind: { type: string, enum: [album, artist, track, catalogue, mode] }
        seed:
          type: object
          description: "`mixes_well` only: the analysed track the tracks mix well with"
          properties:
            id: { type: integer }
            name: { type: string }
            artist_name: { type: string, nullable: true }
            bpm: { type: number }
            camelot: { type: string, example: 8A }
        items:
          type: array
          items:
            type: object
            description: "The item of the section's kind plus `reason`. Rediscover items add `last_played_at` (null when never played), `play_days` (albums, artists) or `plays` (tracks) and `favorite`; `mixes_well` tracks add bpm, camelot, key_relation, tempo_relation and tempo_diff_percent like mixes-with; `new_releases` items are CatalogueItem plus release_date."
            properties:
              id: { type: integer }
              reason: { type: string, example: "Favorite, played on 5 days, last played 1 year ago" }
              last_played_at: { type: string, format: date-time, nullable: true }
              play_days: { type: integer }
              plays: { type: integer }
              favorite: { type: boolean }
    SearchTrack:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        artist_name: { type: string, nullable: true }
        album_id: { type: integer, nullable: true, description: Null for a track without an album }
        album_name: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        artwork: { $ref: "#/components/schemas/LibraryArtwork" }

    Registration:
      type: object
      properties:
        registration_token: { type: string }
        pairing_code: { type: string, example: K7M3QX }
        status: { type: string, example: pending }
    ClientStatus:
      type: object
      properties:
        status: { type: string, enum: [pending, approved] }
        api_token: { type: string }
        type: { type: string, enum: [single, multi] }
        kind: { type: string, enum: [node], description: Present for a node only }
        client_id: { type: integer, description: "Present for a node only; the id in its MQTT topics remoment/node/{client_id}/..." }
        roles:
          type: array
          description: Present for a node only; the roles the admin has switched on
          items: { $ref: "#/components/schemas/NodeRole" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceList" }
    NodeJob:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [ping, line_in.start, line_in.stop, ripper.status, ripper.rip] }
        role: { type: string, nullable: true }
        progress: { type: object, nullable: true, description: "The last progress the node reported (phase, track, tracks, percent, detail, at)" }
        params: { type: object, additionalProperties: true }
        state: { type: string, enum: [queued, accepted, running, succeeded, failed, cancelled, expired, lost] }
        cancel_requested: { type: boolean }
        deadline_at: { type: string, format: date-time, nullable: true }
        lease_until: { type: string, format: date-time, nullable: true }
        result: { type: object, nullable: true, additionalProperties: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    Ripper:
      type: object
      properties:
        id: { type: integer, description: "The node's id (client id)" }
        name: { type: string }
        node_online: { type: boolean }
        node_state: { type: string, description: "idle, busy, error, absent or unknown (the node's own report)" }
        detail: { type: string, nullable: true }
        drive: { type: string, nullable: true }
        engine: { type: string, nullable: true }
        disc:
          type: object
          nullable: true
          properties:
            present: { type: boolean }
            audio: { type: boolean }
            disc_id: { type: string, nullable: true, description: "MusicBrainz disc id computed from the TOC" }
            tracks: { type: integer }
            checked_at: { type: string, format: date-time }
        busy: { type: boolean }
        rip_id: { type: string, nullable: true }
        probe_id: { type: string, nullable: true }
    RipCandidate:
      type: object
      properties:
        release_mbid: { type: string }
        release_group_mbid: { type: string, nullable: true }
        artist: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        label: { type: string, nullable: true }
        catalogue_number: { type: string, nullable: true }
        country: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        disc: { type: integer }
        discs: { type: integer }
        track_count: { type: integer }
        tracks:
          type: array
          items: { type: object, properties: { number: { type: integer }, title: { type: string }, artist: { type: string, nullable: true }, length: { type: integer, nullable: true } } }
    Rip:
      type: object
      description: "A disc check (kind probe) or a rip (kind rip); the id is its job id."
      properties:
        id: { type: string }
        kind: { type: string, enum: [probe, rip] }
        node_id: { type: integer }
        node_name: { type: string, nullable: true }
        state: { type: string, enum: [probing, looking_up, no_disc, not_audio, choose_release, queued, ripping, uploading, done, failed, cancelled] }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        disc: { type: object, nullable: true, description: "probe only: present, audio, disc_id, tracks" }
        lookup: { type: string, nullable: true, enum: [discid, toc, none], description: "probe only: how MusicBrainz matched the disc" }
        lookup_error: { type: string, nullable: true }
        candidates: { type: array, nullable: true, items: { $ref: "#/components/schemas/RipCandidate" }, description: "probe only: null while the lookup runs" }
        release: { type: object, description: "rip only: release_mbid, artist, title, year, barcode, tracks" }
        disc_id: { type: string, description: "rip only" }
        progress: { type: object, nullable: true, description: "rip only: phase (ripping, uploading), track, tracks, percent, detail" }
        percent: { type: integer, nullable: true, description: "rip only: overall, ripping the first 90 %, upload the rest" }
        files: { type: array, items: { type: integer }, description: "rip only: ids of the files the node uploaded" }
        warnings: { type: array, items: { type: string } }
        log: { type: string, nullable: true, description: "rip only, GET /admin/rips/{id} only: the ripper's log" }
    NodeRole:
      type: string
      enum: [ripper, line-in, player, sync-target]

    PlayerSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PlayerKind" }
        state: { type: string }
    PlayerKind:
      type: string
      description: Display only. `retro` is for old handhelds and computers.
      enum: [web, ios, esp32, retro]
    PlayerRegistration:
      type: object
      required: [name, kind]
      properties:
        token: { type: string, description: "From the first registration; omit the first time" }
        adopt_device_id: { type: integer, description: "Take over this existing player (only when `token` is not known)" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PlayerKind" }
        capabilities:
          type: array
          description: "Optional controls the player supports (default all). `media_controls` and `library_playback` are always on."
          items: { type: string, enum: [seek, queue, queue_jump, shuffle, repeat, volume_control] }
        formats:
          type: array
          description: "MIME types the player decodes (default: mp3, aac, flac, ogg, wav)"
          items: { type: string, example: audio/mpeg }
        profile:
          type: string
          enum: [mp3-lo, mp3-mid]
          description: "Wants this proxy of every track, even one it could decode (a slow link or a small decoder). Unknown values are ignored."
    PlayerRegistered:
      type: object
      properties:
        player_token: { type: string }
        device_id: { type: integer }
        name: { type: string }
        command_topic: { type: string, example: remoment/playercmd/12 }
        last_command_id: { type: integer, description: "Poll commands after this id" }
        mqtt:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            ws_port: { type: integer }
    PlayerCommand:
      type: object
      description: |
        `op` decides the other fields. `play`: `track`. `seek`: `position` (seconds). `volume`: `volume` (0-100).
        `mute`: `muted`. `resume`, `pause` and `stop` have none. `next`, `previous`, queue jumps, shuffle and
        repeat are resolved by the server into `play` or `stop`. A `pause` right after a skip means the proxy of
        the next track is being made; the `play` follows.
      required: [id, op]
      properties:
        id: { type: integer, description: "Rises per player; ignore ids you have seen" }
        op: { type: string, enum: [play, resume, pause, stop, seek, volume, mute] }
        track: { $ref: "#/components/schemas/PlayerTrack" }
        position: { type: number }
        volume: { type: integer, minimum: 0, maximum: 100 }
        muted: { type: boolean }
    PlayerTrack:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, example: "/stream/42?profile=mp3-lo", description: "A path: prefix the server's address" }
        profile: { type: string, nullable: true, description: "Proxy profile of `url`, null for the original" }
        mime: { type: string, nullable: true, description: "MIME type of what `url` serves" }
        name: { type: string }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        duration: { type: integer, nullable: true }
        images:
          type: array
          description: "Cover paths (320 px JPEG); empty until the cover is processed"
          items: { type: string }
        lite:
          type: string
          nullable: true
          example: /api/artwork/9e107d9d372bb6826bd81d3542a419d6
          description: "Base of the tiny covers: add `/{size}.{gif|bmp|pgm}` (GET /artwork/{hash}/{size}.{format}). Null until the cover is processed."
    PlayerState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [playing, paused, stopped] }
        track_id: { type: integer, nullable: true }
        position: { type: number, minimum: 0 }
        duration: { type: number, minimum: 0 }
        volume: { type: integer, minimum: 0, maximum: 100 }
        muted: { type: boolean }
        ended: { type: boolean, description: "The track finished; the server sends the next `play` (or `stop`)" }
    AdminHealth:
      type: object
      description: "GET /admin/health; see docs/api/admin-health.md"
      properties:
        ok: { type: boolean, description: "Broker up, scheduler and queue worker beating, last backup fresh and no active warning or critical alert" }
        version: { type: string }
        broker:
          type: object
          properties:
            ok: { type: boolean }
            address: { type: string }
            error: { type: string, nullable: true }
            ws_url: { type: string }
        supervisor:
          type: object
          properties:
            running: { type: boolean, nullable: true, description: "null where it cannot be told" }
        scheduler: { $ref: "#/components/schemas/AdminHealthHeartbeat" }
        queue_worker: { $ref: "#/components/schemas/AdminHealthHeartbeat" }
        queue:
          type: object
          properties:
            pending: { type: integer, nullable: true }
            failed: { type: integer, nullable: true }
        backup:
          type: object
          properties:
            ok: { type: boolean }
            last_at: { type: string, format: date-time, nullable: true }
        upgrade:
          type: object
          nullable: true
          description: "The last entry of the upgrade history"
          properties:
            from: { type: string, nullable: true }
            to: { type: string }
            at: { type: string, format: date-time }
            result: { type: string }
            backup: { type: string, nullable: true }
        radio_relay:
          type: object
          description: "As GET /radio/relays"
          properties:
            enabled: { type: boolean }
            manager: { type: boolean }
            max: { type: integer }
            data: { type: array, items: { type: object } }
        alerts:
          type: object
          properties:
            active: { type: integer }
            warning_or_critical: { type: integer }
            data: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        devices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              state: { type: string, nullable: true, enum: [playing, standby, paused, unreachable] }
              last_seen: { type: string, nullable: true }
              volume: { type: integer, nullable: true }
              listener:
                type: object
                properties:
                  running: { type: boolean }
                  state: { type: string, nullable: true }
                  since: { type: string, format: date-time, nullable: true }
                  failures: { type: integer }
                  last_error: { type: string, nullable: true }
                  retry_at: { type: string, format: date-time, nullable: true }
        ip_changes:
          type: array
          items:
            type: object
            properties:
              device_id: { type: integer }
              name: { type: string }
              from: { type: string, nullable: true }
              to: { type: string, nullable: true }
              at: { type: string, format: date-time }
    AdminHealthHeartbeat:
      type: object
      properties:
        ok: { type: boolean, description: "Beat within the last 3 minutes" }
        last_beat_at: { type: string, format: date-time, nullable: true }
    HealthServices:
      type: object
      properties:
        checked_at: { type: string, format: date-time, nullable: true }
        problems: { type: integer, description: "Probes with status error or warning" }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: musicbrainz }
              name: { type: string }
              group: { type: string }
              status: { type: string, enum: [ok, warning, error, disabled] }
              message: { type: string, description: "Secrets redacted" }
    AdminClient:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [client, node] }
        type: { type: string, enum: [single, multi] }
        status: { type: string, enum: [pending, approved] }
        pairing_code: { type: string, nullable: true, description: "Only while pending" }
        hardware_id: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        firmware_version: { type: string, nullable: true }
        build_number: { type: string, nullable: true }
        battery:
          type: object
          nullable: true
          properties:
            level: { type: integer }
            charging: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        devices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        hidden_sources: { type: array, items: { type: string } }
        roles: { type: array, items: { $ref: "#/components/schemas/NodeRole" }, description: "What a node declared" }
        enabled_roles: { type: array, items: { $ref: "#/components/schemas/NodeRole" }, description: "What the admin switched on" }
        api_token: { type: string, description: "Only in GET /admin/clients/{id}, approve and regenerate-token, never in the list" }
    AdminClientEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AdminClient" }
    MultiroomPreset:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        device_ids: { type: array, items: { type: integer }, description: "In order; the first is the host" }
        devices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    MultiroomPresetEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/MultiroomPreset" }
    MultiroomPresetActivation:
      type: object
      properties:
        status: { type: string, enum: [ok, partial, failed] }
        host:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        joined:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        failed:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              message: { type: string }
    RadioStationInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        genre: { type: string, nullable: true, maxLength: 100 }
        image_url: { type: string, format: uri, nullable: true }
        identifiers:
          type: object
          additionalProperties: { type: string, nullable: true }
          description: "Platform => identifier (`url`, `beoradio`, `tunein` ...); `url` must be a URL. An empty value removes that identifier (on create it is skipped). Names are lowercase letters, digits and underscores."
    AdminRadioStation:
      allOf:
        - { $ref: "#/components/schemas/RadioStation" }
        - type: object
          properties:
            image_url: { type: string, nullable: true, description: "The logo as stored" }
            identifiers: { type: object, additionalProperties: { type: string }, description: "Sorted by platform; {} when none" }
    AdminRadioStationEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AdminRadioStation" }
    RadioDirectoryResult:
      type: object
      description: "A station of radio-browser.info (a plain stream)"
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        image_url: { type: string, format: uri, nullable: true }
        genre: { type: string, nullable: true }
        codec: { type: string, nullable: true }
        bitrate: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        uuid: { type: string, nullable: true, description: "radio-browser.info id, kept as the radio_browser_uuid identifier" }
        homepage: { type: string, nullable: true }
    AdminDevice:
      allOf:
        - { $ref: "#/components/schemas/DeviceList" }
        - type: object
          properties:
            hidden: { type: boolean, description: "Out of the pickers; the device stays stored and listened to" }
    AdminDeviceEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AdminDevice" }
    DiscoveredDevice:
      type: object
      description: "A device a scan found that is not added yet"
      properties:
        id: { type: integer }
        device_name: { type: string }
        ip_address: { type: string }
        device_brand_name: { type: string }
        device_product_type: { type: string }
        device_driver_name: { type: string }
        last_seen_at: { type: string, format: date-time, nullable: true }
        ignored: { type: boolean }
    DiscoveryScan:
      type: object
      properties:
        state: { type: string, enum: [idle, running, done, failed], description: "failed also when a running scan did not report back for 3 minutes (no queue worker)" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          properties:
            found: { type: integer }
            new: { type: integer }
            known: { type: integer }
            summary: { type: string }
            diagnostics: { type: array, items: { type: string } }
