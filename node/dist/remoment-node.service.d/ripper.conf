# Drop-in for a node with the ripper role (docs/architecture/node-ripper.md): the unit hides devices and caps memory at
# 64 MB, which is right for a node without a drive but stops cyanrip. Install as
# /etc/systemd/system/remoment-node.service.d/ripper.conf. Unverified on a real Pi.
[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=/dev/sr0 r
DeviceAllow=char-sr r
SupplementaryGroups=cdrom
# cyanrip and its encoder run as children of the node; the 64 MB of the base unit would kill them
MemoryMax=384M
CPUWeight=20
IOWeight=10
