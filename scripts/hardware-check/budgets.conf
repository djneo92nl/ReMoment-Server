# Budgets for report.sh / run.sh (shell variable syntax, sourced). PROPOSALS, not decisions: nobody has measured a Pi yet.
# Change a number here and re-run `sh report.sh <results-dir>`; the roadmap's Pi budget (workstream 9b item 4)
# gets its final numbers from the first real runs.

# Idle memory in use (MemTotal - MemAvailable, whole host, stack idle), MB, on a 1 GB board.
BUDGET_IDLE_MB_CONTROL=600
BUDGET_IDLE_MB_STANDARD=750
# Full is not a Pi profile; this is only a warning line for a bigger host.
BUDGET_IDLE_MB_FULL=2000

# Warm web response, 95th percentile in milliseconds (20 sequential requests after one warm-up).
BUDGET_WEB_P95_MS=2000
# Peak memory in use during 10 concurrent requests, as a share of total RAM (percent).
BUDGET_BURST_PEAK_PCT=85

# Stress test: database is locked errors allowed (the gate is zero), log lines of the bad kinds allowed.
BUDGET_LOCKED_MAX=0
BUDGET_LOG_BAD_MAX=0

# CPU temperature, degrees C. Throttling: vcgencmd get_throttled must be 0x0.
BUDGET_TEMP_MAX_C=80
