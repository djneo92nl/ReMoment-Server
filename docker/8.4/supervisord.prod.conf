[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=%(ENV_APP_PORT)s
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000

[program:queue]
; QUEUE_WORKERS default workers (.env / docker-compose.prod.yml), all on the same Redis queue
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
command=/usr/bin/php /var/www/html/artisan queue:work --queue=health,default --tries=3 --sleep=3 --max-time=3600
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true

[program:storage-queue]
; scans and imports (RunStorageTask), kept off the default workers so they stay free for the health heartbeat
command=/usr/bin/php /var/www/html/artisan queue:work --queue=storage --tries=1 --sleep=5 --timeout=3600 --max-time=3600
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true

[program:analysis-queue]
; nice: its ffmpeg children inherit the low priority, so web requests and the default queue win the CPU
command=/usr/bin/nice -n 15 /usr/bin/php /var/www/html/artisan queue:work --queue=analysis --tries=1 --sleep=10 --timeout=900 --max-time=3600
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true

[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true

[program:listeners]
command=/usr/bin/php /var/www/html/artisan device:listen
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=10
