[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
; FrankenPHP (Caddy), config /etc/caddy/Caddyfile; listens on APP_PORT
command=/usr/local/bin/frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
environment=XDG_DATA_HOME="/data",XDG_CONFIG_HOME="/config"
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000

[program:queue]
; QUEUE_WORKERS default workers (.env / docker-compose.prod.yml), all on the same Redis queue
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
command=/usr/bin/php /var/www/html/artisan queue:work --queue=health,default --tries=3 --sleep=3 --memory=128 --max-time=3600 --max-jobs=1000
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
; SIGTERM lets a worker finish its job; supervisor's default of 10 s killed it mid-job. Longest default-queue job timeout is 900 s
stopwaitsecs=960

[program:storage-queue]
; scans and imports (RunStorageTask), kept off the default workers so they stay free for the health heartbeat
command=/usr/bin/php /var/www/html/artisan queue:work --queue=storage --tries=1 --sleep=5 --timeout=3600 --memory=128 --max-time=3600
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
; a scan or import runs up to 3600 s; killing it leaves the task 'running' until retry_after
stopwaitsecs=3660

[program:heavy-queue]
; jobs that run for minutes (SD-card export, uploads, transcodes), kept off the default workers so the heartbeat never waits for them
command=/usr/bin/php /var/www/html/artisan queue:work --queue=heavy,catalogue --tries=1 --sleep=5 --timeout=900 --memory=128 --max-time=3600 --max-jobs=200
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=960

[program:analysis-queue]
; nice: its ffmpeg children inherit the low priority, so web requests and the default queue win the CPU
command=/usr/bin/nice -n 15 /usr/bin/php /var/www/html/artisan queue:work --queue=analysis --tries=1 --sleep=10 --timeout=900 --memory=128 --max-time=3600 --max-jobs=200
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
; ANALYSIS_TIMEOUT is 900 s
stopwaitsecs=960

[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true

[program:listeners]
command=/usr/bin/php /var/www/html/artisan device:listen
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=10

[program:radio-relay]
command=/usr/bin/php /var/www/html/artisan radio:relay
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=0
startretries=1000000
stopasgroup=true
killasgroup=true
stopwaitsecs=10
