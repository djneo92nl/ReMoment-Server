[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
; FrankenPHP (Caddy); CADDYFILE comes from start-container (FRANKENPHP_MODE): Caddyfile.dev (here /etc/caddy/Caddyfile) or Caddyfile.dev.worker: ports 80 and SUPERVISOR_PHP_ALT_PORT
command=/usr/local/bin/frankenphp run --config %(ENV_CADDYFILE)s --adapter caddyfile
environment=XDG_DATA_HOME="/data",XDG_CONFIG_HOME="/config",LARAVEL_SAIL="1"
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; never give up: without this a few quick exits (Redis not up yet) leave the program FATAL for good
startsecs=0
startretries=1000000


[program:queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=health,default --tries=3 --sleep=3 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:history-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=history --tries=3 --sleep=2 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; started only when the profile needs it (docker/8.4/profile-env.sh, config/profile.php)
autostart=%(ENV_START_HISTORY_QUEUE)s
autorestart=true
stopasgroup=true
killasgroup=true

[program:storage-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=storage --tries=1 --sleep=5 --timeout=3600 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; started only when the profile needs it (docker/8.4/profile-env.sh, config/profile.php)
autostart=%(ENV_START_STORAGE_QUEUE)s
autorestart=true
stopasgroup=true
killasgroup=true

[program:heavy-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=heavy,catalogue --tries=1 --sleep=5 --timeout=900 --memory=128 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; started only when the profile needs it (docker/8.4/profile-env.sh, config/profile.php)
autostart=%(ENV_START_HEAVY_QUEUE)s
autorestart=true
stopasgroup=true
killasgroup=true

[program:analysis-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=analysis --tries=1 --sleep=10 --timeout=900 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; started only when the profile needs it (docker/8.4/profile-env.sh, config/profile.php)
autostart=%(ENV_START_ANALYSIS_QUEUE)s
autorestart=true
stopasgroup=true
killasgroup=true

[program:stems-queue]
; one worker: one Demucs run at a time (about 1.5 GB RAM, every core it may use for minutes), nice so the web and the other queues win the CPU
command=/usr/bin/nice -n 15 /usr/bin/php /var/www/html/artisan queue:work --queue=stems --tries=1 --sleep=10 --timeout=3300 --memory=128 --max-time=3600 --max-jobs=50
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; started only when the profile needs it (docker/8.4/profile-env.sh, config/profile.php)
autostart=%(ENV_START_STEMS_QUEUE)s
autorestart=true
stopasgroup=true
killasgroup=true
; STEMS_TIMEOUT is 3000 s plus 60 s of job overhead
stopwaitsecs=3360

[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
