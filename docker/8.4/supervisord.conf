[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-alt]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=%(ENV_SUPERVISOR_PHP_ALT_PORT)s
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=health,default --tries=3 --sleep=3 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:storage-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=storage --tries=1 --sleep=5 --timeout=3600 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:heavy-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=heavy,catalogue --tries=1 --sleep=5 --timeout=900 --memory=128 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:analysis-queue]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=analysis --tries=1 --sleep=10 --timeout=900 --max-time=3600
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:stems-queue]
; one worker: one Demucs run at a time (about 1.5 GB RAM, every core it may use for minutes), nice so the web and the other queues win the CPU
command=/usr/bin/nice -n 15 /usr/bin/php /var/www/html/artisan queue:work --queue=stems --tries=1 --sleep=10 --timeout=3300 --memory=128 --max-time=3600 --max-jobs=50
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; STEMS_TIMEOUT is 3000 s plus 60 s of job overhead
stopwaitsecs=3360

[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:listeners]
command=/usr/bin/php /var/www/html/artisan device:listen
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10

[program:radio-relay]
command=/usr/bin/php /var/www/html/artisan radio:relay
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
